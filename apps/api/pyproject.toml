[project]
name = "ai-learning-platform-api"
version = "0.0.0"
description = "Role-neutral API foundation for the AI Career Learning Platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.139.0",
  "pydantic-settings==2.14.2",
  "uvicorn[standard]>=0.35,<0.36",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "httpx>=0.28,<0.29",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_learning_platform_api"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "../../scripts"]
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["ai_learning_platform_api"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
