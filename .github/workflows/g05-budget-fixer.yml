name: G05 state budget fixer

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'product/g05-trusted-blueprint-instances' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Apply bounded exposure and evidence metadata corrections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schemas = Path('apps/api/src/ai_learning_platform_api/learning/schemas.py')
          text = schemas.read_text(encoding='utf-8')
          old = 'task_exposures: list[TaskExposureView] = Field(default_factory=list, max_length=64)'
          new = 'task_exposures: list[TaskExposureView] = Field(default_factory=list, max_length=16)'
          if old not in text:
              raise SystemExit('task exposure bound did not match expected source')
          schemas.write_text(text.replace(old, new, 1), encoding='utf-8')

          state_path = Path('plans/adaptive-product-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          g05 = next(phase for phase in state['phases'] if phase['id'] == 'G05')
          g05['implementation_evidence'] = [
              'apps/api/src/ai_learning_platform_api/learning/schemas.py',
              'apps/api/src/ai_learning_platform_api/learning/blueprints.py',
              'apps/api/src/ai_learning_platform_api/learning/blueprint_service.py',
              'apps/api/src/ai_learning_platform_api/learning/__init__.py',
              'apps/api/src/ai_learning_platform_api/persistence/service.py',
          ]
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

          test_path = Path('apps/api/tests/test_g05_blueprint_instances.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace('for _ in range(12):', 'for _ in range(20):', 1)
          test_text = test_text.replace(
              'assert len(plan.active_plan_version.task_exposures) <= 64',
              'assert len(plan.active_plan_version.task_exposures) <= 16',
              1,
          )
          test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Verify static quality
        working-directory: apps/api
        run: |
          uv run --locked ruff format ../api/src ../api/tests
          uv run --locked ruff check ../api/src ../api/tests
          uv run --locked mypy src tests ../../scripts
      - name: Commit bounded-state fix
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api plans/adaptive-product-state.json
          git commit -m 'Bound G05 exposure state and fix machine evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
