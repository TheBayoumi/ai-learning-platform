name: F04 payload phase diagnostic

on:
  push:
    branches:
      - work/f04-payload-hygiene

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - name: Capture phase-gate output
        run: |
          mkdir -p "$RUNNER_TEMP/f04-phase"
          set +e
          uv run --project apps/api --locked python scripts/phase_gate.py validate \
            --expected-sha "${{ github.sha }}" \
            >"$RUNNER_TEMP/f04-phase/phase-gate.txt" 2>&1
          echo "$?" >"$RUNNER_TEMP/f04-phase/phase-gate.exit"
      - name: Upload phase diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f04-payload-phase-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/f04-phase
          if-no-files-found: error
          retention-days: 7
      - name: Publish diagnostic status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context="F04 / payload phase diagnostic"
          -f description="Phase-gate diagnostic artifact available"
          -f target_url="$TARGET"
