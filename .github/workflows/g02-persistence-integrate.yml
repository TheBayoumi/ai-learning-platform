name: G02 durable evidence integration

on:
  push:
    branches:
      - product/g02-deterministic-evidence-state
    paths:
      - .github/workflows/g02-persistence-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/g02-deterministic-evidence-state
          fetch-depth: 0
      - name: Add durable trusted-evidence commit and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/ai_learning_platform_api/persistence/service.py")
          text = path.read_text(encoding="utf-8")

          before = "    PersistentAssessmentSubmitRequest,\n    PersistentPlanCreateRequest,\n"
          after = "    PersistentAssessmentSubmitRequest,\n    PersistentEvidenceEvaluationRequest,\n    PersistentPlanCreateRequest,\n"
          if text.count(before) != 1:
              raise SystemExit("persistent evidence request import marker mismatch")
          text = text.replace(before, after)

          marker = "    async def replan(\n"
          if text.count(marker) != 1:
              raise SystemExit("replan marker mismatch")
          method = '''    async def evaluate_evidence(\n        self,\n        *,\n        account_id: str,\n        request: PersistentEvidenceEvaluationRequest,\n    ) -> PersistentPlanView:\n        \"\"\"Commit one trusted evaluator verdict through the durable aggregate boundary.\"\"\"\n        stored = await self._load_expected(\n            account_id=account_id,\n            learner_id=request.learner_id,\n            expected_version=request.expected_version,\n        )\n        plan = self._core.evaluate_evidence(\n            state_token=self._codec.encode(stored.state),\n            verdict=request.verdict,\n        )\n        if plan.sequence == stored.state.sequence:\n            return self._view(stored)\n        return await self._commit_plan(\n            account_id=account_id,\n            stored=stored,\n            state_token=plan.state_token,\n            idempotency_key=request.idempotency_key,\n            event_type=\"learner.evidence.evaluated\",\n        )\n\n'''
          text = text.replace(marker, method + marker, 1)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/g02-persistence-integrate.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Commit trusted evidence through durable aggregate"
          git push origin HEAD:product/g02-deterministic-evidence-state
