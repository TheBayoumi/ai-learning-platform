name: Adaptive curriculum repair

on:
  push:
    branches:
      - automation/adaptive-curriculum-evidence

permissions:
  contents: write
  statuses: write

concurrency:
  group: adaptive-curriculum-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic adaptive repairs
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          web_path = Path("apps/web/components/learning-platform.tsx")
          web_text = web_path.read_text(encoding="utf-8")
          store_pattern = re.compile(
              r"  const storePlan = useCallback\(\(nextPlan: PlanView\) => \{\n"
              r"    setPlan\(nextPlan\);\n"
              r"    setReplanHours\(nextPlan\.weekly_hours\);\n"
              r"    setFocusCompetencyIds\(\[\.\.\.nextPlan\.focus_competency_ids\]\);\n"
              r"    window\.localStorage\.setItem\(SESSION_STORAGE_KEY, nextPlan\.state_token\);\n"
              r"  \}, \[\]\);"
          )
          store_replacement = """  const storePlan = useCallback(
            (nextPlan: PlanView) => {
              setPlan(nextPlan);
              setReplanHours(nextPlan.weekly_hours);
              setFocusCompetencyIds([...nextPlan.focus_competency_ids]);
              resetEvidenceForm();
              window.localStorage.setItem(SESSION_STORAGE_KEY, nextPlan.state_token);
            },
            [resetEvidenceForm]
          );"""
          web_text, store_count = store_pattern.subn(store_replacement, web_text, count=1)
          effect_pattern = re.compile(
              r"\n  useEffect\(\(\) => \{\n"
              r"    resetEvidenceForm\(\);\n"
              r"  \}, \[plan\?\.current_activity\?\.id, resetEvidenceForm\]\);\n"
          )
          web_text, effect_count = effect_pattern.subn("\n", web_text, count=1)
          if store_count != 1 or effect_count != 1:
              raise RuntimeError(
                  f"client repair counts were store={store_count}, effect={effect_count}"
              )
          web_path.write_text(web_text, encoding="utf-8", newline="\n")

          service_path = Path("apps/api/src/ai_learning_platform_api/learning/service.py")
          service_text = service_path.read_text(encoding="utf-8")
          old_available = '''        available.sort(
              key=lambda item: (
                  0 if item.kind == "review" else 1,
                  item.available_from or "",
                  item.id,
              )
          )'''
          new_available = '''        available.sort(
              key=lambda item: (
                  0 if item.kind == "review" else 1,
                  item.available_from or "",
              )
          )'''
          old_rank = '''        focus = set(focus_competency_ids)
          return sorted(
              role.competencies,
              key=lambda item: (
                  0 if item.identifier in focus else 1,
                  -(100 - mastery.get(item.identifier, 0)) * item.weight,
                  item.identifier,
              ),
          )'''
          new_rank = '''        focus_order = {
              identifier: position
              for position, identifier in enumerate(focus_competency_ids)
          }
          return sorted(
              role.competencies,
              key=lambda item: (
                  0 if item.identifier in focus_order else 1,
                  focus_order.get(item.identifier, len(focus_order)),
                  -(100 - mastery.get(item.identifier, 0)) * item.weight,
                  item.identifier,
              ),
          )'''
          if old_available not in service_text:
              raise RuntimeError("available activity sort repair anchor missing")
          if old_rank not in service_text:
              raise RuntimeError("focus rank repair anchor missing")
          service_text = service_text.replace(old_available, new_available, 1)
          service_text = service_text.replace(old_rank, new_rank, 1)
          service_path.write_text(service_text, encoding="utf-8", newline="\n")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Synchronize dependencies
        run: |
          uv sync --project apps/api --locked --all-groups
          npm install --global npm@11.18.0
          npm ci --prefix apps/web

      - name: Format and verify API
        run: |
          uv run --project apps/api --locked ruff format apps/api scripts
          uv run --project apps/api --locked ruff check --fix apps/api scripts
          uv run --project apps/api --locked ruff format --check apps/api scripts
          uv run --project apps/api --locked ruff check apps/api scripts
          uv run --project apps/api --locked mypy apps/api/src apps/api/tests scripts
          cd apps/api
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest
          uv run --locked coverage report --fail-under=95

      - name: Verify web
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Verify real runtime integration
        run: uv run --project apps/api --locked python scripts/smoke.py

      - name: Commit verified repairs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add apps/api apps/web
          git commit -m "fix(curriculum): pass adaptive slice quality gates"

      - name: Push verified repair
        run: |
          if test "$(git rev-parse HEAD)" != "${GITHUB_SHA}"; then
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish repair status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Adaptive curriculum checks passed' || 'Adaptive curriculum repair failed' }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state="$STATUS_STATE"
          -f context="Product / adaptive curriculum repair"
          -f description="$STATUS_DESCRIPTION"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
