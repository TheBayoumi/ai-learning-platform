name: PR8 strict typing repair

on:
  push:
    branches:
      - automation/assessment-calibration

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          working-directory: apps/api
      - name: Apply bounded type repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/tests/test_assessment_api.py")
          text = path.read_text(encoding="utf-8")
          updated = text.replace("from typing import Any\n", "from typing import Any, cast\n", 1)
          count = updated.count("return response.json()")
          if count not in {0, 2}:
              raise RuntimeError(f"unexpected response.json return count: {count}")
          updated = updated.replace(
              "return response.json()",
              "return cast(dict[str, Any], response.json())",
          )
          path.write_text(updated, encoding="utf-8", newline="\n")
          report = Path(".diagnostics/pr8-mypy-exact.txt")
          if report.exists():
              report.unlink()
          PY
      - name: Verify complete API gate
        working-directory: apps/api
        run: |
          uv sync --locked --all-groups
          uv run --locked ruff format --check . ../../scripts
          uv run --locked ruff check . ../../scripts
          uv run --locked mypy src tests ../../scripts
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest
          uv run --locked coverage report --fail-under=95
      - name: Commit verified repair
        run: |
          if test -z "$(git status --porcelain -- apps/api/tests/test_assessment_api.py .diagnostics/pr8-mypy-exact.txt)"; then
            exit 0
          fi
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add -A apps/api/tests/test_assessment_api.py .diagnostics/pr8-mypy-exact.txt
          git commit -m "fix(assessment): type decoded API payloads explicitly"
          git push origin "HEAD:${GITHUB_REF_NAME}"
