name: Assessment web test diagnostic

on:
  push:
    branches:
      - automation/assessment-calibration

permissions:
  contents: read
  statuses: write

concurrency:
  group: assessment-web-test-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply browser synchronization
        run: python scripts/apply_assessment_frontend_integration.py

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          npm install --global npm@11.18.0
          npm ci --prefix apps/web

      - name: Capture exact Vitest output
        shell: bash
        working-directory: apps/web
        run: |
          set +e
          npm test >"$RUNNER_TEMP/assessment-web-tests.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/assessment-web-tests.txt"
          exit "$status"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assessment-web-tests-${{ github.sha }}
          path: ${{ runner.temp }}/assessment-web-tests.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context="Product / assessment web test diagnostic"
          -f description="Exact assessment Vitest diagnostics published"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
