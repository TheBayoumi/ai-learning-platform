name: P01 refresh authoritative hashes

on:
  push:
    branches: [product/p01-identity-account-sessions]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/p01-identity-account-sessions
          persist-credentials: true
      - name: Refresh only intentionally changed authoritative hashes
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          state_path = Path('plans/autonomous-loop/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          hashes = state['authoritative_file_hashes']
          for relative in ('scripts/phase_gate.py', 'apps/web/package.json'):
              hashes[relative] = hashlib.sha256(Path(relative).read_bytes()).hexdigest()
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          PY
          git rm .github/workflows/p01-refresh-authoritative-hashes.yml
          git add plans/autonomous-loop/state.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh P01 authoritative controller hashes'
          git push origin HEAD:product/p01-identity-account-sessions
