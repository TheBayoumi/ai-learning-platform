name: G08 finalize readiness

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'product/g08-readiness-projection' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/g08-readiness-projection
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - uses: actions/setup-node@1e60f620b9541dca1515407b5ea144e2b71b71c9
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Wire API readiness contracts and phase evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schema = Path('apps/api/src/ai_learning_platform_api/learning/schemas.py')
          s = schema.read_text(encoding='utf-8')
          if 'ReadinessBlockerCode = Literal[' not in s:
              marker = 'Sha256Hex = Annotated[str, Field(pattern=r"^[0-9a-f]{64}$")]\n'
              if marker not in s:
                  raise SystemExit('G08 schema alias marker missing')
              addition = '''ReadinessBlockerCode = Literal[\n    "independent_evidence_missing",\n    "disputed_evidence_present",\n    "proof_classes_incomplete",\n    "verified_work_provenance_missing",\n    "active_misconception",\n]\n'''
              s = s.replace(marker, marker + addition, 1)
          if 'class CompetencyReadinessView' not in s:
              marker = '\n\nclass CompetencyView(StrictModel):\n'
              if marker not in s:
                  raise SystemExit('G08 CompetencyView marker missing')
              models = '''\n\nclass CompetencyReadinessView(StrictModel):\n    """Exact non-compensatory readiness blockers for one mandatory competency."""\n\n    competency_id: str\n    competency_name: str\n    mandatory: bool = True\n    evidence_status: CompetencyEvidenceStatus\n    accepted_evidence_ids: list[str] = Field(default_factory=list)\n    disputed_evidence_ids: list[str] = Field(default_factory=list)\n    satisfied_proof_classes: list[VerificationClass] = Field(default_factory=list)\n    missing_proof_classes: list[VerificationClass] = Field(default_factory=list)\n    verified_work_evidence_ids: list[str] = Field(default_factory=list)\n    active_misconception_codes: list[str] = Field(default_factory=list)\n    blocker_codes: list[ReadinessBlockerCode] = Field(default_factory=list)\n    engineering_complete: bool\n\n\nclass ReadinessProjectionView(StrictModel):\n    """Deterministic exact-profile readiness evidence projection without a score."""\n\n    role_id: str\n    role_version: str\n    graph_version: str\n    evidence_policy_version: str\n    target_role_id: str\n    target_role_version: str\n    target_validation_state: Literal["provisional", "approved"]\n    role_validation_state: Literal["provisional", "approved"]\n    claim_state: Literal["validation_locked"] = "validation_locked"\n    engineering_evidence_complete: bool\n    external_approval_required: bool = True\n    mandatory_competency_ids: list[str]\n    mandatory_gap_ids: list[str]\n    disputed_evidence_ids: list[str]\n    stale_evidence_ids: list[str]\n    verified_work_evidence_ids: list[str]\n    active_overlays: list[str]\n    unresolved_overlay_deltas: list[str]\n    exclusions: list[str]\n    uncertainties: list[str]\n    competencies: list[CompetencyReadinessView]\n'''
              s = s.replace(marker, models + marker, 1)
          plan_marker = '    work_provenance: list[WorkProvenanceState] = Field(default_factory=list)\n'
          plan_index = s.index('class PlanView(StrictModel):')
          before, after = s[:plan_index], s[plan_index:]
          if '    readiness_projection: ReadinessProjectionView | None = None\n' not in after:
              if plan_marker not in after:
                  raise SystemExit('G08 PlanView work provenance marker missing')
              after = after.replace(
                  plan_marker,
                  plan_marker + '    readiness_projection: ReadinessProjectionView | None = None\n',
                  1,
              )
              s = before + after
          schema.write_text(s, encoding='utf-8')

          init = Path('apps/api/src/ai_learning_platform_api/learning/__init__.py')
          init.write_text(
              '"""Learner diagnosis, planning, signed state, and trusted served-instance domain."""\n\n'
              'from ai_learning_platform_api.learning.readiness_service import (\n'
              '    ReadinessLearningPlanService as LearningPlanService,\n'
              ')\n\n__all__ = ["LearningPlanService"]\n',
              encoding='utf-8',
          )

          readiness = Path('apps/api/src/ai_learning_platform_api/learning/readiness.py')
          r = readiness.read_text(encoding='utf-8')
          r = r.replace(
              '    TargetView,\n',
              '    TargetView,\n    VerificationClass,\n',
              1,
          )
          r = r.replace(
              '_REQUIRED_PROOF_CLASSES = ("independent", "retention_7d", "retention_30d", "transfer")\n',
              '_REQUIRED_PROOF_CLASSES: tuple[VerificationClass, ...] = (\n'
              '    "independent",\n'
              '    "retention_7d",\n'
              '    "retention_30d",\n'
              '    "transfer",\n'
              ')\n',
              1,
          )
          r = r.replace(
              '    if role.validation_state != "approved":\n        uncertainties.append("role_profile_external_validation_pending")\n',
              '    role_validation_state = "provisional"\n'
              '    uncertainties.append("role_profile_external_validation_pending")\n',
              1,
          )
          r = r.replace(
              '        role_validation_state=role.validation_state,\n',
              '        role_validation_state=role_validation_state,\n',
              1,
          )
          readiness.write_text(r, encoding='utf-8')

          test = Path('apps/api/tests/test_g08_readiness_projection.py')
          t = test.read_text(encoding='utf-8')
          if 'RoleDefinition' not in t:
              t = t.replace(
                  'from ai_learning_platform_api.learning.catalog import ROLE_CATALOG\n',
                  'from ai_learning_platform_api.learning.catalog import ROLE_CATALOG, RoleDefinition\n',
                  1,
              )
          if '    VerificationClass,\n' not in t:
              t = t.replace(
                  '    PlanRequest,\n',
                  '    PlanRequest,\n    VerificationClass,\n',
                  1,
              )
          t = t.replace(
              '_REQUIRED = ["independent", "retention_7d", "retention_30d", "transfer"]\n',
              '_REQUIRED: list[VerificationClass] = [\n'
              '    "independent", "retention_7d", "retention_30d", "transfer"\n'
              ']\n',
              1,
          )
          t = t.replace(
              'def _base_state() -> tuple[LearnerState, object]:\n',
              'def _base_state() -> tuple[LearnerState, RoleDefinition]:\n',
              1,
          )
          t = t.replace(
              '    projection = project_readiness(state=state, role=role, target=state.target)  # type: ignore[arg-type]\n',
              '    assert state.target is not None\n'
              '    projection = project_readiness(state=state, role=role, target=state.target)\n',
          )
          if 'def test_top_level_service_projects_readiness_without_a_percentage()' not in t:
              t += '''\n\ndef test_top_level_service_projects_readiness_without_a_percentage() -> None:\n    service = _service()\n    plan = service.create_plan(PlanRequest(learner_name="Projected Learner", weekly_hours=4))\n\n    assert plan.readiness_projection is not None\n    assert plan.readiness_projection.claim_state == "validation_locked"\n    assert plan.verified_readiness_percent is None\n    assert plan.readiness_projection.mandatory_gap_ids\n'''
          test.write_text(t, encoding='utf-8')

          state_path = Path('plans/adaptive-product-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['active_phase'] = 'G08'
          phase = next(item for item in state['phases'] if item['id'] == 'G08')
          phase.update(
              {
                  'status': 'VALIDATING',
                  'branch': 'product/g08-readiness-projection',
                  'accepted_sha': None,
                  'production_acceptance': [],
              }
          )
          phase['implementation_evidence'] = [
              'apps/api/src/ai_learning_platform_api/learning/readiness.py',
              'apps/api/src/ai_learning_platform_api/learning/readiness_service.py',
              'apps/api/src/ai_learning_platform_api/learning/schemas.py',
              'apps/api/src/ai_learning_platform_api/learning/__init__.py',
              'apps/web/lib/learning-contract.ts',
              'apps/web/components/app/readiness-view.tsx',
          ]
          phase['test_evidence'] = [
              'apps/api/tests/test_g08_readiness_projection.py',
              'apps/api/tests/test_g08_human_simulation.py',
              'apps/api/tests/test_product_gate.py',
              'apps/web/tests/learning-contract.test.ts',
              'apps/web/tests/product-architecture.test.ts',
              '.github/workflows/ci.yml',
          ]
          phase['human_simulation_evidence'] = ['apps/api/tests/test_g08_human_simulation.py']
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

          gate = Path('apps/api/tests/test_product_gate.py')
          g = gate.read_text(encoding='utf-8')
          current_branch = 'product/g08-readiness-projection'
          committed_line = '    head_ref = os.environ.get("GITHUB_HEAD_REF") or '
          if committed_line in g:
              start = g.index(committed_line)
              end = g.index('\n', start)
              g = g[:start] + f'    head_ref = os.environ.get("GITHUB_HEAD_REF") or "{current_branch}"' + g[end:]
          g = g.replace(
              '    assert active.identifier == "G07"\n',
              '    assert active.identifier == "G08"\n',
              1,
          )
          gate.write_text(g, encoding='utf-8')
          PY
      - name: Wire Web readiness contract and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('apps/web/lib/learning-contract.ts')
          text = contract.read_text(encoding='utf-8')
          marker = 'export type CompetencyEvidenceStatus = "unverified" | "partial" | "independent";\n'
          if 'export type VerificationClass =' not in text:
              addition = '''export type VerificationClass =\n  | "independent"\n  | "retention_7d"\n  | "retention_30d"\n  | "transfer";\nexport type ReadinessBlockerCode =\n  | "independent_evidence_missing"\n  | "disputed_evidence_present"\n  | "proof_classes_incomplete"\n  | "verified_work_provenance_missing"\n  | "active_misconception";\n'''
              if marker not in text:
                  raise SystemExit('G08 web alias marker missing')
              text = text.replace(marker, marker + addition, 1)
          if 'export interface CompetencyReadinessView' not in text:
              marker = '\nexport interface PlanView {\n'
              models = '''\nexport interface CompetencyReadinessView {\n  readonly competency_id: string;\n  readonly competency_name: string;\n  readonly mandatory: boolean;\n  readonly evidence_status: CompetencyEvidenceStatus;\n  readonly accepted_evidence_ids: readonly string[];\n  readonly disputed_evidence_ids: readonly string[];\n  readonly satisfied_proof_classes: readonly VerificationClass[];\n  readonly missing_proof_classes: readonly VerificationClass[];\n  readonly verified_work_evidence_ids: readonly string[];\n  readonly active_misconception_codes: readonly string[];\n  readonly blocker_codes: readonly ReadinessBlockerCode[];\n  readonly engineering_complete: boolean;\n}\n\nexport interface ReadinessProjectionView {\n  readonly role_id: string;\n  readonly role_version: string;\n  readonly graph_version: string;\n  readonly evidence_policy_version: string;\n  readonly target_role_id: string;\n  readonly target_role_version: string;\n  readonly target_validation_state: "provisional" | "approved";\n  readonly role_validation_state: "provisional" | "approved";\n  readonly claim_state: "validation_locked";\n  readonly engineering_evidence_complete: boolean;\n  readonly external_approval_required: boolean;\n  readonly mandatory_competency_ids: readonly string[];\n  readonly mandatory_gap_ids: readonly string[];\n  readonly disputed_evidence_ids: readonly string[];\n  readonly stale_evidence_ids: readonly string[];\n  readonly verified_work_evidence_ids: readonly string[];\n  readonly active_overlays: readonly string[];\n  readonly unresolved_overlay_deltas: readonly string[];\n  readonly exclusions: readonly string[];\n  readonly uncertainties: readonly string[];\n  readonly competencies: readonly CompetencyReadinessView[];\n}\n'''
              if marker not in text:
                  raise SystemExit('G08 web PlanView marker missing')
              text = text.replace(marker, models + marker, 1)
          if 'readonly readiness_projection: ReadinessProjectionView | null;' not in text:
              marker = '  readonly verified_readiness_percent: number | null;\n'
              if marker not in text:
                  raise SystemExit('G08 readiness percent marker missing')
              text = text.replace(
                  marker,
                  marker + '  readonly readiness_projection: ReadinessProjectionView | null;\n',
                  1,
              )
          if 'function isReadinessProjection(' not in text:
              marker = '\nfunction isClaimState(value: unknown): value is ClaimState {\n'
              validators = '''\nfunction isVerificationClass(value: unknown): value is VerificationClass {\n  return ["independent", "retention_7d", "retention_30d", "transfer"].includes(String(value));\n}\n\nfunction isReadinessBlocker(value: unknown): value is ReadinessBlockerCode {\n  return [\n    "independent_evidence_missing",\n    "disputed_evidence_present",\n    "proof_classes_incomplete",\n    "verified_work_provenance_missing",\n    "active_misconception"\n  ].includes(String(value));\n}\n\nfunction isCompetencyReadiness(value: unknown): value is CompetencyReadinessView {\n  return (\n    isRecord(value) &&\n    typeof value.competency_id === "string" &&\n    typeof value.competency_name === "string" &&\n    value.mandatory === true &&\n    isEvidenceStatus(value.evidence_status) &&\n    isStringArray(value.accepted_evidence_ids) &&\n    isStringArray(value.disputed_evidence_ids) &&\n    Array.isArray(value.satisfied_proof_classes) &&\n    value.satisfied_proof_classes.every(isVerificationClass) &&\n    Array.isArray(value.missing_proof_classes) &&\n    value.missing_proof_classes.every(isVerificationClass) &&\n    isStringArray(value.verified_work_evidence_ids) &&\n    isStringArray(value.active_misconception_codes) &&\n    Array.isArray(value.blocker_codes) &&\n    value.blocker_codes.every(isReadinessBlocker) &&\n    typeof value.engineering_complete === "boolean"\n  );\n}\n\nfunction isReadinessProjection(value: unknown): value is ReadinessProjectionView {\n  return (\n    isRecord(value) &&\n    typeof value.role_id === "string" &&\n    typeof value.role_version === "string" &&\n    typeof value.graph_version === "string" &&\n    typeof value.evidence_policy_version === "string" &&\n    typeof value.target_role_id === "string" &&\n    typeof value.target_role_version === "string" &&\n    (value.target_validation_state === "provisional" || value.target_validation_state === "approved") &&\n    (value.role_validation_state === "provisional" || value.role_validation_state === "approved") &&\n    value.claim_state === "validation_locked" &&\n    typeof value.engineering_evidence_complete === "boolean" &&\n    value.external_approval_required === true &&\n    isStringArray(value.mandatory_competency_ids) &&\n    isStringArray(value.mandatory_gap_ids) &&\n    isStringArray(value.disputed_evidence_ids) &&\n    isStringArray(value.stale_evidence_ids) &&\n    isStringArray(value.verified_work_evidence_ids) &&\n    isStringArray(value.active_overlays) &&\n    isStringArray(value.unresolved_overlay_deltas) &&\n    isStringArray(value.exclusions) &&\n    isStringArray(value.uncertainties) &&\n    Array.isArray(value.competencies) &&\n    value.competencies.every(isCompetencyReadiness)\n  );\n}\n'''
              if marker not in text:
                  raise SystemExit('G08 web claim validator marker missing')
              text = text.replace(marker, validators + marker, 1)
          if 'isReadinessProjection(value.readiness_projection)' not in text:
              marker = '    (value.verified_readiness_percent === null ||\n      typeof value.verified_readiness_percent === "number") &&\n'
              if marker not in text:
                  raise SystemExit('G08 web plan validator readiness marker missing')
              text = text.replace(
                  marker,
                  marker
                  + '    (value.readiness_projection === null ||\n'
                  + '      isReadinessProjection(value.readiness_projection)) &&\n',
                  1,
              )
          contract.write_text(text, encoding='utf-8')

          tests = Path('apps/web/tests/learning-contract.test.ts')
          text = tests.read_text(encoding='utf-8')
          if 'const readinessProjection =' not in text:
              marker = '\nconst validPlan = {\n'
              readiness = '''\nconst readinessProjection = {\n  role_id: role.id,\n  role_version: role.version,\n  graph_version: role.graph_version,\n  evidence_policy_version: role.evidence_policy_version,\n  target_role_id: target.role_id,\n  target_role_version: target.role_version,\n  target_validation_state: "provisional" as const,\n  role_validation_state: "provisional" as const,\n  claim_state: "validation_locked" as const,\n  engineering_evidence_complete: false,\n  external_approval_required: true,\n  mandatory_competency_ids: ["python"],\n  mandatory_gap_ids: ["python"],\n  disputed_evidence_ids: [],\n  stale_evidence_ids: [],\n  verified_work_evidence_ids: [],\n  active_overlays: ["stack:Python"],\n  unresolved_overlay_deltas: ["stack:Python"],\n  exclusions: target.exclusions,\n  uncertainties: ["role_profile_external_validation_pending"],\n  competencies: [\n    {\n      competency_id: "python",\n      competency_name: "Python engineering",\n      mandatory: true,\n      evidence_status: "independent" as const,\n      accepted_evidence_ids: [evidence.evidence_id],\n      disputed_evidence_ids: [],\n      satisfied_proof_classes: ["independent"] as const,\n      missing_proof_classes: ["retention_7d", "retention_30d", "transfer"] as const,\n      verified_work_evidence_ids: [],\n      active_misconception_codes: ["boundary-condition-omission"],\n      blocker_codes: ["proof_classes_incomplete", "verified_work_provenance_missing", "active_misconception"] as const,\n      engineering_complete: false\n    }\n  ]\n};\n'''
              if marker not in text:
                  raise SystemExit('G08 web validPlan test marker missing')
              text = text.replace(marker, readiness + marker, 1)
          if '  readiness_projection: readinessProjection,\n' not in text:
              marker = '  verified_readiness_percent: null,\n'
              text = text.replace(
                  marker,
                  marker + '  readiness_projection: readinessProjection,\n',
                  1,
              )
          malformed_marker = '    expect(isPlanView({ ...validPlan, claim_state: "made-up" })).toBe(false);\n'
          if 'readiness_projection: { ...readinessProjection, claim_state: "ready_against_profile" }' not in text:
              text = text.replace(
                  malformed_marker,
                  malformed_marker
                  + '    expect(\n'
                  + '      isPlanView({\n'
                  + '        ...validPlan,\n'
                  + '        readiness_projection: { ...readinessProjection, claim_state: "ready_against_profile" }\n'
                  + '      })\n'
                  + '    ).toBe(false);\n',
                  1,
              )
          tests.write_text(text, encoding='utf-8')

          architecture = Path('apps/web/tests/product-architecture.test.ts')
          text = architecture.read_text(encoding='utf-8')
          text = text.replace(
              '    expect(readiness).toContain("Readiness conclusion");\n'
              '    expect(readiness).toContain(\'value="Locked"\');\n',
              '    expect(readiness).toContain("Public readiness claim");\n'
              '    expect(readiness).toContain("readiness_projection");\n'
              '    expect(readiness).toContain("mandatory_gap_ids");\n'
              '    expect(readiness).toContain("external approval required");\n',
              1,
          )
          architecture.write_text(text, encoding='utf-8')
          PY
      - name: Verify API readiness slice
        working-directory: apps/api
        run: |
          uv sync --locked --all-groups
          uv run --locked ruff format src tests
          uv run --locked ruff check --fix src tests
          uv run --locked ruff format src tests
          uv run --locked ruff check src tests ../../scripts
          uv run --locked mypy src tests ../../scripts
          uv run --locked pytest \
            tests/test_g08_readiness_projection.py \
            tests/test_g08_human_simulation.py \
            tests/test_g07_work_provenance.py \
            tests/test_g06_retention_transfer.py \
            tests/test_product_gate.py -q
      - name: Verify Web readiness slice
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit verified G08 and self-delete
        run: |
          git rm -f .github/workflows/g08-finalize.yml
          git add apps/api apps/web plans/adaptive-product-state.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete G08 deterministic readiness projection'
          git push origin HEAD:product/g08-readiness-projection
