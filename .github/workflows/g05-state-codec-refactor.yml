name: G05 bounded state codec refactor

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'product/g05-trusted-blueprint-instances' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Replace raw JSON state transport with bounded compressed transport
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/ai_learning_platform_api/learning/service.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import json\n', 'import json\nimport zlib\n', 1)
          marker = '_REVIEW_INTERVAL_DAYS = {0: 1, 1: 2, 2: 4, 3: 7, 4: 14}\n'
          constants = (
              marker
              + '_MAX_STATE_PAYLOAD_BYTES = 262_144\n'
              + '_STATE_COMPRESSION_PREFIX = b"Z1"\n'
          )
          if marker not in text:
              raise SystemExit('state codec constants marker missing')
          text = text.replace(marker, constants, 1)
          old = '''class SignedStateCodec:
              """Canonical HMAC codec for browser-carried learner state."""

              def __init__(self, secret: str) -> None:
                  if len(secret.encode("utf-8")) < 32:
                      raise ValueError("learner state secret must contain at least 32 UTF-8 bytes")
                  self._secret = secret.encode("utf-8")

              def encode(self, state: LearnerState) -> str:
                  payload = json.dumps(
                      state.model_dump(mode="json"),
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
                  signature = hmac.new(self._secret, payload, hashlib.sha256).digest()
                  return f"{_urlsafe_encode(payload)}.{_urlsafe_encode(signature)}"

              def decode(self, token: str) -> LearnerState:
                  if len(token) > 65_536 or token.count(".") != 1:
                      raise InvalidStateTokenError
                  encoded_payload, encoded_signature = token.split(".", maxsplit=1)
                  payload = _urlsafe_decode(encoded_payload)
                  signature = _urlsafe_decode(encoded_signature)
                  expected = hmac.new(self._secret, payload, hashlib.sha256).digest()
                  if not hmac.compare_digest(signature, expected):
                      raise InvalidStateTokenError
                  try:
                      decoded = json.loads(payload)
                      return LearnerState.model_validate(decoded)
                  except (json.JSONDecodeError, UnicodeDecodeError, ValidationError) as error:
                      raise InvalidStateTokenError from error
          '''.replace('          ', '')
          new = '''def _decode_state_payload(packed: bytes) -> bytes:
              """Decode compressed state with an explicit output bound; raw JSON is legacy-only."""
              if packed.startswith(_STATE_COMPRESSION_PREFIX):
                  decompressor = zlib.decompressobj()
                  try:
                      payload = decompressor.decompress(
                          packed[len(_STATE_COMPRESSION_PREFIX) :],
                          _MAX_STATE_PAYLOAD_BYTES + 1,
                      )
                  except zlib.error as error:
                      raise InvalidStateTokenError from error
                  if (
                      len(payload) > _MAX_STATE_PAYLOAD_BYTES
                      or not decompressor.eof
                      or decompressor.unused_data
                      or decompressor.unconsumed_tail
                  ):
                      raise InvalidStateTokenError
                  return payload
              if len(packed) > _MAX_STATE_PAYLOAD_BYTES or not packed.startswith(b"{"):
                  raise InvalidStateTokenError
              return packed


          class SignedStateCodec:
              """Canonical HMAC codec for bounded compressed browser-carried learner state."""

              def __init__(self, secret: str) -> None:
                  if len(secret.encode("utf-8")) < 32:
                      raise ValueError("learner state secret must contain at least 32 UTF-8 bytes")
                  self._secret = secret.encode("utf-8")

              def encode(self, state: LearnerState) -> str:
                  payload = json.dumps(
                      state.model_dump(mode="json"),
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
                  if len(payload) > _MAX_STATE_PAYLOAD_BYTES:
                      raise InvalidStateTokenError
                  packed = _STATE_COMPRESSION_PREFIX + zlib.compress(payload, level=9)
                  signature = hmac.new(self._secret, packed, hashlib.sha256).digest()
                  token = f"{_urlsafe_encode(packed)}.{_urlsafe_encode(signature)}"
                  if len(token) > 65_536:
                      raise InvalidStateTokenError
                  return token

              def decode(self, token: str) -> LearnerState:
                  if len(token) > 65_536 or token.count(".") != 1:
                      raise InvalidStateTokenError
                  encoded_payload, encoded_signature = token.split(".", maxsplit=1)
                  packed = _urlsafe_decode(encoded_payload)
                  signature = _urlsafe_decode(encoded_signature)
                  expected = hmac.new(self._secret, packed, hashlib.sha256).digest()
                  if not hmac.compare_digest(signature, expected):
                      raise InvalidStateTokenError
                  payload = _decode_state_payload(packed)
                  try:
                      decoded = json.loads(payload)
                      return LearnerState.model_validate(decoded)
                  except (json.JSONDecodeError, UnicodeDecodeError, ValidationError) as error:
                      raise InvalidStateTokenError from error
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('SignedStateCodec block did not match expected source')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('apps/api/tests/test_signed_state_codec_security.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'import base64\n',
              'import base64\nimport hashlib\nimport hmac\nimport json\nimport zlib\n',
              1,
          )
          tests += '''

          def _raw_token(payload: bytes) -> str:
              encoded_payload = base64.urlsafe_b64encode(payload).rstrip(b"=").decode("ascii")
              signature = hmac.new(SECRET.encode(), payload, hashlib.sha256).digest()
              encoded_signature = base64.urlsafe_b64encode(signature).rstrip(b"=").decode("ascii")
              return f"{encoded_payload}.{encoded_signature}"


          def test_signed_state_decodes_legacy_raw_json_token() -> None:
              codec, token = _canonical_token()
              state = codec.decode(token)
              payload = json.dumps(
                  state.model_dump(mode="json"),
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ).encode()

              assert codec.decode(_raw_token(payload)) == state


          def test_signed_state_rejects_compressed_payload_over_output_bound() -> None:
              codec = SignedStateCodec(SECRET)
              packed = b"Z1" + zlib.compress(b"x" * 300_000, level=9)

              with pytest.raises(InvalidStateTokenError):
                  codec.decode(_raw_token(packed))
          '''.replace('          ', '')
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Verify security and static quality
        working-directory: apps/api
        run: |
          uv run --locked ruff check --fix src/ai_learning_platform_api/learning/service.py tests/test_signed_state_codec_security.py
          uv run --locked ruff format src/ai_learning_platform_api/learning/service.py tests/test_signed_state_codec_security.py
          uv run --locked mypy src tests ../../scripts
          uv run --locked pytest tests/test_signed_state_codec_security.py tests/test_g05_blueprint_instances.py tests/test_persistent_learning_service.py
      - name: Commit bounded state codec
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          git commit -m 'Compress signed learner state within bounded transport'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
