name: G05 final review fixes v2

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'product/g05-trusted-blueprint-instances' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Apply typed final-review corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker missing: {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'apps/api/src/ai_learning_platform_api/persistence/service.py',
              '    AssessmentStartRequest,\n',
              '    AssessmentStartRequest,\n    CollisionFingerprintView,\n',
          )
          replace_once(
              'apps/api/src/ai_learning_platform_api/persistence/service.py',
              '    async def _collision_history(self, plan: PlanView) -> tuple:\n',
              '    async def _collision_history(\n'
              '        self, plan: PlanView\n'
              '    ) -> tuple[CollisionFingerprintView, ...]:\n',
          )
          replace_once(
              'apps/api/src/ai_learning_platform_api/learning/schemas.py',
              '    source_item_family_id: str = ""\n    source_blueprint_id: str = ""\n',
              '    source_item_family_id: str = ""\n'
              '    source_item_family_version: str = ""\n'
              '    source_blueprint_id: str = ""\n'
              '    source_blueprint_version: str = ""\n',
          )
          replace_once(
              'apps/api/src/ai_learning_platform_api/learning/service.py',
              '            source_item_family_id=activity.item_family_id,\n'
              '            source_blueprint_id=activity.blueprint_id,\n',
              '            source_item_family_id=activity.item_family_id,\n'
              '            source_item_family_version=activity.item_family_version,\n'
              '            source_blueprint_id=activity.blueprint_id,\n'
              '            source_blueprint_version=activity.blueprint_version,\n',
          )
          replace_once(
              'apps/api/src/ai_learning_platform_api/persistence/postgres.py',
              '    for exposure in active.task_exposures:\n'
              '        if exposure.plan_version_id != active.plan_version_id:\n'
              '            continue\n'
              '        existing = await _existing_exposure(connection, instance_id=exposure.instance_id)\n',
              '    for exposure in active.task_exposures:\n'
              '        existing = await _existing_exposure(connection, instance_id=exposure.instance_id)\n',
          )
          replace_once(
              'apps/api/src/ai_learning_platform_api/learning/blueprints.py',
              '_APPROVED_ROLE_VERSIONS = {\n'
              '    "junior-python-backend-engineer": "2026.07-provisional-1",\n'
              '    "ai-application-engineer": "2026.08-provisional-1",\n'
              '    "data-engineer": "2026.08-provisional-1",\n'
              '}\n',
              '_APPROVED_ITEM_FAMILY_ROLE_VERSIONS = {\n'
              '    "junior-python-backend-engineer": "2026.07-provisional-1",\n'
              '    "ai-application-engineer": "2026.08-provisional-1",\n'
              '    "data-engineer": "2026.08-provisional-1",\n'
              '}\n'
              '_APPROVED_BLUEPRINT_ROLE_VERSIONS = {\n'
              '    "junior-python-backend-engineer": "2026.07-provisional-1",\n'
              '    "ai-application-engineer": "2026.08-provisional-1",\n'
              '    "data-engineer": "2026.08-provisional-1",\n'
              '}\n',
          )
          replace_once(
              'apps/api/src/ai_learning_platform_api/learning/blueprints.py',
              '    if _APPROVED_ROLE_VERSIONS.get(role.identifier) != role.version:\n',
              '    if _APPROVED_BLUEPRINT_ROLE_VERSIONS.get(role.identifier) != role.version:\n',
          )
          replace_once(
              'apps/api/src/ai_learning_platform_api/learning/blueprints.py',
              '            trusted = approval is not None\n'
              '            return BlueprintIdentity(\n'
              '                item_family_id=family_id,\n'
              '                item_family_version=_ITEM_FAMILY_VERSION,\n'
              '                item_family_trust="trusted" if trusted else "legacy_unverified",\n'
              '                blueprint_id=f"blueprint-{template_hash}",\n'
              '                blueprint_version=_BLUEPRINT_VERSION,\n'
              '                blueprint_trust="trusted" if trusted else "legacy_unverified",\n',
              '            family_trusted = (\n'
              '                _APPROVED_ITEM_FAMILY_ROLE_VERSIONS.get(role.identifier) == role.version\n'
              '            )\n'
              '            blueprint_trusted = approval is not None\n'
              '            return BlueprintIdentity(\n'
              '                item_family_id=family_id,\n'
              '                item_family_version=_ITEM_FAMILY_VERSION,\n'
              '                item_family_trust=(\n'
              '                    "trusted" if family_trusted else "legacy_unverified"\n'
              '                ),\n'
              '                blueprint_id=f"blueprint-{template_hash}",\n'
              '                blueprint_version=_BLUEPRINT_VERSION,\n'
              '                blueprint_trust=(\n'
              '                    "trusted" if blueprint_trusted else "legacy_unverified"\n'
              '                ),\n',
          )

          edge = Path('apps/api/tests/test_g05_trust_edge_cases.py')
          edge_text = edge.read_text(encoding='utf-8')
          marker = '\ndef test_similarity_and_collision_checks_cover_exact_near_and_distinct_cases() -> None:\n'
          addition = '''\n\ndef test_item_family_and_blueprint_trust_can_be_demoted_independently(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    import ai_learning_platform_api.learning.blueprints as blueprints_module\n\n    role = ROLE_CATALOG["junior-python-backend-engineer"]\n    activity = _catalog_activity()\n    identity = blueprint_identity(role, activity)\n    assert identity.item_family_trust == "trusted"\n    assert identity.blueprint_trust == "trusted"\n    monkeypatch.setitem(\n        blueprints_module._APPROVED_ITEM_FAMILY_ROLE_VERSIONS,\n        role.identifier,\n        "different-unapproved-version",\n    )\n    separated = blueprint_identity(role, activity)\n    assert separated.item_family_trust == "legacy_unverified"\n    assert separated.blueprint_trust == "trusted"\n    assert attach_blueprint_identity(role=role, activity=activity).high_stakes_eligible is False\n'''
          if 'test_item_family_and_blueprint_trust_can_be_demoted_independently' not in edge_text:
              edge.write_text(edge_text.replace(marker, addition + marker, 1), encoding='utf-8')

          durable = Path('apps/api/tests/test_g05_durable_exposure_index.py')
          text = durable.read_text(encoding='utf-8')
          if 'PersistentPlanImportRequest' not in text:
              text = text.replace(
                  'from ai_learning_platform_api.persistence.postgres import PostgresLearnerStateRepository\n',
                  'from ai_learning_platform_api.persistence.postgres import PostgresLearnerStateRepository\n'
                  'from ai_learning_platform_api.persistence.schemas import PersistentPlanImportRequest\n',
                  1,
              )
          old = (
              '    assert evidence.source_blueprint_id == activity.blueprint_id\n'
              '    assert evidence.source_blueprint_approval_id == activity.blueprint_approval_id\n'
          )
          new = (
              '    assert evidence.source_item_family_id == activity.item_family_id\n'
              '    assert evidence.source_item_family_version == activity.item_family_version\n'
              '    assert evidence.source_blueprint_id == activity.blueprint_id\n'
              '    assert evidence.source_blueprint_version == activity.blueprint_version\n'
              '    assert evidence.source_blueprint_approval_id == activity.blueprint_approval_id\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          if 'test_browser_import_fails_closed_without_rebinding_served_work' not in text:
              text += '''\n\ndef test_browser_import_fails_closed_without_rebinding_served_work() -> None:\n    core = LearningPlanService(_SECRET, clock=lambda: _NOW)\n    plan = core.create_plan(PlanRequest(learner_name="Browser Import", weekly_hours=4))\n    activity = plan.current_activity\n    assert activity is not None\n    progressed = core.complete_activity(\n        ProgressRequest(\n            state_token=plan.state_token,\n            activity_id=activity.id,\n            reflection="Completed the already-served browser task before import.",\n            evidence_reference="repo://browser-import",\n            criteria_met=list(activity.acceptance_criteria),\n            confidence=4,\n        )\n    )\n    collision = _fingerprint(progressed.active_plan_version.task_exposures[0])\n    service = _persistent_service(ExposureRepository(collision))\n    with pytest.raises(TaskExposureConflictError):\n        asyncio.run(\n            service.import_plan(\n                account_id="cccccccc-cccc-4ccc-8ccc-cccccccccccc",\n                request=PersistentPlanImportRequest(\n                    idempotency_key="g05-browser-import-0001",\n                    state_token=progressed.state_token,\n                ),\n            )\n        )\n    resumed = core.resume(progressed.state_token)\n    assert resumed.state_token == progressed.state_token\n    assert resumed.evidence_history[-1].source_plan_version_id == (\n        progressed.evidence_history[-1].source_plan_version_id\n    )\n'''
          durable.write_text(text, encoding='utf-8')
          PY
      - name: Verify typed patch
        working-directory: apps/api
        run: |
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check src tests migrations/versions
          uv run --locked mypy src tests ../../scripts
          uv run --locked pytest \
            tests/test_g05_blueprint_instances.py \
            tests/test_g05_human_simulation.py \
            tests/test_g05_durable_exposure_index.py \
            tests/test_g05_trust_edge_cases.py \
            tests/test_evidence_state.py -q
      - name: Commit verified patch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          git commit -m 'Close G05 final trust and import review gaps'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
