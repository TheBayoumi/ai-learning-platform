name: G05 review trust-boundary fixes

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'product/g05-trusted-blueprint-instances' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Apply G05 reviewer trust-boundary fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          schemas = Path('apps/api/src/ai_learning_platform_api/learning/schemas.py')
          text = schemas.read_text(encoding='utf-8')
          old = '    next_review_at: str\n\n\nclass EvidenceEvaluationRecord'
          new = '''    next_review_at: str
              source_item_family_id: str = ""
              source_blueprint_id: str = ""
              source_rubric_version: str = ""
              source_plan_version_id: str = ""
              source_semantic_fingerprint: str = ""
              source_high_stakes_eligible: bool = False


          class EvidenceEvaluationRecord'''.replace('          ', '')
          if old not in text:
              raise SystemExit('EvidenceRecordView insertion point missing')
          schemas.write_text(text.replace(old, new, 1), encoding='utf-8')

          service = Path('apps/api/src/ai_learning_platform_api/learning/service.py')
          text = service.read_text(encoding='utf-8')
          old = '            next_review_at=review_at.isoformat(),\n        )\n'
          new = '''            next_review_at=review_at.isoformat(),
              source_item_family_id=activity.item_family_id,
              source_blueprint_id=activity.blueprint_id,
              source_rubric_version=activity.rubric_version,
              source_plan_version_id=activity.plan_version_id,
              source_semantic_fingerprint=activity.semantic_fingerprint,
              source_high_stakes_eligible=activity.high_stakes_eligible,
          )
          '''.replace('          ', '')
          if old not in text:
              raise SystemExit('EvidenceRecordView construction point missing')
          service.write_text(text.replace(old, new, 1), encoding='utf-8')

          blueprints = Path('apps/api/src/ai_learning_platform_api/learning/blueprints.py')
          text = blueprints.read_text(encoding='utf-8')
          old = '''        semantic_tokens = [
              f"b:{_digest(activity.blueprint_id, 8)}",
              f"d:{domain_index:02d}",
              f"f:{failure_index:02d}",
              f"c:{constraint_index:02d}",
          ]'''.replace('          ', '')
          new = '''        semantic_tokens = [
              f"b:{_digest(activity.blueprint_id, 8)}",
              f"u:{_digest(learner_id, 8)}",
              f"d:{domain_index:02d}",
              f"f:{failure_index:02d}",
              f"c:{constraint_index:02d}",
          ]'''.replace('          ', '')
          if old not in text:
              raise SystemExit('semantic token block missing')
          blueprints.write_text(text.replace(old, new, 1), encoding='utf-8')

          blueprint_service = Path('apps/api/src/ai_learning_platform_api/learning/blueprint_service.py')
          text = blueprint_service.read_text(encoding='utf-8')
          marker = '''class UntrustedInstanceEvidenceError(LearningPlanError):
              """Trusted evaluator evidence cannot be accepted from an untrusted generated instance."""

              code = "UNTRUSTED_TASK_INSTANCE"
          '''.replace('          ', '')
          replacement = marker + '''

          class EvidenceRubricMismatchError(LearningPlanError):
              """A trusted evaluator verdict must name the exact rubric that served the task."""

              code = "EVIDENCE_RUBRIC_MISMATCH"
          '''.replace('          ', '')
          if marker not in text:
              raise SystemExit('blueprint service error marker missing')
          text = text.replace(marker, replacement, 1)
          start = '''        activities = [
              activity for version in state.plan_versions for activity in version.activities
          ]
              source = next((item for item in activities if item.id == evidence.activity_id), None)
              if source is None or not source.high_stakes_eligible:
                  raise UntrustedInstanceEvidenceError
              return super().evaluate_evidence(state_token=state_token, verdict=verdict)
          '''.replace('          ', '')
          new_eval = '''        if not evidence.source_high_stakes_eligible:
              raise UntrustedInstanceEvidenceError
          if not evidence.source_blueprint_id or not evidence.source_rubric_version:
              raise UntrustedInstanceEvidenceError
          if verdict.rubric_version != evidence.source_rubric_version:
              raise EvidenceRubricMismatchError
          return super().evaluate_evidence(state_token=state_token, verdict=verdict)
          '''.replace('          ', '')
          if start not in text:
              raise SystemExit('blueprint evaluator source lookup block missing')
          text = text.replace(start, new_eval, 1)
          text = text.replace(
              '    "BlueprintTrustError",\n    "UntrustedInstanceEvidenceError",\n',
              '    "BlueprintTrustError",\n    "EvidenceRubricMismatchError",\n    "UntrustedInstanceEvidenceError",\n',
              1,
          )
          blueprint_service.write_text(text, encoding='utf-8')
          PY
      - name: Verify reviewer fixes
        working-directory: apps/api
        run: |
          uv run --locked ruff check --fix src tests
          uv run --locked ruff format src tests
          uv run --locked mypy src tests ../../scripts
          uv run --locked pytest tests/test_g05_blueprint_instances.py tests/test_g05_human_simulation.py tests/test_signed_state_codec_security.py
      - name: Commit reviewer fixes
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          git commit -m 'Preserve G05 source trust and rubric provenance'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
