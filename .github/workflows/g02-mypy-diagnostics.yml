name: G02 mypy diagnostics

on:
  push:
    branches:
      - product/g02-deterministic-evidence-state
    paths:
      - .github/workflows/g02-mypy-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/g02-deterministic-evidence-state
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.18
          python-version: 3.13.13
          working-directory: apps/api
      - name: Persist exact CI mypy diagnostics
        shell: bash
        run: |
          uv sync --locked --all-groups
          set +e
          uv run --locked mypy src tests ../../scripts >../../g02-mypy-diagnostics.txt 2>&1
          status=$?
          set -e
          printf '\nMYPY_EXIT_STATUS=%s\n' "$status" >>../../g02-mypy-diagnostics.txt
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add g02-mypy-diagnostics.txt
          git diff --cached --check
          git commit -m "Capture exact G02 mypy diagnostics"
          git push origin HEAD:product/g02-deterministic-evidence-state
