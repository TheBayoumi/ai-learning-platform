name: F04 repository payload repair

on:
  push:
    branches:
      - automation/f04-vercel-deployment-baseline

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the bounded current-tree payload repair
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          archive = Path('ai-learning-platform.7z')
          expected_archive_bytes = 66_312_302
          if not archive.is_file() or archive.stat().st_size != expected_archive_bytes:
              raise SystemExit('tracked archive identity or size changed unexpectedly')

          resource_evidence = {
              "schema_version": 1,
              "phase": "F04",
              "blocker_id": "f04.resource_measurements",
              "result": "PASSED",
              "verified_at": "2026-07-23T03:49:23.825Z",
              "expected_git_sha": "3f83e3e74d1fc587d90c30b1756c7f2dec994ba3",
              "deployment": {
                  "deployment_id": "dpl_8aaJEB62CFUk1TPqpJPxw8sCbCW5",
                  "created_at": "2026-07-23T03:47:12.685Z",
                  "ready_at": "2026-07-23T03:47:58.737Z",
                  "regions": ["iad1"],
              },
              "build": {
                  "duration_ms": 25000,
                  "deployment_elapsed_ms": 46052,
                  "clone_ms": 1902,
                  "install_ms": 14000,
                  "compile_ms": 3600,
                  "typecheck_ms": 4000,
                  "static_generation_ms": 98,
                  "machine_cores": 2,
                  "machine_memory_mb": 8192,
                  "vercel_cli": "56.5.0",
              },
              "artifact_footprint": {
                  "browser_build_files": 10,
                  "browser_build_bytes": 629571,
                  "deployed_html_bytes": 8600,
                  "deployed_asset_count": 7,
                  "deployed_asset_bytes": 629464,
                  "deployed_total_bytes": 638064,
              },
              "cache": {
                  "restored": True,
                  "created_ms": 16000,
                  "uploaded_bytes": 120170000,
                  "upload_ms": 1630,
                  "causal_speedup_claimed": False,
              },
              "latency": {
                  "classification": "first-after-bounded-quiescence",
                  "quiescence_ms": 60000,
                  "cold": {
                      "ttfb_ms": 300,
                      "total_ms": 301,
                      "status": 200,
                      "body_bytes": 8600,
                      "cache": "MISS",
                      "edge_region": "sfo1",
                  },
                  "warm_samples": [
                      {"ttfb_ms": 250, "total_ms": 251, "status": 200, "body_bytes": 8600, "cache": "MISS", "edge_region": "sfo1"},
                      {"ttfb_ms": 129, "total_ms": 130, "status": 200, "body_bytes": 8600, "cache": "MISS", "edge_region": "sfo1"},
                      {"ttfb_ms": 132, "total_ms": 133, "status": 200, "body_bytes": 8600, "cache": "MISS", "edge_region": "sfo1"},
                      {"ttfb_ms": 133, "total_ms": 134, "status": 200, "body_bytes": 8600, "cache": "MISS", "edge_region": "sfo1"},
                      {"ttfb_ms": 129, "total_ms": 130, "status": 200, "body_bytes": 8600, "cache": "MISS", "edge_region": "sfo1"},
                  ],
                  "warm_ttfb_median_ms": 132,
                  "warm_total_median_ms": 133,
                  "warm_total_p95_ms": 251,
                  "infrastructure_cold_start_claimed": False,
              },
              "runtime": {"node": "24.15.0", "npm": "11.18.0", "next": "16.2.10"},
              "cost_observation": {
                  "team_plan": "hobby",
                  "preview_deployments_observed": 1,
                  "measurement_http_requests": 13,
                  "build_duration_ms": 25000,
                  "cache_upload_bytes": 120170000,
                  "dollar_estimate_provided": False,
                  "bounded": True,
              },
              "assertions": {
                  "exact_deployment_bound": True,
                  "build_measurements_recorded": True,
                  "artifact_footprint_recorded": True,
                  "cache_impact_recorded": True,
                  "latency_samples_bounded": True,
                  "runtime_versions_recorded": True,
                  "cost_observation_bounded": True,
                  "confidential_material_absent": True,
              },
          }
          resource_path = Path('plans/F04-vercel-resource-measurements-evidence.json')
          resource_path.write_text(json.dumps(resource_evidence, indent=2) + '\n', encoding='utf-8', newline='\n')

          gitignore_path = Path('.gitignore')
          gitignore_lines = gitignore_path.read_text(encoding='utf-8').splitlines()
          rule = '/ai-learning-platform.7z'
          if rule in gitignore_lines:
              raise SystemExit('narrow archive ignore rule already exists unexpectedly')
          gitignore_lines.extend(['', '# F04 accidental repository archive payload', rule])
          gitignore_path.write_text('\n'.join(gitignore_lines) + '\n', encoding='utf-8', newline='\n')

          checkpoint_path = Path('plans/autonomous-loop/checkpoint.md')
          checkpoint = checkpoint_path.read_text(encoding='utf-8')
          old_checkpoint = '''- The tracked `ai-learning-platform.7z` is 66,312,302 bytes and remains a separate\n  repository-hygiene repair pending reference and impact verification.'''
          new_checkpoint = '''- The unrelated `ai-learning-platform.7z` was verified at 66,312,302 bytes, then\n  removed from the current tree without history rewriting. A root-specific ignore\n  rule prevents that exact archive from being tracked again; exact-head validation\n  remains the publication gate for the repair.'''
          if checkpoint.count(old_checkpoint) != 1:
              raise SystemExit('checkpoint payload reference changed unexpectedly')
          checkpoint_path.write_text(checkpoint.replace(old_checkpoint, new_checkpoint), encoding='utf-8', newline='\n')

          inventory_path = Path('plans/implementation-inventory.json')
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          phase = next(item for item in inventory['phases'] if item['id'] == 'F04')
          for path in [
              '.gitignore',
              'apps/web/scripts/lib/vercel-resource-measurement-verifier.mjs',
              'apps/web/scripts/lib/vercel-resource-measurement-verifier.d.mts',
              'apps/web/scripts/verify-vercel-resource-measurements.mjs',
              'apps/web/tests/vercel-resource-measurement-verifier.test.ts',
              'plans/F04-vercel-resource-measurements-evidence.json',
          ]:
              if path not in phase['implemented_files']:
                  phase['implemented_files'].append(path)
          phase['tests'].extend([
              'Exact resource implementation revision 3f83e3e74d1fc587d90c30b1756c7f2dec994ba3 passed dedicated Vercel workflow run 29977879812; artifact 8552120216 recorded build, footprint, cache, latency, runtime, and bounded cost evidence for exact READY preview dpl_8aaJEB62CFUk1TPqpJPxw8sCbCW5',
              'The resource verifier recorded a 25,000 ms build, 638,064 deployed bytes, restored 120,170,000-byte cache upload, 300/301 ms first-after-quiescence request, 132/133 ms median warm TTFB/total, Node 24.15.0, npm 11.18.0, and Next.js 16.2.10 without a cold-start or dollar-cost claim',
              'Repository payload diagnostics at 3d0b9e8b02eb0a8a149247b6c1a0a25fac5eebcb found one candidate: ai-learning-platform.7z at 66,312,302 bytes, introduced by 25994d214ed5b39d4b6c73ba0e075b10ee4a5a66 and referenced only by three repository-planning records',
              'The bounded payload implementation removes ai-learning-platform.7z from the current tree without history rewriting, adds only /ai-learning-platform.7z to .gitignore, updates all three references, and adds an exact CI absence/ignore check',
          ])
          phase['missing_outputs'] = [
              'The repository payload-hygiene implementation must pass its own exact-head Vercel deployment and all five Quality Gates before a separate F04 acceptance-state revision is eligible'
          ]
          phase['next_smallest_action'] = 'Verify the exact payload-hygiene implementation head, then publish a separate F04 acceptance-state revision; do not merge before that revision passes'
          phase['gate_decision'] = 'Revise'
          phase['blocker_ids'] = ['f04.repository_payload_hygiene']
          inventory_path.write_text(json.dumps(inventory, indent=2) + '\n', encoding='utf-8', newline='\n')

          inventory_md_path = Path('plans/implementation-inventory.md')
          inventory_md = inventory_md_path.read_text(encoding='utf-8')
          old_inventory_md = '''  build, confidentiality scan, and focused rereview pass. Remote project and\n  Node/npm behavior are not yet reproducible from versioned\n  configuration, and build/artifact/cache/latency/runtime/cost measurements\n  remain absent. No FastAPI deployment, PaaS vendor selection, or V00/V01\n  evidence is introduced.\n- The externally created commit also tracks the unrelated 66,312,302-byte\n  `ai-learning-platform.7z`. This amendment does not modify it; its repository and\n  CI-checkout cost remains an explicit scope risk.'''
          new_inventory_md = '''  build, confidentiality scan, and focused rereview pass. Exact resource revision\n  `3f83e3e74d1fc587d90c30b1756c7f2dec994ba3` and workflow run `29977879812`\n  now record the real build, footprint, cache, latency, runtime, and bounded cost\n  observations in `plans/F04-vercel-resource-measurements-evidence.json`. No\n  FastAPI deployment, PaaS vendor selection, or V00/V01 evidence is introduced.\n- Payload diagnostics confirmed the unrelated `ai-learning-platform.7z` was\n  66,312,302 bytes and 97.6% of tracked blob bytes. This bounded repair removes it\n  from the current tree without history rewriting, updates its three planning\n  references, and adds only `/ai-learning-platform.7z` to the root ignore file.\n  Exact-head CI remains the publication gate before F04 acceptance.'''
          if inventory_md.count(old_inventory_md) != 1:
              raise SystemExit('inventory Markdown payload section changed unexpectedly')
          inventory_md = inventory_md.replace(old_inventory_md, new_inventory_md)
          inventory_md = inventory_md.replace(
              '| F04 | Foundation | `FAILED_RETRYABLE` | Revise reproducibility, measurements, and payload hygiene |',
              '| F04 | Foundation | `FAILED_RETRYABLE` | Verify payload hygiene, then publish the separate acceptance revision |',
          )
          inventory_md_path.write_text(inventory_md, encoding='utf-8', newline='\n')

          plan_path = Path('plans/F04-vercel-deployment-baseline.md')
          plan = plan_path.read_text(encoding='utf-8')
          old_status = '''**Status:** `FAILED_RETRYABLE / Revise`. The supported non-production alias proof\nin `plans/F04-vercel-alias-reversion-evidence.json` resolves\n`f04.rollback_reversion`. Exact implementation revision\n`4e6770a1e1dcf2938f224c93c0701bae0e8e5f4c` and its committed sanitized evidence\nin `plans/F04-vercel-deployed-page-verification-evidence.json` now also resolve\nonly `f04.deployed_page_verification`: GitHub and Vercel identity were joined to\none exact `READY` preview deployment before protected HTTP, accessible\nAPI-unavailable semantics, and shared browser-confidentiality rules were\naccepted. F04 remains `FAILED_RETRYABLE / Revise` because version-controlled\ndeployment reproducibility, required measurements, and repository payload\nhygiene remain incomplete.'''
          new_status = '''**Status:** `FAILED_RETRYABLE / Revise`. Rollback reversion, exact deployed-page\nverification, build reproducibility, and real resource measurements are now\nproven by sanitized exact-SHA evidence. This revision implements the remaining\ncurrent-tree payload repair by removing the unrelated 66,312,302-byte archive\nwithout history rewriting and adding a root-specific recurrence rule. F04 still\nrequires this implementation head to pass its own Vercel and five Quality Gates,\nfollowed by a separate acceptance-state revision.'''
          if plan.count(old_status) != 1:
              raise SystemExit('F04 status section changed unexpectedly')
          plan = plan.replace(old_status, new_status)
          old_performance = '''The live preview exists, but the required build duration, artifact footprint,\ncache impact, cold/warm page latency, runtime-version, and bounded cost\nobservations have not yet been recorded. These remain exit-gate outputs; the\nearlier acceptance did not make the missing measurements optional.'''
          new_performance = '''Exact resource revision `3f83e3e74d1fc587d90c30b1756c7f2dec994ba3` passed\ndedicated workflow run `29977879812`; sanitized artifact `8552120216` is committed\nas `plans/F04-vercel-resource-measurements-evidence.json`. The exact preview used\na 25,000 ms Vercel build on 2 cores/8,192 MB, produced 638,064 deployed bytes,\nrestored its build cache and uploaded 120,170,000 bytes, and ran Node 24.15.0, npm\n11.18.0, and Next.js 16.2.10. After a fixed 60,000 ms quiescence, the first\nrequest measured 300 ms TTFB/301 ms total; five bounded repeated samples had 132\nms median TTFB, 133 ms median total, and 251 ms p95 total. The evidence makes no\nprovider cold-start, cache-causality, SLA, or dollar-cost claim.'''
          if plan.count(old_performance) != 1:
              raise SystemExit('F04 performance section changed unexpectedly')
          plan = plan.replace(old_performance, new_performance)
          insertion = '''\n## Repository Payload Hygiene\n\nRead-only inventory at exact diagnostic head\n`3d0b9e8b02eb0a8a149247b6c1a0a25fac5eebcb` found one archive/oversized\ncandidate: root `ai-learning-platform.7z`, 66,312,302 bytes, introduced by commit\n`25994d214ed5b39d4b6c73ba0e075b10ee4a5a66`. It represented 97.6% of the\n67,954,124 tracked blob bytes and had only three planning-document references.\n\nThis revision removes that path from the current tree with ordinary `git rm`; it\ndoes not rewrite or purge Git history. The three references are updated, and the\nroot ignore rule is exactly `/ai-learning-platform.7z`, not a broad archive glob.\nThe Phase gate now fails if the path exists, remains tracked, or the exact ignore\nrule is absent or duplicated. A separate acceptance revision will bind the final\nimplementation SHA and exact successful checks into durable payload evidence.\n'''
          marker = '\n## Data, Privacy, Security, and Compatibility\n'
          if plan.count(marker) != 1:
              raise SystemExit('F04 payload insertion marker changed unexpectedly')
          plan = plan.replace(marker, insertion + marker)
          old_token = '''A rejected personal-scope Vercel\ntoken was also revoked; the dedicated verifier token is short-lived and expires\n2026-07-22.'''
          new_token = '''A rejected personal-scope Vercel\ntoken was also revoked. After an HTTP 403 exposed an expired or unauthorized\nrepository secret, the user rotated `VERCEL_API_TOKEN`; only the secret name and\nsanitized failure/pass evidence are recorded.'''
          if plan.count(old_token) != 1:
              raise SystemExit('F04 token text changed unexpectedly')
          plan = plan.replace(old_token, new_token)
          old_boundary = '''F04 has not passed. Stop after publishing and verifying this bounded\ndeployed-page verification repair. The only next eligible action is\n`f04.build_reproducibility`. Do not begin that repair, measurements, archive\nhygiene, F04 acceptance, F05, merge, or issue closure in this invocation.'''
          new_boundary = '''F04 has not passed. The only next eligible action is exact-head publication of\nthis payload-hygiene implementation. If its Vercel deployment and all five Quality\nGates pass, publish a separate acceptance-state revision that binds the payload\nevidence and marks F04 `PASSED / Continue`. Do not merge, define F05, or close\nissue #3 before that acceptance revision passes its own checks.'''
          if plan.count(old_boundary) != 1:
              raise SystemExit('F04 next boundary changed unexpectedly')
          plan_path.write_text(plan.replace(old_boundary, new_boundary), encoding='utf-8', newline='\n')

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          prefix, phase_and_rest = ci.split('  phase-gate:\n', 1)
          phase_section, tail = phase_and_rest.split('\n  gate-projection:', 1)
          anchor = '      - name: Install uv\n'
          payload_step = '''      - name: Verify repository payload hygiene\n        run: |\n          test ! -e ai-learning-platform.7z\n          if git ls-files --error-unmatch ai-learning-platform.7z >/dev/null 2>&1; then\n            exit 1\n          fi\n          test "$(grep -Fxc '/ai-learning-platform.7z' .gitignore)" -eq 1\n'''
          if phase_section.count(anchor) != 1:
              raise SystemExit('phase-gate install anchor changed unexpectedly')
          phase_section = phase_section.replace(anchor, payload_step + anchor, 1)
          ci_path.write_text(prefix + '  phase-gate:\n' + phase_section + '\n  gate-projection:' + tail, encoding='utf-8', newline='\n')

          state_path = Path('plans/autonomous-loop/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          state['active_slice'] = 'F04-repository-payload-hygiene'
          state['last_completed_action'] = 'Exact resource revision 3f83e3e74d1fc587d90c30b1756c7f2dec994ba3 passed Vercel, dedicated workflow run 29977879812, resource artifact 8552120216, and all required source gates. This revision removes the only oversized archive and adds the narrow recurrence check.'
          state['next_action'] = 'Verify this exact payload-hygiene implementation head; if green, publish the separate F04 acceptance-state revision and stop before merge.'
          state['stop_reason'] = 'Repository payload hygiene is the final implementation publication gate. F04 acceptance requires a separate exact revision. F05, merge, and issue closure remain ineligible; V00 remains WAITING_EXTERNAL / Revise and V01 remains locked.'
          state['foundation_track']['next_action'] = 'Verify f04.repository_payload_hygiene on the exact head, then publish the separate F04 acceptance-state revision.'
          state['run_number'] = max(int(state.get('run_number', 0)), 28)
          state['last_run_started_at'] = now
          state['last_run_completed_at'] = now

          changed_paths = [
              '.gitignore',
              '.github/workflows/ci.yml',
              'plans/F04-vercel-deployment-baseline.md',
              'plans/F04-vercel-resource-measurements-evidence.json',
              'plans/autonomous-loop/checkpoint.md',
              'plans/implementation-inventory.json',
              'plans/implementation-inventory.md',
          ]
          for raw in changed_paths:
              data = Path(raw).read_bytes().replace(b'\r\n', b'\n')
              state['authoritative_file_hashes'][raw] = hashlib.sha256(data).hexdigest()
          state['authoritative_file_hashes'].pop('ai-learning-platform.7z', None)
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY

          git rm ai-learning-platform.7z
          git rm .github/workflows/f04-payload-diagnostics.yml
          git rm .github/workflows/f04-payload-repair.yml
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add -A
          git commit -m "fix(f04): remove oversized repository archive"
          git push origin "HEAD:${GITHUB_REF_NAME}"
