name: G09 full-stack bridge resolver

on:
  push:
    branches: [product/g09-integration-hardening]

permissions:
  contents: write

concurrency:
  group: g09-full-stack-bridge
  cancel-in-progress: true

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_PLATFORM_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ai_learning_platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/g09-integration-hardening
          persist-credentials: true

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Wire G09 bridge product surfaces
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"G09 marker missing: {label}")
              return text.replace(old, new, 1)

          contracts = Path("apps/api/src/ai_learning_platform_api/persistence/contracts.py")
          text = contracts.read_text(encoding="utf-8")
          if "class AccountStateExportRepository" not in text:
              marker = "\n\nclass TaskExposureIndexRepository(Protocol):\n"
              addition = '''\n\nclass AccountStateExportRepository(Protocol):\n    """List all durable learner aggregates owned by one account for privacy export."""\n\n    async def list_account_states(\n        self,\n        *,\n        account_id: str,\n    ) -> tuple[StoredLearnerState, ...]: ...\n'''
              text = replace_once(text, marker, addition + marker, "export repository protocol")
          contracts.write_text(text, encoding="utf-8")

          schemas = Path("apps/api/src/ai_learning_platform_api/persistence/schemas.py")
          text = schemas.read_text(encoding="utf-8")
          if "from typing import Annotated, Literal\n" not in text:
              text = replace_once(
                  text,
                  "from typing import Annotated\n",
                  "from typing import Annotated, Literal\n",
                  "Literal import",
              )
          if "    LearnerState,\n" not in text:
              text = replace_once(
                  text,
                  "    CompetencyRating,\n",
                  "    CompetencyRating,\n    LearnerState,\n",
                  "LearnerState import",
              )
          if "class LearnerOperationalAuditView" not in text:
              text += '''\n\nclass LearnerOperationalAuditView(StrictModel):\n    """Bounded replay/resource/claim audit attached to an exported learner."""\n\n    raw_state_bytes: Annotated[int, Field(ge=0, le=262_144)]\n    evidence_records: Annotated[int, Field(ge=0, le=24)]\n    evaluation_records: Annotated[int, Field(ge=0, le=64)]\n    retained_plan_versions: Annotated[int, Field(ge=0, le=3)]\n    verification_probes: Annotated[int, Field(ge=0, le=96)]\n    work_provenance_records: Annotated[int, Field(ge=0, le=32)]\n    active_task_exposures: Annotated[int, Field(ge=0, le=16)]\n    replay_verified: bool\n    claim_integrity_verified: bool\n    within_resource_bounds: bool\n\n\nclass LearnerDataExportView(StrictModel):\n    """One owned learner snapshot with no account cookie or server secrets."""\n\n    learner_id: UUID\n    aggregate_version: Annotated[int, Field(ge=0)]\n    updated_at: str\n    state: LearnerState\n    audit: LearnerOperationalAuditView\n\n\nclass AccountDataExportView(StrictModel):\n    """Redacted current-account export with replay and retention disclosures."""\n\n    schema_version: Literal[1] = 1\n    generated_at: str\n    learners: list[LearnerDataExportView]\n    redactions: list[str]\n    retention_notes: list[str]\n'''
          schemas.write_text(text, encoding="utf-8")

          postgres = Path("apps/api/src/ai_learning_platform_api/persistence/postgres.py")
          text = postgres.read_text(encoding="utf-8")
          if "async def list_account_states(" not in text:
              marker = "    async def delete_account(self, *, account_id: str) -> bool:\n"
              method = '''    async def list_account_states(\n        self,\n        *,\n        account_id: str,\n    ) -> tuple[StoredLearnerState, ...]:\n        """Return all current learner aggregates owned by one account."""\n        validate_account_id(account_id)\n        statement = (\n            select(\n                learner_states.c.account_id,\n                learner_states.c.learner_id,\n                learner_states.c.version,\n                learner_states.c.state,\n                learner_states.c.updated_at,\n            )\n            .where(learner_states.c.account_id == account_id)\n            .order_by(learner_states.c.learner_id)\n        )\n        try:\n            async with self._engine.connect() as connection:\n                rows = (await connection.execute(statement)).mappings().all()\n        except SQLAlchemyError as error:\n            raise PersistenceUnavailableError from error\n        return tuple(_stored_state(row) for row in rows)\n\n'''
              text = replace_once(text, marker, method + marker, "Postgres account export")
          postgres.write_text(text, encoding="utf-8")

          service = Path("apps/api/src/ai_learning_platform_api/persistence/service.py")
          text = service.read_text(encoding="utf-8")
          if "from ai_learning_platform_api.persistence.operational import audit_stored_state\n" not in text:
              text = replace_once(
                  text,
                  "from ai_learning_platform_api.persistence.contracts import (\n",
                  "from ai_learning_platform_api.persistence.contracts import (\n",
                  "service contracts import",
              )
              contract_block_end = ")\nfrom ai_learning_platform_api.persistence.schemas import (\n"
              text = replace_once(
                  text,
                  contract_block_end,
                  ")\nfrom ai_learning_platform_api.persistence.operational import audit_stored_state\nfrom ai_learning_platform_api.persistence.schemas import (\n",
                  "operational import",
              )
          for name, anchor in (
              ("AccountStateExportRepository", "    LearnerStateCommit,\n"),
              ("LearnerStateReplayRepository", "    LearnerStateRepository,\n"),
              ("PersistenceUnavailableError", "    LearnerStateNotFoundError,\n"),
              ("ReplayDivergenceError", "    PersistenceUnavailableError,\n"),
          ):
              needle = f"    {name},\n"
              if needle not in text:
                  text = replace_once(text, anchor, anchor + needle, f"service import {name}")
          if "    AccountDataExportView,\n" not in text:
              text = replace_once(
                  text,
                  "from ai_learning_platform_api.persistence.schemas import (\n",
                  "from ai_learning_platform_api.persistence.schemas import (\n"
                  "    AccountDataExportView,\n"
                  "    LearnerDataExportView,\n",
                  "service export schemas",
              )
          if "export_repository: AccountStateExportRepository | None = None" not in text:
              old = '''        repository: LearnerStateRepository,\n        exposure_repository: TaskExposureIndexRepository | None = None,\n        clock: Clock | None = None,\n'''
              new = '''        repository: LearnerStateRepository,\n        exposure_repository: TaskExposureIndexRepository | None = None,\n        export_repository: AccountStateExportRepository | None = None,\n        replay_repository: LearnerStateReplayRepository | None = None,\n        clock: Clock | None = None,\n'''
              text = replace_once(text, old, new, "service constructor")
          if "self._export_repository = export_repository" not in text:
              marker = "        self._exposure_repository = exposure_repository\n"
              text = replace_once(
                  text,
                  marker,
                  marker
                  + "        self._export_repository = export_repository\n"
                  + "        self._replay_repository = replay_repository\n",
                  "service repository assignments",
              )
          if "async def export_account(" not in text:
              marker = "    async def delete_account(self, *, account_id: str) -> bool:\n"
              method = '''    async def export_account(self, *, account_id: str) -> AccountDataExportView:\n        """Export owned learners only after append-only replay verification."""\n        if self._export_repository is None or self._replay_repository is None:\n            raise PersistenceUnavailableError\n        stored_states = await self._export_repository.list_account_states(account_id=account_id)\n        if not stored_states:\n            raise LearnerStateNotFoundError\n        learners: list[LearnerDataExportView] = []\n        for stored in stored_states:\n            replay = await self._replay_repository.replay(\n                account_id=account_id,\n                learner_id=stored.learner_id,\n            )\n            audit = audit_stored_state(stored, replay=replay)\n            if not audit.replay_verified:\n                raise ReplayDivergenceError\n            learners.append(\n                LearnerDataExportView(\n                    learner_id=stored.learner_id,\n                    aggregate_version=stored.version,\n                    updated_at=stored.updated_at.isoformat(),\n                    state=stored.state,\n                    audit=audit,\n                )\n            )\n        return AccountDataExportView(\n            generated_at=self._now().isoformat(),\n            learners=learners,\n            redactions=[\n                "server_secrets",\n                "provider_credentials",\n                "account_cookie",\n                "raw_transport_headers",\n            ],\n            retention_notes=["unlinkable_task_collision_fingerprints"],\n        )\n\n'''
              text = replace_once(text, marker, method + marker, "service export method")
          service.write_text(text, encoding="utf-8")

          privacy = Path("apps/api/src/ai_learning_platform_api/transport/http/privacy.py")
          text = privacy.read_text(encoding="utf-8")
          if "LearnerStateNotFoundError" not in text:
              text = replace_once(
                  text,
                  "from ai_learning_platform_api.persistence.contracts import PersistenceUnavailableError\n",
                  "from ai_learning_platform_api.persistence.contracts import (\n"
                  "    LearnerStateNotFoundError,\n"
                  "    PersistenceUnavailableError,\n"
                  "    ReplayDivergenceError,\n"
                  ")\n"
                  "from ai_learning_platform_api.persistence.schemas import AccountDataExportView\n",
                  "privacy imports",
              )
          if "ExportAccount = Callable" not in text:
              text = replace_once(
                  text,
                  "DeleteAccount = Callable[[str], Awaitable[bool]]\n",
                  "DeleteAccount = Callable[[str], Awaitable[bool]]\n"
                  "ExportAccount = Callable[[str], Awaitable[AccountDataExportView]]\n",
                  "privacy export callable",
              )
          if "export_account: ExportAccount | None = None" not in text:
              text = replace_once(
                  text,
                  "def create_privacy_router(delete_account: DeleteAccount) -> APIRouter:\n",
                  "def create_privacy_router(\n"
                  "    delete_account: DeleteAccount,\n"
                  "    export_account: ExportAccount | None = None,\n"
                  ") -> APIRouter:\n",
                  "privacy router signature",
              )
          if '@router.get("/account/export"' not in text:
              marker = '    @router.delete("/account", response_model=AccountDeletionView)\n'
              route = '''    @router.get("/account/export", response_model=AccountDataExportView)\n    async def export_current_account(account_header: AccountHeader) -> AccountDataExportView:\n        account_id = _uuid(account_header)\n        if export_account is None:\n            raise HTTPException(\n                status_code=status.HTTP_503_SERVICE_UNAVAILABLE,\n                detail={\n                    "code": "PERSISTENCE_UNAVAILABLE",\n                    "message": "Account data export is unavailable in this storage mode.",\n                },\n            )\n        try:\n            return await export_account(account_id)\n        except LearnerStateNotFoundError as error:\n            raise HTTPException(\n                status_code=status.HTTP_404_NOT_FOUND,\n                detail={\n                    "code": "ACCOUNT_DATA_NOT_FOUND",\n                    "message": "No durable learner data exists for this account.",\n                },\n            ) from error\n        except ReplayDivergenceError as error:\n            raise HTTPException(\n                status_code=status.HTTP_409_CONFLICT,\n                detail={\n                    "code": "REPLAY_DIVERGENCE",\n                    "message": "Account export failed replay verification.",\n                },\n            ) from error\n        except PersistenceUnavailableError as error:\n            raise HTTPException(\n                status_code=status.HTTP_503_SERVICE_UNAVAILABLE,\n                detail={\n                    "code": "PERSISTENCE_UNAVAILABLE",\n                    "message": "Account data could not be exported right now.",\n                },\n            ) from error\n\n'''
              text = replace_once(text, marker, route + marker, "privacy export route")
          privacy.write_text(text, encoding="utf-8")

          app = Path("apps/api/src/ai_learning_platform_api/app.py")
          text = app.read_text(encoding="utf-8")
          if "from ai_learning_platform_api.persistence.schemas import AccountDataExportView\n" not in text:
              text = replace_once(
                  text,
                  "from ai_learning_platform_api.persistence.service import PersistentLearningService\n",
                  "from ai_learning_platform_api.persistence.schemas import AccountDataExportView\n"
                  "from ai_learning_platform_api.persistence.service import PersistentLearningService\n",
                  "app export view import",
              )
          old_ctor = '''        persistent_service = PersistentLearningService(\n            secret=secret,\n            repository=postgres_repository,\n            exposure_repository=postgres_repository,\n        )\n'''
          if old_ctor in text:
              text = text.replace(
                  old_ctor,
                  '''        persistent_service = PersistentLearningService(\n            secret=secret,\n            repository=postgres_repository,\n            exposure_repository=postgres_repository,\n            export_repository=postgres_repository,\n            replay_repository=postgres_repository,\n        )\n''',
                  1,
              )
          if "async def export_current_account(" not in text:
              marker = '''        async def delete_current_account(account_id: str) -> bool:\n            if persistent_service is None:\n                return False\n            return await persistent_service.delete_account(account_id=account_id)\n\n        app.include_router(create_privacy_router(delete_current_account))\n'''
              replacement = '''        async def delete_current_account(account_id: str) -> bool:\n            if persistent_service is None:\n                return False\n            return await persistent_service.delete_account(account_id=account_id)\n\n        async def export_current_account(account_id: str) -> AccountDataExportView:\n            if persistent_service is None:\n                raise RuntimeError("persistent account export is unavailable")\n            return await persistent_service.export_account(account_id=account_id)\n\n        app.include_router(\n            create_privacy_router(delete_current_account, export_current_account)\n        )\n'''
              text = replace_once(text, marker, replacement, "app privacy wiring")
          app.write_text(text, encoding="utf-8")

          proxy = Path("apps/web/app/api/platform/[...path]/route.ts")
          text = proxy.read_text(encoding="utf-8")
          if 'const ACCOUNT_EXPORT_PATH = "account/export";' not in text:
              text = replace_once(
                  text,
                  'const ACCOUNT_DELETE_PATH = "account";\n',
                  'const ACCOUNT_DELETE_PATH = "account";\nconst ACCOUNT_EXPORT_PATH = "account/export";\n',
                  "proxy export constant",
              )
              text = replace_once(
                  text,
                  "  ACCOUNT_DELETE_PATH,\n",
                  "  ACCOUNT_DELETE_PATH,\n  ACCOUNT_EXPORT_PATH,\n",
                  "proxy export allowlist",
              )
              text = replace_once(
                  text,
                  'const GET_PATHS = new Set(["roles", "career-tracks"]);\n',
                  'const GET_PATHS = new Set(["roles", "career-tracks", ACCOUNT_EXPORT_PATH]);\n',
                  "proxy GET allowlist",
              )
          if "const isAccountExport" not in text:
              old = '''  const isAccountDeletion = relativePath === ACCOUNT_DELETE_PATH && method === "DELETE";\n  const accountContext =\n    method === "GET"\n      ? null\n      : isAccountDeletion\n        ? resolveExistingAccountContext(request)\n        : resolveAccountContext(request);\n\n  if (isAccountDeletion && accountContext === null) {\n'''
              new = '''  const isAccountDeletion = relativePath === ACCOUNT_DELETE_PATH && method === "DELETE";\n  const isAccountExport = relativePath === ACCOUNT_EXPORT_PATH && method === "GET";\n  const accountContext = isAccountExport\n    ? resolveExistingAccountContext(request)\n    : method === "GET"\n      ? null\n      : isAccountDeletion\n        ? resolveExistingAccountContext(request)\n        : resolveAccountContext(request);\n\n  if (isAccountExport && accountContext === null) {\n    return errorResponse(404, "ACCOUNT_DATA_NOT_FOUND", "No durable learner data exists for this account.");\n  }\n\n  if (isAccountDeletion && accountContext === null) {\n'''
              text = replace_once(text, old, new, "proxy export account context")
          proxy.write_text(text, encoding="utf-8")

          client = Path("apps/web/lib/platform-client.ts")
          text = client.read_text(encoding="utf-8")
          if "export interface AccountDataExport" not in text:
              text += '''\n\nexport interface AccountDataExport {\n  readonly schema_version: 1;\n  readonly generated_at: string;\n  readonly learners: readonly unknown[];\n  readonly redactions: readonly string[];\n  readonly retention_notes: readonly string[];\n}\n\nfunction isAccountDataExport(value: unknown): value is AccountDataExport {\n  if (typeof value !== "object" || value === null) {\n    return false;\n  }\n  const candidate = value as Partial<AccountDataExport>;\n  return (\n    candidate.schema_version === 1 &&\n    typeof candidate.generated_at === "string" &&\n    Array.isArray(candidate.learners) &&\n    Array.isArray(candidate.redactions) &&\n    Array.isArray(candidate.retention_notes)\n  );\n}\n\nexport async function exportAccount(): Promise<AccountDataExport> {\n  const value = await platformRequest("account/export");\n  if (!isAccountDataExport(value)) {\n    throw new Error("The account export response did not match the expected contract.");\n  }\n  return value;\n}\n'''
          client.write_text(text, encoding="utf-8")

          profile = Path("apps/web/components/app/profile-view.tsx")
          text = profile.read_text(encoding="utf-8")
          if "exportAccount" not in text.split("\n", 12)[0:12]:
              text = replace_once(
                  text,
                  'import { deleteAccount } from "../../lib/platform-client";\n',
                  'import { deleteAccount, exportAccount } from "../../lib/platform-client";\n',
                  "profile export import",
              )
          if "const [exportBusy" not in text:
              text = replace_once(
                  text,
                  '  const [busy, setBusy] = useState(false);\n',
                  '  const [busy, setBusy] = useState(false);\n  const [exportBusy, setExportBusy] = useState(false);\n',
                  "profile export state",
              )
          if "const downloadExport" not in text:
              marker = "  const removeAccount = async () => {\n"
              method = '''  const downloadExport = async () => {\n    setExportBusy(true);\n    setError(null);\n    try {\n      const data = await exportAccount();\n      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });\n      const url = URL.createObjectURL(blob);\n      const anchor = document.createElement("a");\n      anchor.href = url;\n      anchor.download = "career-atlas-account-export.json";\n      document.body.append(anchor);\n      anchor.click();\n      anchor.remove();\n      URL.revokeObjectURL(url);\n    } catch (caught) {\n      setError(caught instanceof Error ? caught.message : "The learner data export failed.");\n    } finally {\n      setExportBusy(false);\n    }\n  };\n\n'''
              text = replace_once(text, marker, method + marker, "profile export action")
          if "Download my data" not in text:
              marker = '          <span className={styles.label}>Data controls</span>\n'
              block = '''          <span className={styles.label}>Data controls</span>\n          <h2>Export or delete this learner account</h2>\n          <p>\n            Export verifies the current PostgreSQL snapshot against append-only replay before the\n            browser receives a redacted JSON copy. Export does not include account cookies, provider\n            credentials, or server secrets.\n          </p>\n          <div className={styles.actions}>\n            <button\n              className="button button-quiet"\n              type="button"\n              disabled={exportBusy || busy}\n              onClick={() => void downloadExport()}\n            >\n              {exportBusy ? "Preparing export…" : "Download my data"}\n            </button>\n          </div>\n          <h2>Delete this anonymous learner account</h2>\n'''
              text = replace_once(text, marker + "          <h2>Delete this anonymous learner account</h2>\n", block, "profile export UI")
          profile.write_text(text, encoding="utf-8")

          deploy = Path("scripts/deploy-product.sh")
          text = deploy.read_text(encoding="utf-8")
          if 'phase="deployed-account-export"' not in text:
              marker = 'phase="deployed-account-deletion"\n'
              block = '''phase="deployed-account-export"\naccount_export="$RUNNER_TEMP/deployed-account-export.json"\naccount_export_status=$(curl -sS "${frontend_access_headers[@]}" \\\n  --cookie "$cookie_jar" \\\n  --cookie-jar "$cookie_jar" \\\n  -o "$account_export" -w '%{http_code}' \\\n  "$frontend_url/api/platform/account/export")\nrequire_json_http_status "account-export" "200" "$account_export_status" "$account_export"\njq -e --arg learner_id "$(jq -r '.learner_id' "$progress")" '\n  .schema_version == 1\n  and (.learners | length) >= 1\n  and any(.learners[];\n      .learner_id == $learner_id\n      and .audit.replay_verified == true\n      and .audit.within_resource_bounds == true\n      and .audit.claim_integrity_verified == true)\n  and (.redactions | index("server_secrets")) != null\n  and (.redactions | index("provider_credentials")) != null\n  and (.retention_notes | index("unlinkable_task_collision_fingerprints")) != null\n' "$account_export" >/dev/null\nif grep -F 'ai_platform_account' "$account_export" >/dev/null; then\n  echo "Account export leaked browser account-cookie material" >&2\n  exit 1\nfi\n\nphase="deployed-account-deletion"\n'''
              text = replace_once(text, marker, block, "deployment account export")
          if 'phase="deployed-post-delete-export"' not in text:
              marker = '''require_json_http_status "post-delete-resume" "404" "$post_delete_status" "$post_delete_resume"\njq -e '.detail.code == "LEARNER_STATE_NOT_FOUND"' "$post_delete_resume" >/dev/null\n\nphase="evidence-publication"\n'''
              block = '''require_json_http_status "post-delete-resume" "404" "$post_delete_status" "$post_delete_resume"\njq -e '.detail.code == "LEARNER_STATE_NOT_FOUND"' "$post_delete_resume" >/dev/null\n\nphase="deployed-post-delete-export"\npost_delete_export="$RUNNER_TEMP/post-delete-export.json"\npost_delete_export_status=$(curl -sS "${frontend_access_headers[@]}" \\\n  --cookie "$cookie_jar" \\\n  --cookie-jar "$cookie_jar" \\\n  -o "$post_delete_export" -w '%{http_code}' \\\n  "$frontend_url/api/platform/account/export")\nrequire_json_http_status "post-delete-export" "404" "$post_delete_export_status" "$post_delete_export"\njq -e '.detail.code == "ACCOUNT_DATA_NOT_FOUND"' "$post_delete_export" >/dev/null\n\nphase="evidence-publication"\n'''
              text = replace_once(text, marker, block, "deployment post-delete export")
          if 'account_export:"ok"' not in text:
              text = replace_once(
                  text,
                  '      post_progress_resume:"ok",\n      deletion:"ok",\n      post_delete_resume:"blocked",\n',
                  '      post_progress_resume:"ok",\n      account_export:"ok",\n      deletion:"ok",\n      post_delete_resume:"blocked",\n      post_delete_export:"blocked",\n',
                  "deployment evidence export status",
              )
          deploy.write_text(text, encoding="utf-8")

          state_path = Path("plans/adaptive-product-state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["active_phase"] = "G09"
          state["full_stack_product_state"] = "plans/full-stack-product-state.json"
          g08 = next(item for item in state["phases"] if item["id"] == "G08")
          g08.update({
              "status": "PASSED",
              "branch": "main",
              "accepted_sha": "e19e780be347eeb4e7cab9d56173ed59246b2808",
              "production_acceptance": [
                  "Quality Gates run 31275217479 passed on exact PR head e19e780be347eeb4e7cab9d56173ed59246b2808",
                  "Product deployment run 31275315312 passed on merged main SHA 003ebe8ff6818d97797b11aba69ee55826eeb09f",
              ],
          })
          g09 = next(item for item in state["phases"] if item["id"] == "G09")
          g09.update({
              "status": "VALIDATING",
              "branch": "product/g09-integration-hardening",
              "accepted_sha": None,
              "production_acceptance": [],
              "next_phase": "P01",
          })
          g09["implementation_evidence"] = [
              "apps/api/src/ai_learning_platform_api/persistence/operational.py",
              "apps/api/src/ai_learning_platform_api/persistence/contracts.py",
              "apps/api/src/ai_learning_platform_api/persistence/schemas.py",
              "apps/api/src/ai_learning_platform_api/persistence/postgres.py",
              "apps/api/src/ai_learning_platform_api/persistence/service.py",
              "apps/api/src/ai_learning_platform_api/transport/http/privacy.py",
              "apps/api/src/ai_learning_platform_api/app.py",
              "apps/web/app/api/platform/[...path]/route.ts",
              "apps/web/lib/platform-client.ts",
              "apps/web/components/app/profile-view.tsx",
              "scripts/deploy-product.sh",
              "plans/full-stack-product-definition-of-done.md",
              "plans/full-stack-product-state.json",
          ]
          g09["test_evidence"] = [
              "apps/api/tests/test_g09_account_export.py",
              "apps/api/tests/test_g09_privacy_export.py",
              "apps/api/tests/test_g09_human_simulation.py",
              "apps/api/tests/test_product_gate.py",
              ".github/workflows/ci.yml",
              ".github/workflows/product-deployment.yml",
          ]
          g09["human_simulation_evidence"] = ["apps/api/tests/test_g09_human_simulation.py"]
          state_path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")

          gate = Path("apps/api/tests/test_product_gate.py")
          text = gate.read_text(encoding="utf-8")
          text = text.replace(
              '    head_ref = os.environ.get("GITHUB_HEAD_REF") or "product/g08-readiness-projection"\n',
              '    head_ref = os.environ.get("GITHUB_HEAD_REF") or "product/g09-integration-hardening"\n',
              1,
          )
          text = text.replace(
              '    assert active.identifier == "G08"\n',
              '    assert active.identifier == "G09"\n',
              1,
          )
          gate.write_text(text, encoding="utf-8")
          PY

      - name: Verify API and PostgreSQL bridge
        working-directory: apps/api
        run: |
          uv sync --locked --all-groups
          uv run --locked ruff format src tests
          uv run --locked ruff check --fix src tests
          uv run --locked ruff format src tests
          uv run --locked ruff check src tests ../../scripts
          uv run --locked mypy src tests ../../scripts
          uv run --locked alembic upgrade head
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest
          uv run --locked coverage report --fail-under=95
          bash -n ../../scripts/deploy-product.sh

      - name: Verify Web bridge
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit verified G09 bridge
        run: |
          git add apps/api apps/web scripts/deploy-product.sh plans/adaptive-product-state.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete G09 full-stack bridge hardening'
          git push origin HEAD:product/g09-integration-hardening
