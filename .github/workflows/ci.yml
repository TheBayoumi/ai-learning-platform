name: Quality Gates

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  api:
    name: API quality
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_PLATFORM_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ai_learning_platform
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Verify canonical health OpenAPI contract
        run: >-
          uv run --locked python -m
          ai_learning_platform_api.contracts.health_openapi
          check openapi/health.openapi.json
      - name: Verify generated health response validator
        run: >-
          uv run --locked python -m
          ai_learning_platform_api.contracts.health_typescript
          check openapi/health.openapi.json
          ../web/server/contracts/generated/health-response.ts
      - name: Check formatting
        run: uv run --locked ruff format --check . ../../scripts
      - name: Lint
        run: uv run --locked ruff check . ../../scripts
      - name: Type check
        run: uv run --locked mypy src tests ../../scripts
      - name: Verify migration round trip
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head
      - name: Verify release topology
        working-directory: .
        run: uv run --project apps/api --locked python scripts/verify_topology.py
      - name: Verify recovery contract
        working-directory: .
        run: >-
          uv run --project apps/api --locked python scripts/verify_recovery.py
          --expected-revision 20260724_01
          --transaction-check
      - name: Test with coverage
        run: |
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest
          uv run --locked coverage report --fail-under=95
      - name: Verify repository line endings
        working-directory: .
        run: |
          git diff --check
          git ls-files --eol | awk '
            $1 ~ /^i\/(crlf|mixed)$/ ||
            $2 == "w/mixed" ||
            ($0 ~ /attr\/.*eol=lf/ && $2 == "w/crlf") ||
            ($0 ~ /attr\/.*eol=crlf/ && $2 !~ /^w\/(crlf|none)$/) {
              print "invalid line ending: " $0
              invalid = 1
            }
            END { exit invalid }
          '

  web:
    name: Web quality
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        working-directory: .
        run: npm install --global npm@11.18.0
      - name: Verify npm version
        run: test "$(npm --version)" = "11.18.0"
      - name: Verify committed build toolchain
        run: npm run verify:build-toolchain
      - name: Synchronize locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  runtime-smoke:
    name: Runtime smoke
    if: ${{ github.event.pull_request.draft == false }}
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - name: Verify npm version
        run: test "$(npm --version)" = "11.18.0"
      - name: Verify committed web build toolchain
        working-directory: apps/web
        run: npm run verify:build-toolchain
      - name: Synchronize locked API dependencies
        working-directory: apps/api
        run: uv sync --locked --all-groups
      - name: Synchronize locked web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run the cross-process smoke contract
        timeout-minutes: 2
        run: uv run --project apps/api --locked python scripts/smoke.py

  phase-gate:
    name: Phase gate
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify repository payload hygiene
        run: |
          test ! -e ai-learning-platform.7z
          if git ls-files --error-unmatch ai-learning-platform.7z >/dev/null 2>&1; then
            exit 1
          fi
          test "$(grep -Fxc '/ai-learning-platform.7z' .gitignore)" -eq 1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - name: Validate the exact revision phase state
        run: >-
          uv run --project apps/api --locked python scripts/phase_gate.py validate
          --expected-sha "$EXACT_HEAD_SHA"

  gate-projection:
    name: Gate projection
    needs: [api, web, runtime-smoke, phase-gate]
    if: ${{ always() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - name: Project the exact revision gate state
        run: >-
          uv run --project apps/api --locked python scripts/phase_gate.py project
          --expected-sha "$EXACT_HEAD_SHA"
          --check-result "API quality=${{ needs.api.result }}"
          --check-result "Web quality=${{ needs.web.result }}"
          --check-result "Runtime smoke=${{ needs.runtime-smoke.result }}"
          --check-result "Phase gate=${{ needs.phase-gate.result }}"
          --require-check-results
          --github-summary "$GITHUB_STEP_SUMMARY"
