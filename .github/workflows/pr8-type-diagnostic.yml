name: PR8 type diagnostic

on:
  push:
    branches:
      - automation/assessment-calibration

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          working-directory: apps/api
      - name: Capture mypy output
        shell: bash
        run: |
          set +e
          mkdir -p .diagnostics
          uv sync --project apps/api --locked --all-groups >/dev/null 2>&1
          uv run --project apps/api --locked mypy apps/api/src apps/api/tests scripts \
            >.diagnostics/pr8-mypy.txt 2>&1
          echo "exit_code=$?" >>.diagnostics/pr8-mypy.txt
          exit 0
      - name: Commit report once
        run: |
          if test -z "$(git status --porcelain -- .diagnostics/pr8-mypy.txt)"; then
            exit 0
          fi
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add .diagnostics/pr8-mypy.txt
          git commit -m "chore(assessment): publish mypy diagnostic"
          git push origin "HEAD:${GITHUB_REF_NAME}"
