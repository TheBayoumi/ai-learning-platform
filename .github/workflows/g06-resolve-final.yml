name: G06 resolve final

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  resolve:
    if: github.head_ref == 'product/g06-retention-transfer-engine' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Apply exact G06 integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schema = Path('apps/api/src/ai_learning_platform_api/learning/schemas.py')
          s = schema.read_text(encoding='utf-8')
          if 'VerificationClass = Literal[' not in s:
              marker = 'ReasoningState = Literal["not_observed", "submitted", "verified"]\n'
              assert marker in s
              s = s.replace(marker, marker + 'VerificationClass = Literal["independent", "retention_7d", "retention_30d", "transfer"]\nProbeStatus = Literal["scheduled", "passed", "failed"]\nProbeDisposition = Literal["passed", "failed"]\n', 1)
          if 'class TrustedProbeVerdict' not in s:
              marker = '\n\nclass CompetencyView(StrictModel):\n'
              assert marker in s
              models = '''\n\nclass TrustedProbeVerdict(StrictModel):\n    """Internal trusted verdict for one scheduled retention/transfer probe."""\n\n    probe_id: Annotated[str, Field(min_length=8, max_length=160)]\n    competency_id: Annotated[str, Field(min_length=1, max_length=64)]\n    verification_class: VerificationClass\n    disposition: ProbeDisposition\n    independence: EvidenceIndependence = "unverified"\n    assistance: AssistanceLevel = "unknown"\n    reasoning: ReasoningState = "not_observed"\n    evaluator_id: Annotated[str, Field(min_length=2, max_length=120)]\n    evaluator_version: Annotated[str, Field(min_length=1, max_length=80)]\n    confidence: Annotated[int, Field(ge=0, le=100)]\n    findings: Annotated[list[str], Field(max_length=12)] = Field(default_factory=list)\n\n\nclass VerificationProbeView(StrictModel):\n    """One server-scheduled independent retention or unseen-transfer obligation."""\n\n    probe_id: str\n    competency_id: str\n    verification_class: VerificationClass\n    source_evidence_id: str\n    due_at: str\n    status: ProbeStatus = "scheduled"\n    unseen_instance_fingerprint: str = ""\n    completed_at: str | None = None\n    evaluation_id: str = ""\n    evaluator_id: str = ""\n    evaluator_version: str = ""\n\n\nclass CompetencyQualificationState(StrictModel):\n    """Authoritative exact proof classes for one competency."""\n\n    competency_id: str\n    satisfied_classes: list[VerificationClass] = Field(default_factory=list)\n    failed_classes: list[VerificationClass] = Field(default_factory=list)\n    independent_evidence_ids: list[str] = Field(default_factory=list)\n    assisted_evidence_ids: list[str] = Field(default_factory=list)\n    last_updated_at: str | None = None\n\n\nclass CompetencyQualificationView(StrictModel):\n    """Projection of exact immediate/retention/transfer proof obligations."""\n\n    competency_id: str\n    satisfied_classes: list[VerificationClass]\n    missing_classes: list[VerificationClass]\n    failed_classes: list[VerificationClass]\n    independent_evidence_ids: list[str]\n    assisted_evidence_ids: list[str]\n    scheduled_probe_ids: list[str]\n    next_probe_at: str | None\n    fully_qualified: bool\n'''
              s = s.replace(marker, models + marker, 1)
          learner_marker = '    competency_evidence: dict[str, CompetencyEvidenceState] = Field(default_factory=dict)\n'
          if 'competency_qualification: dict[str, CompetencyQualificationState]' not in s:
              assert learner_marker in s
              s = s.replace(learner_marker, learner_marker + '    competency_qualification: dict[str, CompetencyQualificationState] = Field(default_factory=dict)\n    verification_probes: list[VerificationProbeView] = Field(default_factory=list)\n', 1)
          plan_marker = '    evidence_evaluations: list[EvidenceEvaluationRecord]\n'
          if '    qualifications: list[CompetencyQualificationView]' not in s:
              assert plan_marker in s
              s = s.replace(plan_marker, plan_marker + '    qualifications: list[CompetencyQualificationView] = Field(default_factory=list)\n    verification_probes: list[VerificationProbeView] = Field(default_factory=list)\n', 1)
          schema.write_text(s, encoding='utf-8')

          Path('apps/api/src/ai_learning_platform_api/learning/__init__.py').write_text(
              '"""Learner diagnosis, planning, signed state, and trusted served-instance domain."""\n\n'
              'from ai_learning_platform_api.learning.qualification_service import (\n'
              '    QualificationLearningPlanService as LearningPlanService,\n'
              ')\n\n__all__ = ["LearningPlanService"]\n', encoding='utf-8')

          pschema = Path('apps/api/src/ai_learning_platform_api/persistence/schemas.py')
          p = pschema.read_text(encoding='utf-8')
          if 'TrustedProbeVerdict' not in p:
              marker = '    TrustedEvidenceVerdict,\n'; assert marker in p
              p = p.replace(marker, marker + '    TrustedProbeVerdict,\n', 1)
          if 'class PersistentProbeEvaluationRequest' not in p:
              marker = '\n\nclass PersistentPlanView(StrictModel):\n'; assert marker in p
              p = p.replace(marker, '''\n\nclass PersistentProbeEvaluationRequest(StrictModel):\n    """Durable internal command for one trusted retention/transfer probe verdict."""\n\n    learner_id: UUID\n    expected_version: Annotated[int, Field(ge=0)]\n    idempotency_key: Annotated[str, Field(min_length=8, max_length=160)]\n    verdict: TrustedProbeVerdict\n''' + marker, 1)
          pschema.write_text(p, encoding='utf-8')

          pservice = Path('apps/api/src/ai_learning_platform_api/persistence/service.py')
          p = pservice.read_text(encoding='utf-8')
          if 'PersistentProbeEvaluationRequest' not in p:
              marker = '    PersistentProgressRequest,\n'; assert marker in p
              p = p.replace(marker, marker + '    PersistentProbeEvaluationRequest,\n', 1)
          if 'async def evaluate_probe(' not in p:
              marker = '\n    async def replan(\n'; assert marker in p
              method = '''\n    async def evaluate_probe(\n        self,\n        *,\n        account_id: str,\n        request: PersistentProbeEvaluationRequest,\n    ) -> PersistentPlanView:\n        """Commit one trusted server-timed retention/transfer probe verdict."""\n        stored = await self._load_expected(\n            account_id=account_id, learner_id=request.learner_id,\n            expected_version=request.expected_version,\n        )\n        plan = self._core.evaluate_probe(\n            state_token=self._codec.encode(stored.state), verdict=request.verdict\n        )\n        if plan.sequence == stored.state.sequence:\n            return self._view(stored)\n        return await self._commit_plan(\n            account_id=account_id, stored=stored, state_token=plan.state_token,\n            idempotency_key=request.idempotency_key, event_type="learner.probe.evaluated",\n        )\n\n'''
              p = p.replace(marker, method + marker, 1)
          pservice.write_text(p, encoding='utf-8')

          qpath = Path('apps/api/src/ai_learning_platform_api/learning/qualification.py')
          q = qpath.read_text(encoding='utf-8')
          old = '''    for verification_class, delay in (\n        ("transfer", timedelta()),\n        ("retention_7d", timedelta(days=7)),\n        ("retention_30d", timedelta(days=30)),\n    ):\n'''
          if old in q:
              q = q.replace(old, '''    schedule: tuple[tuple[VerificationClass, timedelta], ...] = (\n        ("transfer", timedelta()),\n        ("retention_7d", timedelta(days=7)),\n        ("retention_30d", timedelta(days=30)),\n    )\n    for verification_class, delay in schedule:\n''', 1)
          failure = '''    else:\n        satisfied = [item for item in satisfied if item != verdict.verification_class]\n        if verdict.verification_class not in failed:\n            failed.append(verdict.verification_class)\n\n    qualification = current.model_copy(\n'''
          if 'retry_delay:' not in q:
              assert failure in q
              q = q.replace(failure, '''    else:\n        satisfied = [item for item in satisfied if item != verdict.verification_class]\n        if verdict.verification_class not in failed:\n            failed.append(verdict.verification_class)\n        retry_delay: dict[VerificationClass, timedelta] = {\n            "independent": timedelta(days=1),\n            "transfer": timedelta(days=1),\n            "retention_7d": timedelta(days=7),\n            "retention_30d": timedelta(days=30),\n        }\n        probes.append(\n            _probe(\n                learner_id=state.learner_id,\n                competency_id=verdict.competency_id,\n                verification_class=verdict.verification_class,\n                source_evidence_id=probe.source_evidence_id,\n                due_at=occurred_at + retry_delay[verdict.verification_class],\n            )\n        )\n\n    qualification = current.model_copy(\n''', 1)
          qpath.write_text(q, encoding='utf-8')

          qservice = Path('apps/api/src/ai_learning_platform_api/learning/qualification_service.py')
          q = qservice.read_text(encoding='utf-8')
          q = q.replace('    def _parse_datetime(value: str):\n        from datetime import datetime\n\n        return datetime.fromisoformat(value)\n', '    def _parse_datetime(value: str) -> datetime:\n        return datetime.fromisoformat(value)\n', 1)
          module_marker = 'from __future__ import annotations\n\n'
          if 'from __future__ import annotations\n\nfrom datetime import datetime\n' not in q:
              assert module_marker in q
              q = q.replace(module_marker, module_marker + 'from datetime import datetime\n\n', 1)
          qservice.write_text(q, encoding='utf-8')

          def type_test(path: str, recorded: str, evidence: str, probe: str, qualification: str) -> None:
              f = Path(path); t = f.read_text(encoding='utf-8')
              if 'CompetencyQualificationView' not in t:
                  t = t.replace('from ai_learning_platform_api.learning.schemas import (\n', 'from ai_learning_platform_api.learning.schemas import (\n    CompetencyQualificationView,\n    EvidenceRecordView,\n    PlanView,\n', 1)
                  t = t.replace('    TrustedProbeVerdict,\n', '    TrustedProbeVerdict,\n    VerificationClass,\n    VerificationProbeView,\n', 1)
              t = t.replace(recorded, recorded.replace('):', ') -> tuple[PlanView, EvidenceRecordView]:'), 1)
              t = t.replace(evidence, evidence.replace('(evidence,', '(evidence: EvidenceRecordView,'), 1)
              t = t.replace(probe, probe.replace('(probe,', '(probe: VerificationProbeView,').replace('(probe)', '(probe: VerificationProbeView)'), 1)
              t = t.replace(qualification, qualification.replace('(plan,', '(plan: PlanView,').replace('):', ') -> CompetencyQualificationView:'), 1)
              f.write_text(t, encoding='utf-8')

          type_test('apps/api/tests/test_g06_retention_transfer.py', 'def _recorded(service: LearningPlanService):', 'def _evidence_verdict(evidence,', 'def _probe_verdict(probe,', 'def _qualification(plan, competency_id: str):')
          tpath = Path('apps/api/tests/test_g06_retention_transfer.py')
          t = tpath.read_text(encoding='utf-8')
          t = t.replace('def _probe(plan, verification_class: str):', 'def _probe(plan: PlanView, verification_class: VerificationClass) -> VerificationProbeView:', 1)
          if 'retry = next(' not in t:
              marker = '    assert qualification.fully_qualified is False\n\n    duplicate = service.evaluate_probe'
              assert marker in t
              t = t.replace(marker, '''    assert qualification.fully_qualified is False\n    retry = next(\n        item for item in current.verification_probes\n        if item.verification_class == "transfer" and item.status == "scheduled"\n    )\n    assert retry.probe_id != transfer.probe_id\n\n    duplicate = service.evaluate_probe''', 1)
          tpath.write_text(t, encoding='utf-8')

          type_test('apps/api/tests/test_g06_human_simulation.py', 'def _record(service: LearningPlanService):', 'def _evidence(evidence,', 'def _pass(probe)', 'def _qualification(plan, competency_id: str):')
          hpath = Path('apps/api/tests/test_g06_human_simulation.py')
          h = hpath.read_text(encoding='utf-8').replace('def _probe(plan, proof_class: str):', 'def _probe(plan: PlanView, proof_class: VerificationClass) -> VerificationProbeView:', 1)
          hpath.write_text(h, encoding='utf-8')

          state_path = Path('plans/adaptive-product-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['active_phase'] = 'G06'
          g05 = next(x for x in state['phases'] if x['id'] == 'G05')
          g05.update({'status':'PASSED','branch':'main','accepted_sha':'d53e5457302b2106f68a410f2da6ed7001af60b2'})
          g05['production_acceptance'] = ['Quality Gates run 31269258470 passed on exact PR head d53e5457302b2106f68a410f2da6ed7001af60b2','Product deployment run 31269539912 passed on merged main SHA 51a9df280b3e705366880991e487171e01185641']
          g06 = next(x for x in state['phases'] if x['id'] == 'G06')
          g06.update({'status':'VALIDATING','branch':'product/g06-retention-transfer-engine','accepted_sha':None,'production_acceptance':[]})
          g06['implementation_evidence'] = ['apps/api/src/ai_learning_platform_api/learning/qualification.py','apps/api/src/ai_learning_platform_api/learning/qualification_service.py','apps/api/src/ai_learning_platform_api/learning/schemas.py','apps/api/src/ai_learning_platform_api/persistence/schemas.py','apps/api/src/ai_learning_platform_api/persistence/service.py']
          g06['test_evidence'] = ['apps/api/tests/test_g06_retention_transfer.py','apps/api/tests/test_g06_human_simulation.py','apps/api/tests/test_g06_persistent_probe.py','apps/api/tests/test_product_gate.py','.github/workflows/ci.yml']
          g06['human_simulation_evidence'] = ['apps/api/tests/test_g06_human_simulation.py']
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify exact G06 source
        working-directory: apps/api
        run: |
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check --fix src tests migrations/versions
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check src tests migrations/versions
          uv run --locked mypy src tests ../../scripts
          uv run --locked pytest tests/test_g06_retention_transfer.py tests/test_g06_human_simulation.py tests/test_g06_persistent_probe.py tests/test_evidence_state.py tests/test_g05_blueprint_instances.py tests/test_product_gate.py -q
      - name: Commit verified G06 and self-delete
        run: |
          git rm -f .github/workflows/g06-resolve-final.yml
          git add apps/api plans/adaptive-product-state.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete deterministic G06 qualification integration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
