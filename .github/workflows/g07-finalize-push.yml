name: G07 finalize push

on:
  push:
    branches: [product/g07-work-provenance-simulations]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/g07-work-provenance-simulations
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Wire G07 provenance contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schema = Path('apps/api/src/ai_learning_platform_api/learning/schemas.py')
          s = schema.read_text(encoding='utf-8')
          alias_marker = 'ProbeDisposition = Literal["passed", "failed"]\n'
          if 'WorkVerificationKind = Literal[' not in s:
              assert alias_marker in s
              s = s.replace(
                  alias_marker,
                  alias_marker
                  + 'WorkVerificationKind = Literal["modification", "debugging", "defense"]\n'
                  + 'WorkProvenanceStatus = Literal[\n'
                  + '    "challenge_issued", "captured", "verified", "reviewed_blocked", "rejected", "disputed"\n'
                  + ']\n'
                  + 'Sha256Hex = Annotated[str, Field(pattern=r"^[0-9a-f]{64}$")]\n',
                  1,
              )
          if 'class ArtifactCheckpointView' not in s:
              marker = '\n\nclass CompetencyView(StrictModel):\n'
              assert marker in s
              models = '''\n\nclass ArtifactCheckpointView(StrictModel):\n    """One immutable learner work checkpoint bound to content hash and declared assistance."""\n\n    checkpoint_id: Annotated[str, Field(min_length=4, max_length=160)]\n    artifact_sha256: Sha256Hex\n    parent_checkpoint_id: Annotated[str, Field(max_length=160)] = ""\n    created_at: Annotated[str, Field(min_length=10, max_length=64)]\n    change_summary: Annotated[str, Field(min_length=2, max_length=1000)]\n    toolchain: Annotated[list[str], Field(min_length=1, max_length=24)]\n    assistance: AssistanceLevel = "unknown"\n\n\nclass WorkVerificationChallengeView(StrictModel):\n    """Post-artifact hidden modification/debugging/defense challenge."""\n\n    challenge_id: str\n    evidence_id: str\n    kind: WorkVerificationKind\n    prompt: str\n    issued_at: str\n\n\nclass WorkProvenanceSubmission(StrictModel):\n    """Learner-declared artifact history and responses to server-issued work challenges."""\n\n    evidence_id: Annotated[str, Field(min_length=8, max_length=160)]\n    artifact_id: Annotated[str, Field(min_length=4, max_length=160)]\n    final_artifact_sha256: Sha256Hex\n    checkpoints: Annotated[list[ArtifactCheckpointView], Field(min_length=1, max_length=24)]\n    assistance_disclosure: AssistanceLevel = "unknown"\n    source_attribution: Annotated[str, Field(max_length=1000)] = ""\n    modification_challenge_id: Annotated[str, Field(min_length=8, max_length=160)]\n    modification_evidence_reference: Annotated[str, Field(max_length=1000)] = ""\n    debugging_challenge_id: Annotated[str, Field(min_length=8, max_length=160)]\n    debugging_evidence_reference: Annotated[str, Field(max_length=1000)] = ""\n    defense_challenge_id: Annotated[str, Field(min_length=8, max_length=160)]\n    defense_response: Annotated[str, Field(max_length=4000)] = ""\n\n\nclass TrustedWorkProvenanceVerdict(StrictModel):\n    """Trusted evaluator result for authorship, modification/debugging work, and defense."""\n\n    evidence_id: Annotated[str, Field(min_length=8, max_length=160)]\n    artifact_id: Annotated[str, Field(min_length=4, max_length=160)]\n    disposition: Literal["accepted", "rejected", "disputed"]\n    authorship_verified: bool\n    modification_verified: bool\n    debugging_verified: bool\n    defense_verified: bool\n    evaluator_id: Annotated[str, Field(min_length=2, max_length=120)]\n    evaluator_version: Annotated[str, Field(min_length=1, max_length=80)]\n    confidence: Annotated[int, Field(ge=0, le=100)]\n    findings: Annotated[list[str], Field(max_length=16)] = Field(default_factory=list)\n\n\nclass WorkProvenanceState(StrictModel):\n    """Deterministic work provenance state; missing legacy history remains explicitly missing."""\n\n    evidence_id: str\n    artifact_id: str = ""\n    status: WorkProvenanceStatus = "challenge_issued"\n    challenges: Annotated[list[WorkVerificationChallengeView], Field(max_length=3)] = Field(\n        default_factory=list\n    )\n    final_artifact_sha256: str = ""\n    checkpoints: Annotated[list[ArtifactCheckpointView], Field(max_length=24)] = Field(\n        default_factory=list\n    )\n    assistance_disclosure: AssistanceLevel = "unknown"\n    source_attribution: str = ""\n    modification_evidence_reference: str = ""\n    debugging_evidence_reference: str = ""\n    defense_response: str = ""\n    source_high_stakes_eligible: bool = False\n    authorship_verified: bool = False\n    modification_verified: bool = False\n    debugging_verified: bool = False\n    defense_verified: bool = False\n    evaluator_id: str = ""\n    evaluator_version: str = ""\n    evaluation_id: str = ""\n    captured_at: str = ""\n    evaluated_at: str | None = None\n    issues: Annotated[list[str], Field(max_length=24)] = Field(default_factory=list)\n    eligible_for_readiness: bool = False\n'''
              s = s.replace(marker, models + marker, 1)
          learner_marker = '    verification_probes: list[VerificationProbeView] = Field(default_factory=list)\n'
          if 'work_provenance: dict[str, WorkProvenanceState]' not in s:
              assert learner_marker in s
              s = s.replace(
                  learner_marker,
                  learner_marker
                  + '    work_provenance: dict[str, WorkProvenanceState] = Field(default_factory=dict)\n',
                  1,
              )
          plan_index = s.index('class PlanView(StrictModel):')
          before, after = s[:plan_index], s[plan_index:]
          plan_marker = '    verification_probes: list[VerificationProbeView] = Field(default_factory=list)\n'
          if '    work_provenance: list[WorkProvenanceState]' not in after:
              assert plan_marker in after
              after = after.replace(
                  plan_marker,
                  plan_marker + '    work_provenance: list[WorkProvenanceState] = Field(default_factory=list)\n',
                  1,
              )
              s = before + after
          schema.write_text(s, encoding='utf-8')

          Path('apps/api/src/ai_learning_platform_api/learning/__init__.py').write_text(
              '"""Learner diagnosis, planning, signed state, and trusted served-instance domain."""\n\n'
              'from ai_learning_platform_api.learning.provenance_service import (\n'
              '    ProvenanceLearningPlanService as LearningPlanService,\n'
              ')\n\n__all__ = ["LearningPlanService"]\n',
              encoding='utf-8',
          )

          ppath = Path('apps/api/src/ai_learning_platform_api/learning/provenance.py')
          p = ppath.read_text(encoding='utf-8')
          if '    EvidenceRecordView,\n' not in p:
              p = p.replace('    ArtifactCheckpointView,\n', '    ArtifactCheckpointView,\n    EvidenceRecordView,\n', 1)
          if '    WorkVerificationKind,\n' not in p:
              p = p.replace('    WorkVerificationChallengeView,\n', '    WorkVerificationChallengeView,\n    WorkVerificationKind,\n', 1)
          p = p.replace('    status = "verified" if eligible else verdict.disposition\n', '    status = (\n        "verified"\n        if eligible\n        else ("reviewed_blocked" if verdict.disposition == "accepted" else verdict.disposition)\n    )\n', 1)
          p = p.replace('def _find_evidence(state: LearnerState, evidence_id: str):\n', 'def _find_evidence(state: LearnerState, evidence_id: str) -> EvidenceRecordView:\n', 1)
          p = p.replace('    kind: str,\n', '    kind: WorkVerificationKind,\n', 1)
          ppath.write_text(p, encoding='utf-8')

          pschema = Path('apps/api/src/ai_learning_platform_api/persistence/schemas.py')
          p = pschema.read_text(encoding='utf-8')
          if '    TrustedWorkProvenanceVerdict,\n' not in p:
              p = p.replace('    TrustedProbeVerdict,\n', '    TrustedProbeVerdict,\n    TrustedWorkProvenanceVerdict,\n    WorkProvenanceSubmission,\n', 1)
          if 'class PersistentWorkVerificationRequest' not in p:
              marker = '\n\nclass PersistentPlanView(StrictModel):\n'
              assert marker in p
              p = p.replace(marker, '''\n\nclass PersistentWorkVerificationRequest(PersistentMutationRequest):\n    """Issue post-artifact modification/debugging/defense challenges durably."""\n\n    evidence_id: Annotated[str, Field(min_length=8, max_length=160)]\n\n\nclass PersistentWorkProvenanceSubmissionRequest(PersistentMutationRequest):\n    """Capture immutable learner work provenance through the durable aggregate."""\n\n    submission: WorkProvenanceSubmission\n\n\nclass PersistentWorkProvenanceEvaluationRequest(PersistentMutationRequest):\n    """Commit one trusted authorship/modification/debugging/defense verdict."""\n\n    verdict: TrustedWorkProvenanceVerdict\n''' + marker, 1)
          pschema.write_text(p, encoding='utf-8')

          pservice = Path('apps/api/src/ai_learning_platform_api/persistence/service.py')
          p = pservice.read_text(encoding='utf-8')
          if '    PersistentWorkVerificationRequest,\n' not in p:
              marker = '    PersistentProgressRequest,\n'
              assert marker in p
              p = p.replace(marker, marker + '    PersistentWorkProvenanceEvaluationRequest,\n    PersistentWorkProvenanceSubmissionRequest,\n    PersistentWorkVerificationRequest,\n', 1)
          if 'async def issue_work_verification(' not in p:
              marker = '\n    async def replan(\n'
              assert marker in p
              p = p.replace(marker, '''\n    async def issue_work_verification(\n        self,\n        *,\n        account_id: str,\n        request: PersistentWorkVerificationRequest,\n    ) -> PersistentPlanView:\n        stored = await self._load_expected(\n            account_id=account_id, learner_id=request.learner_id,\n            expected_version=request.expected_version,\n        )\n        plan = self._core.issue_work_verification(\n            state_token=self._codec.encode(stored.state), evidence_id=request.evidence_id\n        )\n        if plan.sequence == stored.state.sequence:\n            return self._view(stored)\n        return await self._commit_plan(\n            account_id=account_id, stored=stored, state_token=plan.state_token,\n            idempotency_key=request.idempotency_key,\n            event_type="learner.work.verification_issued",\n        )\n\n    async def submit_work_provenance(\n        self,\n        *,\n        account_id: str,\n        request: PersistentWorkProvenanceSubmissionRequest,\n    ) -> PersistentPlanView:\n        stored = await self._load_expected(\n            account_id=account_id, learner_id=request.learner_id,\n            expected_version=request.expected_version,\n        )\n        plan = self._core.submit_work_provenance(\n            state_token=self._codec.encode(stored.state), submission=request.submission\n        )\n        return await self._commit_plan(\n            account_id=account_id, stored=stored, state_token=plan.state_token,\n            idempotency_key=request.idempotency_key,\n            event_type="learner.work.provenance_captured",\n        )\n\n    async def evaluate_work_provenance(\n        self,\n        *,\n        account_id: str,\n        request: PersistentWorkProvenanceEvaluationRequest,\n    ) -> PersistentPlanView:\n        stored = await self._load_expected(\n            account_id=account_id, learner_id=request.learner_id,\n            expected_version=request.expected_version,\n        )\n        plan = self._core.evaluate_work_provenance(\n            state_token=self._codec.encode(stored.state), verdict=request.verdict\n        )\n        if plan.sequence == stored.state.sequence:\n            return self._view(stored)\n        return await self._commit_plan(\n            account_id=account_id, stored=stored, state_token=plan.state_token,\n            idempotency_key=request.idempotency_key,\n            event_type="learner.work.provenance_evaluated",\n        )\n\n''' + marker, 1)
          pservice.write_text(p, encoding='utf-8')

          human = Path('apps/api/tests/test_g07_human_simulation.py')
          h = human.read_text(encoding='utf-8')
          if '    AssistanceLevel,\n' not in h:
              h = h.replace('    ArtifactCheckpointView,\n', '    ArtifactCheckpointView,\n    AssistanceLevel,\n', 1)
          h = h.replace('    assistance: str = "none",\n', '    assistance: AssistanceLevel = "none",\n', 1)
          human.write_text(h, encoding='utf-8')

          state_path = Path('plans/adaptive-product-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['active_phase'] = 'G07'
          g07 = next(item for item in state['phases'] if item['id'] == 'G07')
          g07.update({'status':'VALIDATING','branch':'product/g07-work-provenance-simulations','accepted_sha':None,'production_acceptance':[]})
          g07['implementation_evidence'] = [
              'apps/api/src/ai_learning_platform_api/learning/provenance.py',
              'apps/api/src/ai_learning_platform_api/learning/provenance_service.py',
              'apps/api/src/ai_learning_platform_api/learning/schemas.py',
              'apps/api/src/ai_learning_platform_api/learning/__init__.py',
              'apps/api/src/ai_learning_platform_api/persistence/schemas.py',
              'apps/api/src/ai_learning_platform_api/persistence/service.py',
          ]
          g07['test_evidence'] = [
              'apps/api/tests/test_g07_work_provenance.py',
              'apps/api/tests/test_g07_human_simulation.py',
              'apps/api/tests/test_g07_persistent_provenance.py',
              'apps/api/tests/test_product_gate.py',
              '.github/workflows/ci.yml',
          ]
          g07['human_simulation_evidence'] = ['apps/api/tests/test_g07_human_simulation.py']
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

          gate_test = Path('apps/api/tests/test_product_gate.py')
          g = gate_test.read_text(encoding='utf-8')
          if '    assert active.identifier == "G06"\n' in g:
              g = g.replace('    assert active.identifier == "G06"\n', '    assert active.identifier == "G07"\n', 1)
          gate_test.write_text(g, encoding='utf-8')
          PY
      - name: Verify permanent G07 source
        working-directory: apps/api
        run: |
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check --fix src tests migrations/versions
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check src tests migrations/versions
          uv run --locked mypy src tests ../../scripts
          uv run --locked pytest tests/test_g07_work_provenance.py tests/test_g07_human_simulation.py tests/test_g07_persistent_provenance.py tests/test_product_gate.py -q
      - name: Commit verified G07 and remove temporary helpers
        run: |
          git rm -f .github/workflows/g07-finalize-push.yml .github/workflows/g07-finalize-once.yml
          git add apps/api plans/adaptive-product-state.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete G07 work provenance integration'
          git push origin HEAD:product/g07-work-provenance-simulations
