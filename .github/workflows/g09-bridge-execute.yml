name: G09 bridge canonical executor

on:
  push:
    branches: [product/g09-integration-hardening]

permissions:
  contents: write

concurrency:
  group: g09-bridge-canonical-executor
  cancel-in-progress: true

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_PLATFORM_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ai_learning_platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/g09-integration-hardening
          persist-credentials: true

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin canonical npm
        run: |
          npm install --global npm@11.18.0
          test "$(npm --version)" = "11.18.0"

      - name: Reuse G09 bridge wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/g09-bridge-resolve.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Wire G09 bridge product surfaces\n        run: |\n'
          end_marker = '\n      - name: Verify API and PostgreSQL bridge\n'
          if start_marker not in source or end_marker not in source:
              raise SystemExit('G09 bridge wiring block could not be located')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = body.splitlines()
          normalized = []
          for line in lines:
              if line.startswith('          '):
                  normalized.append(line[10:])
              elif line.strip():
                  raise SystemExit('unexpected indentation in G09 bridge wiring block')
              else:
                  normalized.append('')
          Path('/tmp/g09-wire.sh').write_text('\n'.join(normalized) + '\n', encoding='utf-8')
          PY
          bash /tmp/g09-wire.sh

      - name: Verify API and PostgreSQL bridge
        working-directory: apps/api
        run: |
          uv sync --locked --all-groups
          uv run --locked ruff format src tests
          uv run --locked ruff check --fix src tests
          uv run --locked ruff format src tests
          uv run --locked ruff check src tests ../../scripts
          uv run --locked mypy src tests ../../scripts
          uv run --locked alembic upgrade head
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest
          uv run --locked coverage report --fail-under=95
          bash -n ../../scripts/deploy-product.sh

      - name: Verify Web bridge
        working-directory: apps/web
        run: |
          npm run verify:build-toolchain
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit verified G09 bridge
        run: |
          git add apps/api apps/web scripts/deploy-product.sh plans/adaptive-product-state.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete G09 full-stack bridge hardening'
          git push origin HEAD:product/g09-integration-hardening
