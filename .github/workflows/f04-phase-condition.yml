name: F04 phase timestamp condition

on:
  push:
    branches:
      - work/f04-payload-hygiene

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture timestamp validator condition
        run: |
          mkdir -p "$RUNNER_TEMP/f04-condition"
          grep -R -n -C 12 "state_inventory_timestamp_disagreement" \
            apps/api/src apps/api/tests scripts \
            >"$RUNNER_TEMP/f04-condition/condition.txt" || true
          python - <<'PY' >"$RUNNER_TEMP/f04-condition/values.json"
          import json
          from pathlib import Path
          state = json.loads(Path('plans/autonomous-loop/state.json').read_text())
          inventory = json.loads(Path('plans/implementation-inventory.json').read_text())
          print(json.dumps({
            'state_inventory_generated_at': state.get('implementation_inventory', {}).get('generated_at'),
            'inventory_generated_at': inventory.get('generated_at'),
            'state_last_run_started_at': state.get('last_run_started_at'),
            'state_last_run_completed_at': state.get('last_run_completed_at'),
            'state_last_verified_commit': state.get('last_verified_commit'),
            'inventory_repository_head': inventory.get('repository', {}).get('head'),
          }, indent=2))
          PY
      - name: Upload condition
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f04-phase-timestamp-condition-${{ github.sha }}
          path: ${{ runner.temp }}/f04-condition
          if-no-files-found: error
          retention-days: 7
      - name: Publish status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context="F04 / phase timestamp condition"
          -f description="Timestamp condition artifact available"
          -f target_url="$TARGET"
