name: G09 resolve integration hardening

on:
  push:
    branches: [product/g09-integration-hardening]

permissions:
  contents: write

concurrency:
  group: g09-integration-resolver
  cancel-in-progress: true

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_PLATFORM_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ai_learning_platform
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/g09-integration-hardening
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Wire account export, replay audit, privacy transport, and production canary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contracts = Path('apps/api/src/ai_learning_platform_api/persistence/contracts.py')
          c = contracts.read_text(encoding='utf-8')
          if 'class AccountStateExportRepository' not in c:
              marker = '\n\nclass TaskExposureIndexRepository(Protocol):\n'
              if marker not in c:
                  raise SystemExit('G09 export protocol marker missing')
              addition = '''\n\nclass AccountStateExportRepository(Protocol):\n    """List every durable learner aggregate owned by one account for privacy export."""\n\n    async def list_account_states(\n        self,\n        *,\n        account_id: str,\n    ) -> tuple[StoredLearnerState, ...]: ...\n'''
              c = c.replace(marker, addition + marker, 1)
          contracts.write_text(c, encoding='utf-8')

          schemas = Path('apps/api/src/ai_learning_platform_api/persistence/schemas.py')
          s = schemas.read_text(encoding='utf-8')
          s = s.replace('from typing import Annotated\n', 'from typing import Annotated, Literal\n', 1)
          if '    LearnerState,\n' not in s:
              s = s.replace(
                  '    CompetencyRating,\n',
                  '    CompetencyRating,\n    LearnerState,\n',
                  1,
              )
          if 'class LearnerOperationalAuditView' not in s:
              s += '''\n\nclass LearnerOperationalAuditView(StrictModel):\n    """Bounded replay/resource/claim audit attached to one exported learner aggregate."""\n\n    raw_state_bytes: Annotated[int, Field(ge=0, le=262_144)]\n    evidence_records: Annotated[int, Field(ge=0, le=24)]\n    evaluation_records: Annotated[int, Field(ge=0, le=64)]\n    retained_plan_versions: Annotated[int, Field(ge=0, le=3)]\n    verification_probes: Annotated[int, Field(ge=0, le=96)]\n    work_provenance_records: Annotated[int, Field(ge=0, le=32)]\n    active_task_exposures: Annotated[int, Field(ge=0, le=16)]\n    replay_verified: bool\n    claim_integrity_verified: bool\n    within_resource_bounds: bool\n\n\nclass LearnerDataExportView(StrictModel):\n    """One exported durable learner snapshot with no account cookie or server secret material."""\n\n    learner_id: UUID\n    aggregate_version: Annotated[int, Field(ge=0)]\n    updated_at: str\n    state: LearnerState\n    audit: LearnerOperationalAuditView\n\n\nclass AccountDataExportView(StrictModel):\n    """Redacted current-account data export with replay and retention disclosures."""\n\n    schema_version: Literal[1] = 1\n    generated_at: str\n    learners: list[LearnerDataExportView]\n    redactions: list[str]\n    retention_notes: list[str]\n'''
          schemas.write_text(s, encoding='utf-8')

          postgres = Path('apps/api/src/ai_learning_platform_api/persistence/postgres.py')
          p = postgres.read_text(encoding='utf-8')
          if 'async def list_account_states(' not in p:
              marker = '    async def delete_account(self, *, account_id: str) -> bool:\n'
              if marker not in p:
                  raise SystemExit('G09 Postgres delete marker missing')
              method = '''    async def list_account_states(\n        self,\n        *,\n        account_id: str,\n    ) -> tuple[StoredLearnerState, ...]:\n        """Return every learner aggregate owned by one account for privacy export."""\n        validate_account_id(account_id)\n        statement = (\n            select(\n                learner_states.c.account_id,\n                learner_states.c.learner_id,\n                learner_states.c.version,\n                learner_states.c.state,\n                learner_states.c.updated_at,\n            )\n            .where(learner_states.c.account_id == account_id)\n            .order_by(learner_states.c.learner_id)\n        )\n        try:\n            async with self._engine.connect() as connection:\n                rows = (await connection.execute(statement)).mappings().all()\n        except SQLAlchemyError as error:\n            raise PersistenceUnavailableError from error\n        return tuple(_stored_state(row) for row in rows)\n\n'''
              p = p.replace(marker, method + marker, 1)
          postgres.write_text(p, encoding='utf-8')

          service = Path('apps/api/src/ai_learning_platform_api/persistence/service.py')
          p = service.read_text(encoding='utf-8')
          if 'from ai_learning_platform_api.persistence.operational import audit_stored_state\n' not in p:
              p = p.replace(
                  'from ai_learning_platform_api.persistence.contracts import (\n',
                  'from ai_learning_platform_api.persistence.operational import audit_stored_state\n'
                  'from ai_learning_platform_api.persistence.contracts import (\n',
                  1,
              )
          for name, anchor in (
              ('AccountStateExportRepository', '    LearnerStateCommit,\n'),
              ('LearnerStateReplayRepository', '    LearnerStateRepository,\n'),
              ('PersistenceUnavailableError', '    LearnerStateNotFoundError,\n'),
              ('ReplayDivergenceError', '    PersistenceUnavailableError,\n'),
          ):
              if f'    {name},\n' not in p:
                  if anchor not in p:
                      raise SystemExit(f'G09 service import marker missing for {name}')
                  p = p.replace(anchor, anchor + f'    {name},\n', 1)
          if '    AccountDataExportView,\n' not in p:
              p = p.replace(
                  'from ai_learning_platform_api.persistence.schemas import (\n',
                  'from ai_learning_platform_api.persistence.schemas import (\n'
                  '    AccountDataExportView,\n'
                  '    LearnerDataExportView,\n',
                  1,
              )
          constructor_marker = '''        repository: LearnerStateRepository,\n        exposure_repository: TaskExposureIndexRepository | None = None,\n        clock: Clock | None = None,\n'''
          if 'export_repository: AccountStateExportRepository | None = None' not in p:
              replacement = '''        repository: LearnerStateRepository,\n        exposure_repository: TaskExposureIndexRepository | None = None,\n        export_repository: AccountStateExportRepository | None = None,\n        replay_repository: LearnerStateReplayRepository | None = None,\n        clock: Clock | None = None,\n'''
              if constructor_marker not in p:
                  raise SystemExit('G09 service constructor marker missing')
              p = p.replace(constructor_marker, replacement, 1)
          assignment_marker = '        self._exposure_repository = exposure_repository\n'
          if 'self._export_repository = export_repository' not in p:
              if assignment_marker not in p:
                  raise SystemExit('G09 service assignment marker missing')
              p = p.replace(
                  assignment_marker,
                  assignment_marker
                  + '        self._export_repository = export_repository\n'
                  + '        self._replay_repository = replay_repository\n',
                  1,
              )
          if 'async def export_account(' not in p:
              marker = '    async def delete_account(self, *, account_id: str) -> bool:\n'
              if marker not in p:
                  raise SystemExit('G09 service delete marker missing')
              method = '''    async def export_account(self, *, account_id: str) -> AccountDataExportView:\n        """Export every owned learner only after deterministic append-only replay verification."""\n        if self._export_repository is None or self._replay_repository is None:\n            raise PersistenceUnavailableError\n        stored_states = await self._export_repository.list_account_states(account_id=account_id)\n        if not stored_states:\n            raise LearnerStateNotFoundError\n        learners: list[LearnerDataExportView] = []\n        for stored in stored_states:\n            replay = await self._replay_repository.replay(\n                account_id=account_id,\n                learner_id=stored.learner_id,\n            )\n            audit = audit_stored_state(stored, replay=replay)\n            if not audit.replay_verified:\n                raise ReplayDivergenceError\n            learners.append(\n                LearnerDataExportView(\n                    learner_id=stored.learner_id,\n                    aggregate_version=stored.version,\n                    updated_at=stored.updated_at.isoformat(),\n                    state=stored.state,\n                    audit=audit,\n                )\n            )\n        return AccountDataExportView(\n            generated_at=self._now().isoformat(),\n            learners=learners,\n            redactions=[\n                "server_secrets",\n                "provider_credentials",\n                "account_cookie",\n                "raw_transport_headers",\n            ],\n            retention_notes=["unlinkable_task_collision_fingerprints"],\n        )\n\n'''
              p = p.replace(marker, method + marker, 1)
          service.write_text(p, encoding='utf-8')

          privacy = Path('apps/api/src/ai_learning_platform_api/transport/http/privacy.py')
          p = privacy.read_text(encoding='utf-8')
          if 'from ai_learning_platform_api.persistence.schemas import AccountDataExportView\n' not in p:
              p = p.replace(
                  'from ai_learning_platform_api.persistence.contracts import PersistenceUnavailableError\n',
                  'from ai_learning_platform_api.persistence.contracts import (\n'
                  '    LearnerStateNotFoundError,\n'
                  '    PersistenceUnavailableError,\n'
                  '    ReplayDivergenceError,\n'
                  ')\n'
                  'from ai_learning_platform_api.persistence.schemas import AccountDataExportView\n',
                  1,
              )
          if 'ExportAccount = Callable' not in p:
              p = p.replace(
                  'DeleteAccount = Callable[[str], Awaitable[bool]]\n',
                  'DeleteAccount = Callable[[str], Awaitable[bool]]\n'
                  'ExportAccount = Callable[[str], Awaitable[AccountDataExportView]]\n',
                  1,
              )
          p = p.replace(
              'def create_privacy_router(delete_account: DeleteAccount) -> APIRouter:\n',
              'def create_privacy_router(\n'
              '    delete_account: DeleteAccount,\n'
              '    export_account: ExportAccount | None = None,\n'
              ') -> APIRouter:\n',
              1,
          )
          if '@router.get("/account/export"' not in p:
              marker = '    @router.delete("/account", response_model=AccountDeletionView)\n'
              if marker not in p:
                  raise SystemExit('G09 privacy delete route marker missing')
              route = '''    @router.get("/account/export", response_model=AccountDataExportView)\n    async def export_current_account(account_header: AccountHeader) -> AccountDataExportView:\n        account_id = _uuid(account_header)\n        if export_account is None:\n            raise HTTPException(\n                status_code=status.HTTP_503_SERVICE_UNAVAILABLE,\n                detail={\n                    "code": "PERSISTENCE_UNAVAILABLE",\n                    "message": "Account data export is unavailable in this storage mode.",\n                },\n            )\n        try:\n            return await export_account(account_id)\n        except LearnerStateNotFoundError as error:\n            raise HTTPException(\n                status_code=status.HTTP_404_NOT_FOUND,\n                detail={\n                    "code": "ACCOUNT_DATA_NOT_FOUND",\n                    "message": "No durable learner data exists for this account.",\n                },\n            ) from error\n        except ReplayDivergenceError as error:\n            raise HTTPException(\n                status_code=status.HTTP_409_CONFLICT,\n                detail={\n                    "code": "REPLAY_DIVERGENCE",\n                    "message": "Account export failed replay verification.",\n                },\n            ) from error\n        except PersistenceUnavailableError as error:\n            raise HTTPException(\n                status_code=status.HTTP_503_SERVICE_UNAVAILABLE,\n                detail={\n                    "code": "PERSISTENCE_UNAVAILABLE",\n                    "message": "Account data could not be exported right now.",\n                },\n            ) from error\n\n'''
              p = p.replace(marker, route + marker, 1)
          privacy.write_text(p, encoding='utf-8')

          app = Path('apps/api/src/ai_learning_platform_api/app.py')
          a = app.read_text(encoding='utf-8')
          constructor = '''        persistent_service = PersistentLearningService(\n            secret=secret,\n            repository=postgres_repository,\n            exposure_repository=postgres_repository,\n        )\n'''
          replacement = '''        persistent_service = PersistentLearningService(\n            secret=secret,\n            repository=postgres_repository,\n            exposure_repository=postgres_repository,\n            export_repository=postgres_repository,\n            replay_repository=postgres_repository,\n        )\n'''
          if constructor in a:
              a = a.replace(constructor, replacement, 1)
          if 'async def export_current_account(' not in a:
              marker = '''        async def delete_current_account(account_id: str) -> bool:\n            if persistent_service is None:\n                return False\n            return await persistent_service.delete_account(account_id=account_id)\n\n        app.include_router(create_privacy_router(delete_current_account))\n'''
              replacement = '''        async def delete_current_account(account_id: str) -> bool:\n            if persistent_service is None:\n                return False\n            return await persistent_service.delete_account(account_id=account_id)\n\n        async def export_current_account(account_id: str):\n            if persistent_service is None:\n                raise RuntimeError("persistent account export is unavailable")\n            return await persistent_service.export_account(account_id=account_id)\n\n        app.include_router(\n            create_privacy_router(delete_current_account, export_current_account)\n        )\n'''
              if marker not in a:
                  raise SystemExit('G09 app privacy marker missing')
              a = a.replace(marker, replacement, 1)
          app.write_text(a, encoding='utf-8')

          deploy = Path('scripts/deploy-product.sh')
          d = deploy.read_text(encoding='utf-8')
          export_marker = '''python - "$progress_json" "$learner_id" <<'PY'\nimport json\nimport sys\n\npayload = json.loads(sys.argv[1])\nif payload.get("learner_id") != sys.argv[2]:\n    raise SystemExit("persisted learner id changed after progress")\nif payload.get("sequence") != 1:\n    raise SystemExit("progress did not advance sequence")\nif payload.get("completed_count") != 1:\n    raise SystemExit("progress was not durably recorded")\nPY\n\ndelete_body='{"confirmation":"DELETE"}'\n'''
          if 'account/export' not in d:
              if export_marker not in d:
                  raise SystemExit('G09 deployment progress marker missing')
              export_block = '''python - "$progress_json" "$learner_id" <<'PY'\nimport json\nimport sys\n\npayload = json.loads(sys.argv[1])\nif payload.get("learner_id") != sys.argv[2]:\n    raise SystemExit("persisted learner id changed after progress")\nif payload.get("sequence") != 1:\n    raise SystemExit("progress did not advance sequence")\nif payload.get("completed_count") != 1:\n    raise SystemExit("progress was not durably recorded")\nPY\n\nexport_json="$(curl -fsS --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 90 \\\n  -b "$cookie_jar" -c "$cookie_jar" \\\n  "$WEB_ORIGIN/api/platform/account/export")"\npython - "$export_json" "$learner_id" <<'PY'\nimport json\nimport sys\n\npayload = json.loads(sys.argv[1])\nlearners = payload.get("learners")\nif payload.get("schema_version") != 1 or not isinstance(learners, list) or not learners:\n    raise SystemExit("account export contract is incomplete")\nmatch = next((item for item in learners if item.get("learner_id") == sys.argv[2]), None)\nif match is None:\n    raise SystemExit("account export omitted the durable learner")\naudit = match.get("audit") or {}\nif not audit.get("replay_verified"):\n    raise SystemExit("account export replay verification failed")\nif not audit.get("within_resource_bounds"):\n    raise SystemExit("account export resource audit failed")\nif not audit.get("claim_integrity_verified"):\n    raise SystemExit("account export claim audit failed")\nif "server_secrets" not in payload.get("redactions", []):\n    raise SystemExit("account export redaction disclosure is missing")\nif "unlinkable_task_collision_fingerprints" not in payload.get("retention_notes", []):\n    raise SystemExit("account export retention disclosure is missing")\nif "account_id" in json.dumps(payload, sort_keys=True):\n    raise SystemExit("account export leaked the account identifier")\nPY\n\ndelete_body='{"confirmation":"DELETE"}'\n'''
              d = d.replace(export_marker, export_block, 1)
          post_marker = '''if [[ "$post_delete_resume_status" != "404" ]]; then\n  echo "Expected deleted learner resume to return 404, got $post_delete_resume_status" >&2\n  cat /tmp/product-post-delete.json >&2\n  exit 1\nfi\n\nDEPLOYMENT_ID="$deployment_id" \\\n'''
          if 'product-post-delete-export.json' not in d:
              if post_marker not in d:
                  raise SystemExit('G09 deployment post-delete marker missing')
              post_block = '''if [[ "$post_delete_resume_status" != "404" ]]; then\n  echo "Expected deleted learner resume to return 404, got $post_delete_resume_status" >&2\n  cat /tmp/product-post-delete.json >&2\n  exit 1\nfi\n\npost_delete_export_status="$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors --connect-timeout 15 --max-time 90 \\\n  -o /tmp/product-post-delete-export.json -w '%{http_code}' \\\n  -b "$cookie_jar" -c "$cookie_jar" \\\n  "$WEB_ORIGIN/api/platform/account/export")"\nif [[ "$post_delete_export_status" != "404" ]]; then\n  echo "Expected deleted account export to return 404, got $post_delete_export_status" >&2\n  cat /tmp/product-post-delete-export.json >&2\n  exit 1\nfi\n\nDEPLOYMENT_ID="$deployment_id" \\\n'''
              d = d.replace(post_marker, post_block, 1)
          deploy.write_text(d, encoding='utf-8')

          state_path = Path('plans/adaptive-product-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['active_phase'] = 'G09'
          g08 = next(item for item in state['phases'] if item['id'] == 'G08')
          g08.update(
              {
                  'status': 'PASSED',
                  'branch': 'main',
                  'accepted_sha': 'e19e780be347eeb4e7cab9d56173ed59246b2808',
                  'production_acceptance': [
                      'Quality Gates run 31275217479 passed on exact PR head e19e780be347eeb4e7cab9d56173ed59246b2808',
                      'Product deployment run 31275315312 passed on merged main SHA 003ebe8ff6818d97797b11aba69ee55826eeb09f',
                  ],
              }
          )
          g09 = next(item for item in state['phases'] if item['id'] == 'G09')
          g09.update(
              {
                  'status': 'VALIDATING',
                  'branch': 'product/g09-integration-hardening',
                  'accepted_sha': None,
                  'production_acceptance': [],
              }
          )
          g09['implementation_evidence'] = [
              'apps/api/src/ai_learning_platform_api/persistence/operational.py',
              'apps/api/src/ai_learning_platform_api/persistence/contracts.py',
              'apps/api/src/ai_learning_platform_api/persistence/schemas.py',
              'apps/api/src/ai_learning_platform_api/persistence/postgres.py',
              'apps/api/src/ai_learning_platform_api/persistence/service.py',
              'apps/api/src/ai_learning_platform_api/transport/http/privacy.py',
              'apps/api/src/ai_learning_platform_api/app.py',
              'scripts/deploy-product.sh',
          ]
          g09['test_evidence'] = [
              'apps/api/tests/test_g09_account_export.py',
              'apps/api/tests/test_g09_privacy_export.py',
              'apps/api/tests/test_g09_human_simulation.py',
              'apps/api/tests/test_product_gate.py',
              '.github/workflows/ci.yml',
              '.github/workflows/product-deployment.yml',
          ]
          g09['human_simulation_evidence'] = ['apps/api/tests/test_g09_human_simulation.py']
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

          gate = Path('apps/api/tests/test_product_gate.py')
          g = gate.read_text(encoding='utf-8')
          g = g.replace(
              '    head_ref = os.environ.get("GITHUB_HEAD_REF") or "product/g08-readiness-projection"\n',
              '    head_ref = os.environ.get("GITHUB_HEAD_REF") or "product/g09-integration-hardening"\n',
              1,
          )
          g = g.replace(
              '    assert active.identifier == "G08"\n',
              '    assert active.identifier == "G09"\n',
              1,
          )
          gate.write_text(g, encoding='utf-8')
          PY
      - name: Verify terminal API and deployment surface
        working-directory: apps/api
        run: |
          uv sync --locked --all-groups
          uv run --locked ruff format src tests
          uv run --locked ruff check --fix src tests
          uv run --locked ruff format src tests
          uv run --locked ruff check src tests ../../scripts
          uv run --locked mypy src tests ../../scripts
          uv run --locked alembic upgrade head
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest
          uv run --locked coverage report --fail-under=95
          bash -n ../../scripts/deploy-product.sh
      - name: Commit verified G09 product source
        run: |
          git add apps/api scripts/deploy-product.sh plans/adaptive-product-state.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete G09 integration hardening'
          git push origin HEAD:product/g09-integration-hardening
