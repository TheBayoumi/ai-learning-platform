name: G08 execute resolver

on:
  push:
    branches: [product/g08-readiness-projection]

permissions:
  contents: write

concurrency:
  group: g08-readiness-executor
  cancel-in-progress: true

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/g08-readiness-projection
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Execute embedded G08 wiring scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          text = Path('.github/workflows/g08-resolve.yml').read_text(encoding='utf-8')

          def script_for(name: str) -> str:
              marker = f'      - name: {name}\n        run: |\n'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing embedded G08 step: {name}')
              start += len(marker)
              tail = text[start:]
              candidates = [
                  value for value in (
                      tail.find('\n      - name: '),
                      tail.find('\n      - uses: '),
                  ) if value >= 0
              ]
              end = min(candidates) if candidates else len(tail)
              block = tail[:end]
              lines = block.splitlines()
              return '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in lines
              ) + '\n'

          for step_name in ('Wire G08 API contracts', 'Wire G08 Web contracts'):
              subprocess.run(
                  ['bash', '-euo', 'pipefail'],
                  input=script_for(step_name),
                  text=True,
                  check=True,
              )
          PY
      - name: Verify API readiness slice
        working-directory: apps/api
        run: |
          uv sync --locked --all-groups
          uv run --locked ruff format src tests
          uv run --locked ruff check --fix src tests
          uv run --locked ruff format src tests
          uv run --locked ruff check src tests ../../scripts
          uv run --locked mypy src tests ../../scripts
          uv run --locked pytest \
            tests/test_g08_readiness_projection.py \
            tests/test_g08_human_simulation.py \
            tests/test_g07_work_provenance.py \
            tests/test_g06_retention_transfer.py \
            tests/test_product_gate.py -q
      - name: Verify Web readiness slice
        working-directory: apps/web
        run: |
          npm install --global npm@11.18.0
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit verified G08 product source
        run: |
          git add apps/api apps/web plans/adaptive-product-state.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete G08 deterministic readiness projection'
          git push origin HEAD:product/g08-readiness-projection
