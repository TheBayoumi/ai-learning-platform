name: Release hotfix normalization

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  normalize:
    if: >-
      github.event.pull_request.number == 15 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/release-deployment-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: fix/release-deployment-preflight
          fetch-depth: 0
          persist-credentials: true
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - name: Normalize changed Python and controller hash
        run: |
          uv sync --project apps/api --locked --all-groups
          uv run --project apps/api --locked ruff check --fix \
            apps/api/src/ai_learning_platform_api/persistence/service.py
          uv run --project apps/api --locked ruff format \
            apps/api/src/ai_learning_platform_api/persistence/service.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          canonical = workflow.read_bytes().replace(b'\r\n', b'\n')
          digest = hashlib.sha256(canonical).hexdigest()

          state_path = Path('plans/autonomous-loop/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['authoritative_file_hashes']['.github/workflows/ci.yml'] = digest
          state_path.write_text(
              json.dumps(state, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
              newline='\n',
          )
          PY
          git diff --check
      - name: Commit deterministic normalization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/ai_learning_platform_api/persistence/service.py \
            plans/autonomous-loop/state.json
          git commit -m "chore(release): normalize hotfix contracts"
          git push origin HEAD:fix/release-deployment-preflight
