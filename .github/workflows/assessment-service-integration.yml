name: Assessment service integration

on:
  push:
    branches:
      - automation/assessment-calibration

permissions:
  contents: write
  statuses: write

concurrency:
  group: assessment-service-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply assessment orchestration
        run: |
          python scripts/apply_assessment_service_integration.py
          git checkout "$GITHUB_SHA" -- apps/api/tests/test_assessment_api.py

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api

      - name: Synchronize dependencies
        run: uv sync --project apps/api --locked --all-groups

      - name: Format assessment service
        run: uv run --project apps/api --locked ruff format apps/api scripts

      - name: Autofix assessment lint
        run: uv run --project apps/api --locked ruff check --fix --exit-zero apps/api scripts

      - name: Check assessment formatting
        run: uv run --project apps/api --locked ruff format --check apps/api scripts

      - name: Capture assessment lint
        shell: bash
        run: |
          set +e
          uv run --project apps/api --locked ruff check apps/api scripts \
            >"$RUNNER_TEMP/assessment-lint.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/assessment-lint.txt"
          exit "$status"

      - name: Upload assessment lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assessment-lint-${{ github.sha }}
          path: ${{ runner.temp }}/assessment-lint.txt
          if-no-files-found: error
          retention-days: 7

      - name: Type check assessment service
        run: uv run --project apps/api --locked mypy apps/api/src apps/api/tests scripts

      - name: Test assessment service with coverage
        working-directory: apps/api
        run: |
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest
          uv run --locked coverage report --fail-under=95

      - name: Commit verified service integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add apps/api
          git commit -m "feat(assessment): integrate calibration into learner planning"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish integration status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Assessment service verified' || 'Assessment service integration failed' }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state="$STATUS_STATE"
          -f context="Product / assessment service integration"
          -f description="$STATUS_DESCRIPTION"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
