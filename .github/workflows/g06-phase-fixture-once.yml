name: G06 phase fixture once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'product/g06-retention-transfer-engine' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Advance committed phase assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/tests/test_product_gate.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert active.identifier == "G05"\n'
          new = '    assert active.identifier == "G06"\n'
          if old not in text:
              raise SystemExit('committed active-phase assertion marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm -f .github/workflows/g06-phase-fixture-once.yml
          git add apps/api/tests/test_product_gate.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Advance product gate fixture to G06'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
