name: F04 payload repair preflight

on:
  push:
    branches:
      - automation/f04-vercel-deployment-baseline

permissions:
  contents: read
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact preconditions
        run: |
          mkdir -p "$RUNNER_TEMP/f04-preflight"
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          checks = {}
          archive = Path('ai-learning-platform.7z')
          checks['archive_exists'] = archive.is_file()
          checks['archive_bytes'] = archive.stat().st_size if archive.exists() else None

          checkpoint = Path('plans/autonomous-loop/checkpoint.md').read_text(encoding='utf-8')
          checks['checkpoint_archive_records'] = len(re.findall(
              r'- The tracked `ai-learning-platform\.7z` is 66,312,302 bytes and remains a separate\n  repository-hygiene repair pending reference and impact verification\.',
              checkpoint,
          ))

          inventory_md = Path('plans/implementation-inventory.md').read_text(encoding='utf-8')
          checks['inventory_archive_records'] = len(re.findall(
              r'- The externally created commit also tracks the unrelated 66,312,302-byte\n  `ai-learning-platform\.7z`\. This amendment does not modify it; its repository and\n  CI-checkout cost remains an explicit scope risk\.',
              inventory_md,
          ))
          checks['inventory_resource_records'] = len(re.findall(
              r'  build, confidentiality scan, and focused rereview pass\. Remote project and\n  Node/npm behavior are not yet reproducible from versioned\n  configuration, and build/artifact/cache/latency/runtime/cost measurements\n  remain absent\.',
              inventory_md,
          ))

          plan = Path('plans/F04-vercel-deployment-baseline.md').read_text(encoding='utf-8')
          checks['plan_status_sections'] = len(re.findall(r'\*\*Status:\*\*.*?\n\*\*Decision owner:\*\*', plan, re.S))
          checks['plan_performance_sections'] = len(re.findall(r'## Performance and Resources\n\n.*?\n\nThe alias proof used', plan, re.S))
          checks['plan_next_boundaries'] = len(re.findall(r'## Next Boundary\n\n.*\Z', plan, re.S))
          checks['plan_token_records'] = len(re.findall(
              r'A rejected personal-scope Vercel\ntoken was also revoked; the dedicated verifier token is short-lived and expires\n2026-07-22\.',
              plan,
          ))

          inventory = json.loads(Path('plans/implementation-inventory.json').read_text(encoding='utf-8'))
          checks['f04_phase_count'] = sum(1 for item in inventory.get('phases', []) if item.get('id') == 'F04')

          ci = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          checks['phase_gate_sections'] = ci.count('  phase-gate:\n')
          if '  phase-gate:\n' in ci and '\n  gate-projection:' in ci:
              phase = ci.split('  phase-gate:\n', 1)[1].split('\n  gate-projection:', 1)[0]
              checks['phase_install_anchors'] = phase.count('      - name: Install uv\n')
          else:
              checks['phase_install_anchors'] = 0

          output = Path(__import__('os').environ['RUNNER_TEMP']) / 'f04-preflight' / 'payload-preconditions.json'
          output.write_text(json.dumps(checks, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Upload preconditions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f04-payload-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/f04-preflight/payload-preconditions.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish preflight status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context="F04 / payload preflight"
          -f description="Payload repair preconditions recorded"
          -f target_url="$TARGET"
