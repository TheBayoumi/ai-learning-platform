name: Product web diagnostic

on:
  push:
    branches:
      - automation/product-vertical-slice

permissions:
  contents: read
  statuses: write

concurrency:
  group: product-web-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Capture web verification
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/product-web"
          mkdir -p "$output"
          npm install --global npm@11.18.0 >"$output/web.txt" 2>&1
          (
            cd apps/web
            npm ci
            echo "npm-ci=$?"
            npm run lint
            echo "lint=$?"
            npm run typecheck
            echo "typecheck=$?"
            npm test
            echo "test=$?"
            npm run build
            echo "build=$?"
          ) >>"$output/web.txt" 2>&1
      - name: Upload web diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-web-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/product-web
          if-no-files-found: error
          retention-days: 7
      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context="Product / web diagnostic"
          -f description="Exact web diagnostic artifact published"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
