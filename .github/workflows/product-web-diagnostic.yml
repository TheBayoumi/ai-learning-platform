name: Product web diagnostic

on:
  push:
    branches:
      - automation/product-vertical-slice

permissions:
  contents: read
  statuses: write

concurrency:
  group: product-web-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Apply pending web repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  if new in text:
                      return
                  raise RuntimeError(f"missing repair anchor: {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          replace(
              "apps/web/components/learning-platform.tsx",
              "  const loadPlatform = useCallback(async () => {\n    setBusy(true);\n    setError(null);\n    try {",
              "  const loadPlatform = useCallback(async () => {\n    try {",
          )
          replace(
              "apps/web/components/learning-platform.tsx",
              "          <button className=\"text-button\" type=\"button\" onClick={() => void loadPlatform()}>\n            Retry connection\n          </button>",
              "          <button\n            className=\"text-button\"\n            type=\"button\"\n            onClick={() => {\n              setBusy(true);\n              setError(null);\n              void loadPlatform();\n            }}\n          >\n            Retry connection\n          </button>",
          )
          replace(
              "apps/web/tests/home-page.test.tsx",
              '  ["available", "Local API available"],\n  ["unavailable", "Local API unavailable"],\n  ["invalid-response", "Local API response invalid"]',
              '  ["available", "Learning service online"],\n  ["unavailable", "Learning service unavailable"],\n  ["invalid-response", "Learning service contract mismatch"]',
          )
          PY
      - name: Capture web verification
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/product-web"
          mkdir -p "$output"
          npm install --global npm@11.18.0 >"$output/web.txt" 2>&1
          (
            cd apps/web
            npm ci
            echo "npm-ci=$?"
            npm run lint
            echo "lint=$?"
            npm run typecheck
            echo "typecheck=$?"
            npm test
            echo "test=$?"
            npm run build
            echo "build=$?"
          ) >>"$output/web.txt" 2>&1
      - name: Upload web diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-web-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/product-web
          if-no-files-found: error
          retention-days: 7
      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context="Product / web diagnostic"
          -f description="Exact repaired web diagnostic published"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
