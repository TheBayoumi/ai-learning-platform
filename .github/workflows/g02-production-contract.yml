name: G02 production contract update

on:
  push:
    branches:
      - product/g02-deterministic-evidence-state
    paths:
      - .github/workflows/g02-production-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/g02-deterministic-evidence-state
          fetch-depth: 0
      - name: Add G02 external evidence-state assertions and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/deploy-product.sh")
          text = path.read_text(encoding="utf-8")

          def replace_once(before: str, after: str, label: str) -> None:
              global text
              count = text.count(before)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(before, after)

          replace_once(
              '  and (.diagnostic_signal_percent | type) == "number"\n'
              '  and (has("readiness_percent") | not)\n'
              '  and (has("evidence_readiness_percent") | not)\n',
              '  and (.diagnostic_signal_percent | type) == "number"\n'
              '  and (.competency_evidence | length) == (.role.competencies | length)\n'
              '  and ([.competency_evidence[].status] | all(. == "unverified"))\n'
              '  and .evidence_evaluations == []\n'
              '  and .active_misconceptions == []\n'
              '  and .review_state == []\n'
              '  and (has("readiness_percent") | not)\n'
              '  and (has("evidence_readiness_percent") | not)\n',
              "plan-create evidence assertions",
          )

          replace_once(
              '  and .verified_readiness_percent == null\n'
              '  and (.evidence_history[-1].planning_signal_delta | type) == "number"\n',
              '  and .verified_readiness_percent == null\n'
              '  and (.evidence_history[-1].evidence_id | startswith("evidence-"))\n'
              '  and .evidence_history[-1].source == "learner_attested"\n'
              '  and .evidence_history[-1].disposition == "recorded"\n'
              '  and .evidence_history[-1].independence == "unverified"\n'
              '  and .evidence_history[-1].assistance == "unknown"\n'
              '  and .evidence_history[-1].reasoning == "submitted"\n'
              '  and (.evidence_history[-1].planning_signal_delta | type) == "number"\n'
              '  and (.evidence_history[-1].competency_id as $competency\n'
              '    | any(.competency_evidence[];\n'
              '        .competency_id == $competency and .status == "unverified"))\n'
              '  and .evidence_evaluations == []\n',
              "progress evidence assertions",
          )

          replace_once(
              '  --argjson progressed_planning_signal "$(jq \'.planning_signal_percent\' "$progress")" \\\n'
              "  '{\n"
              '    schema_version:2,\n',
              '  --argjson progressed_planning_signal "$(jq \'.planning_signal_percent\' "$progress")" \\\n'
              '  --arg attestation_source "$(jq -r \'.evidence_history[-1].source\' "$progress")" \\\n'
              '  --arg attestation_disposition "$(jq -r \'.evidence_history[-1].disposition\' "$progress")" \\\n'
              '  --arg attestation_competency "$(jq -r \'.evidence_history[-1].competency_id\' "$progress")" \\\n'
              "  '{\n"
              '    schema_version:3,\n',
              "evidence artifact arguments",
          )

          replace_once(
              '      verified_readiness:"locked",\n'
              '      initial_planning_signal:$initial_planning_signal,\n'
              '      progressed_planning_signal:$progressed_planning_signal\n',
              '      verified_readiness:"locked",\n'
              '      initial_planning_signal:$initial_planning_signal,\n'
              '      progressed_planning_signal:$progressed_planning_signal,\n'
              '      learner_attestation:{\n'
              '        source:$attestation_source,\n'
              '        disposition:$attestation_disposition,\n'
              '        competency_id:$attestation_competency,\n'
              '        competency_evidence_after_attestation:"unverified",\n'
              '        trusted_evaluator_public_route:"absent"\n'
              '      }\n',
              "evidence artifact journey",
          )

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/g02-production-contract.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Verify untrusted learner evidence stays unverified in production"
          git push origin HEAD:product/g02-deterministic-evidence-state
