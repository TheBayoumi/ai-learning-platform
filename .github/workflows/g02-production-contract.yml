name: G02 production contract update

on:
  push:
    branches:
      - product/g02-deterministic-evidence-state
    paths:
      - .github/workflows/g02-production-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: product/g02-deterministic-evidence-state
          fetch-depth: 0
      - name: Add G02 external evidence-state assertions and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/deploy-product.sh")
          text = path.read_text(encoding="utf-8")

          before = '''  and (.diagnostic_signal_percent | type) == "number"
          and (has("readiness_percent") | not)
          and (has("evidence_readiness_percent") | not)
          '''
          after = '''  and (.diagnostic_signal_percent | type) == "number"
          and (.competency_evidence | length) == (.role.competencies | length)
          and ([.competency_evidence[].status] | all(. == "unverified"))
          and .evidence_evaluations == []
          and .active_misconceptions == []
          and .review_state == []
          and (has("readiness_percent") | not)
          and (has("evidence_readiness_percent") | not)
          '''
          if text.count(before) != 1:
              raise SystemExit("plan-create evidence assertion marker mismatch")
          text = text.replace(before, after)

          before = '''  and .verified_readiness_percent == null
          and (.evidence_history[-1].planning_signal_delta | type) == "number"
          '''
          after = '''  and .verified_readiness_percent == null
          and (.evidence_history[-1].evidence_id | startswith("evidence-"))
          and .evidence_history[-1].source == "learner_attested"
          and .evidence_history[-1].disposition == "recorded"
          and .evidence_history[-1].independence == "unverified"
          and .evidence_history[-1].assistance == "unknown"
          and .evidence_history[-1].reasoning == "submitted"
          and (.evidence_history[-1].planning_signal_delta | type) == "number"
          and (.evidence_history[-1].competency_id as $competency
            | any(.competency_evidence[];
                .competency_id == $competency and .status == "unverified"))
          and .evidence_evaluations == []
          '''
          if text.count(before) != 1:
              raise SystemExit("progress evidence assertion marker mismatch")
          text = text.replace(before, after)

          before = '''  --argjson progressed_planning_signal "$(jq '.planning_signal_percent' "$progress")" \\
          '{
            schema_version:2,
          '''
          after = '''  --argjson progressed_planning_signal "$(jq '.planning_signal_percent' "$progress")" \\
          --arg attestation_source "$(jq -r '.evidence_history[-1].source' "$progress")" \\
          --arg attestation_disposition "$(jq -r '.evidence_history[-1].disposition' "$progress")" \\
          --arg attestation_competency "$(jq -r '.evidence_history[-1].competency_id' "$progress")" \\
          '{
            schema_version:3,
          '''
          if text.count(before) != 1:
              raise SystemExit("evidence artifact argument marker mismatch")
          text = text.replace(before, after)

          before = '''      verified_readiness:"locked",
                initial_planning_signal:$initial_planning_signal,
                progressed_planning_signal:$progressed_planning_signal
          '''
          after = '''      verified_readiness:"locked",
                initial_planning_signal:$initial_planning_signal,
                progressed_planning_signal:$progressed_planning_signal,
                learner_attestation:{
                  source:$attestation_source,
                  disposition:$attestation_disposition,
                  competency_id:$attestation_competency,
                  competency_evidence_after_attestation:"unverified",
                  trusted_evaluator_public_route:"absent"
                }
          '''
          if text.count(before) != 1:
              raise SystemExit("evidence artifact journey marker mismatch")
          text = text.replace(before, after)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/g02-production-contract.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Verify untrusted learner evidence stays unverified in production"
          git push origin HEAD:product/g02-deterministic-evidence-state
