name: F04 acceptance API diagnostic

on:
  push:
    branches:
      - automation/f04-vercel-deployment-baseline

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - name: Capture controller test failures
        working-directory: apps/api
        run: |
          mkdir -p "$RUNNER_TEMP/f04-acceptance-api"
          set +e
          uv sync --locked --all-groups >"$RUNNER_TEMP/f04-acceptance-api/sync.txt" 2>&1
          sync_status=$?
          if test "$sync_status" -eq 0; then
            uv run --locked pytest tests/test_phase_gate.py -vv --tb=long >"$RUNNER_TEMP/f04-acceptance-api/pytest.txt" 2>&1
            echo "$?" >"$RUNNER_TEMP/f04-acceptance-api/pytest.exit"
          else
            echo "$sync_status" >"$RUNNER_TEMP/f04-acceptance-api/sync.exit"
          fi
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f04-acceptance-api-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/f04-acceptance-api
          if-no-files-found: error
          retention-days: 7
      - name: Publish diagnostic run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context="F04 / acceptance API diagnostic"
          -f description="Controller failure artifact available"
          -f target_url="$TARGET"
