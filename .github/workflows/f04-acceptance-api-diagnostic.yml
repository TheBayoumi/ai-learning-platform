name: F04 acceptance API fixture repair

on:
  push:
    branches:
      - automation/f04-vercel-deployment-baseline

permissions:
  contents: write

concurrency:
  group: f04-acceptance-api-fixture-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - name: Synchronize dependencies
        working-directory: apps/api
        run: uv sync --locked --all-groups
      - name: Retarget accepted-state fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/tests/test_phase_gate.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          def replace_before(label: str, old: str, new: str, window: int) -> None:
              label_indexes = [index for index, line in enumerate(lines) if label in line]
              if len(label_indexes) != 1:
                  raise RuntimeError(f"{label}: expected one label, found {len(label_indexes)}")
              label_index = label_indexes[0]
              matches = [
                  index
                  for index in range(max(0, label_index - window), label_index)
                  if old in lines[index]
              ]
              if not matches:
                  if any(new in lines[index] for index in range(max(0, label_index - window), label_index)):
                      return
                  raise RuntimeError(f"{label}: baseline mutation not found")
              if len(matches) != 1:
                  raise RuntimeError(f"{label}: ambiguous baseline mutation")
              lines[matches[0]] = lines[matches[0]].replace(old, new, 1)

          def insert_in_function(function_name: str, anchor_text: str, insertion: list[str]) -> None:
              starts = [index for index, line in enumerate(lines) if line.startswith(f"def {function_name}")]
              if len(starts) != 1:
                  raise RuntimeError(f"{function_name}: expected one function")
              start = starts[0]
              end = next(
                  (index for index in range(start + 1, len(lines)) if lines[index].startswith("def ")),
                  len(lines),
              )
              marker = insertion[0].strip()
              if any(marker in line for line in lines[start:end]):
                  return
              anchors = [index for index in range(start, end) if anchor_text in lines[index]]
              if len(anchors) != 1:
                  raise RuntimeError(f"{function_name}: expected one anchor, found {len(anchors)}")
              anchor = anchors[0]
              close = next(
                  (
                      index
                      for index in range(anchor + 1, end)
                      if lines[index] == "        )"
                  ),
                  None,
              )
              if close is None:
                  raise RuntimeError(f"{function_name}: update close not found")
              lines[close + 1 : close + 1] = insertion

          replace_before(
              '"state_inventory_gate_disagreement"',
              'gate_decision="Continue"',
              'gate_decision="Revise"',
              10,
          )
          replace_before(
              '"state_controller_gate_disagreement"',
              'value.update(gate_decision="Continue")',
              'value.update(gate_decision="Revise")',
              8,
          )
          insert_in_function(
              "test_valid_new_foundation_successor_projects_start_action(controller_root: Path) -> None:",
              'next_action="Start the synthetic successor"',
              [
                  '        future = cast(dict[str, Any], value["future_phase_boundary"])',
                  "        future.update(",
                  "            phase=None,",
                  '            status="LOCKED_UNTIL_ACTIVE_PHASE_ACCEPTED",',
                  '            next_action="Start or complete F05 before evaluating a successor",',
                  "        )",
              ],
          )
          insert_in_function(
              "test_failed_entry_cannot_advance_implementation_to_acceptance(",
              'next_action="Repair the failed entry before acceptance"',
              [
                  '        future = cast(dict[str, Any], value["future_phase_boundary"])',
                  "        future.update(",
                  "            phase=None,",
                  '            status="LOCKED_UNTIL_ACTIVE_PHASE_ACCEPTED",',
                  '            next_action="Repair and accept F04 before evaluating a successor",',
                  "        )",
              ],
          )

          path.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Format repaired tests
        working-directory: apps/api
        run: uv run --locked ruff format tests/test_phase_gate.py
      - name: Refresh authoritative test hash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          test_path = Path("apps/api/tests/test_phase_gate.py")
          state_path = Path("plans/autonomous-loop/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          state["authoritative_file_hashes"][str(test_path)] = hashlib.sha256(
              test_path.read_bytes().replace(b"\r\n", b"\n")
          ).hexdigest()
          state_path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Check formatting
        working-directory: apps/api
        run: uv run --locked ruff format --check . ../../scripts
      - name: Lint
        working-directory: apps/api
        run: uv run --locked ruff check . ../../scripts
      - name: Type check
        working-directory: apps/api
        run: uv run --locked mypy src tests ../../scripts
      - name: Test with coverage
        working-directory: apps/api
        run: |
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest
          uv run --locked coverage report --fail-under=95
      - name: Validate accepted controller state
        run: >-
          uv run --project apps/api --locked python scripts/phase_gate.py validate
          --expected-sha "${{ github.sha }}"
      - name: Commit verified fixture repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add apps/api/tests/test_phase_gate.py plans/autonomous-loop/state.json
          git commit -m "test(f04): retarget accepted-state controller fixtures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
