name: F04 acceptance API fixture repair

on:
  push:
    branches:
      - automation/f04-vercel-deployment-baseline

permissions:
  contents: write

concurrency:
  group: f04-acceptance-api-fixture-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - name: Synchronize dependencies
        working-directory: apps/api
        run: uv sync --locked --all-groups
      - name: Retarget accepted-state fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/tests/test_phase_gate.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'lambda value: cast(dict[str, Any], value["foundation_track"]).update(\n                    gate_decision="Continue"\n                ),\n                "state_inventory_gate_disagreement",',
                  'lambda value: cast(dict[str, Any], value["foundation_track"]).update(\n                    gate_decision="Revise"\n                ),\n                "state_inventory_gate_disagreement",',
                  "foundation gate drift fixture",
              ),
              (
                  'lambda value: value.update(gate_decision="Continue"),\n                "state_controller_gate_disagreement",',
                  'lambda value: value.update(gate_decision="Revise"),\n                "state_controller_gate_disagreement",',
                  "controller gate drift fixture",
              ),
              (
                  '        foundation.update(\n            active_phase="F05",\n            status="NOT_STARTED",\n            gate_decision=None,\n            next_action="Start the synthetic successor",\n        )\n',
                  '        foundation.update(\n            active_phase="F05",\n            status="NOT_STARTED",\n            gate_decision=None,\n            next_action="Start the synthetic successor",\n        )\n        future = cast(dict[str, Any], value["future_phase_boundary"])\n        future.update(\n            phase=None,\n            status="LOCKED_UNTIL_ACTIVE_PHASE_ACCEPTED",\n            next_action="Start or complete F05 before evaluating a successor",\n        )\n',
                  "synthetic successor future boundary",
              ),
              (
                  '        foundation.update(\n            status="IMPLEMENTED_UNVERIFIED",\n            gate_decision=None,\n            next_action="Repair the failed entry before acceptance",\n        )\n',
                  '        foundation.update(\n            status="IMPLEMENTED_UNVERIFIED",\n            gate_decision=None,\n            next_action="Repair the failed entry before acceptance",\n        )\n        future = cast(dict[str, Any], value["future_phase_boundary"])\n        future.update(\n            phase=None,\n            status="LOCKED_UNTIL_ACTIVE_PHASE_ACCEPTED",\n            next_action="Repair and accept F04 before evaluating a successor",\n        )\n',
                  "failed transition future boundary",
              ),
          ]

          for old, new, label in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one baseline occurrence, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Format repaired tests
        working-directory: apps/api
        run: uv run --locked ruff format tests/test_phase_gate.py
      - name: Refresh authoritative test hash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          test_path = Path("apps/api/tests/test_phase_gate.py")
          state_path = Path("plans/autonomous-loop/state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          canonical = test_path.read_bytes().replace(b"\r\n", b"\n")
          state["authoritative_file_hashes"][str(test_path)] = hashlib.sha256(canonical).hexdigest()
          state_path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8", newline="\n")
          PY
      - name: Check formatting
        working-directory: apps/api
        run: uv run --locked ruff format --check . ../../scripts
      - name: Lint
        working-directory: apps/api
        run: uv run --locked ruff check . ../../scripts
      - name: Type check
        working-directory: apps/api
        run: uv run --locked mypy src tests ../../scripts
      - name: Test with coverage
        working-directory: apps/api
        run: |
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest
          uv run --locked coverage report --fail-under=95
      - name: Validate accepted controller state
        run: >-
          uv run --project apps/api --locked python scripts/phase_gate.py validate
          --expected-sha "${{ github.sha }}"
      - name: Commit verified fixture repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add apps/api/tests/test_phase_gate.py plans/autonomous-loop/state.json
          git commit -m "test(f04): retarget accepted-state controller fixtures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
