name: P01 controller contract repair

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 10
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: product/p01-postgres-learner-persistence
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api

      - name: Synchronize dependencies
        working-directory: apps/api
        run: uv sync --locked --all-groups

      - name: Apply bounded repairs
        run: python .github/scripts/p01_controller_contract_repair.py patch

      - name: Verify repairs
        working-directory: apps/api
        run: |
          uv run --locked ruff format \
            src/ai_learning_platform_api/automation/phase_gate.py \
            src/ai_learning_platform_api/transport/http/persistent_compatibility.py \
            tests/test_phase_gate.py
          uv run --locked ruff check . ../../scripts
          uv run --locked pytest tests/test_phase_gate.py

      - name: Refresh governed hashes
        run: python .github/scripts/p01_controller_contract_repair.py refresh-hashes

      - name: Remove one-shot repair files
        run: |
          git rm .github/workflows/p01-controller-contract-repair.yml
          git rm .github/scripts/p01_controller_contract_repair.py

      - name: Commit and push
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            apps/api/src/ai_learning_platform_api/automation/phase_gate.py \
            apps/api/src/ai_learning_platform_api/transport/http/persistent_compatibility.py \
            apps/api/tests/test_phase_gate.py \
            plans/autonomous-loop/state.json
          git commit -m "fix(ci): govern PR-only quality gates"
          git push origin HEAD:product/p01-postgres-learner-persistence
