name: G05 canonical schema refactor

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'product/g05-trusted-blueprint-instances' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Refactor G05 into canonical typed schemas
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('apps/api/src/ai_learning_platform_api')
          schemas = root / 'learning/schemas.py'
          text = schemas.read_text(encoding='utf-8')
          old_activity = '''class ActivityView(StrictModel):
              """One unique bounded work item in an adaptive learner plan."""

              id: str
              competency_id: str
              competency_name: str
              title: str
              objective: str
              deliverable: str
              acceptance_criteria: list[str]
              estimated_minutes: int
              kind: Literal["build", "review"] = "build"
              rationale: str = ""
              generation: int = 0
              available_from: str | None = None
          '''.replace('          ', '')
          new_activity = '''class ActivityView(StrictModel):
              """One unique bounded work item with explicit G05 blueprint provenance."""

              id: str
              competency_id: str
              competency_name: str
              title: str
              objective: str
              deliverable: str
              acceptance_criteria: list[str]
              estimated_minutes: int
              kind: Literal["build", "review"] = "build"
              rationale: str = ""
              generation: int = 0
              available_from: str | None = None
              item_family_id: str = ""
              item_family_version: str = ""
              item_family_trust: Literal["legacy_unverified", "trusted"] = "legacy_unverified"
              blueprint_id: str = ""
              blueprint_version: str = ""
              blueprint_trust: Literal["legacy_unverified", "trusted"] = "legacy_unverified"
              rubric_version: str = ""
              instance_seed: str = ""
              semantic_fingerprint: str = ""
              semantic_tokens: list[str] = Field(default_factory=list, max_length=12)
              scenario_tags: list[str] = Field(default_factory=list, max_length=8)
              plan_version_id: str = ""
              high_stakes_eligible: bool = False


          class TaskExposureView(StrictModel):
              """Persisted served-instance exposure for replay and collision rejection."""

              instance_id: str
              item_family_id: str
              item_family_version: str
              blueprint_id: str
              blueprint_version: str
              rubric_version: str
              plan_version_id: str
              semantic_fingerprint: str
              semantic_tokens: list[str] = Field(default_factory=list, max_length=12)
              high_stakes_eligible: bool = False
              served_at: str
          '''.replace('          ', '')
          if old_activity not in text:
              raise SystemExit('ActivityView block did not match expected source')
          text = text.replace(old_activity, new_activity, 1)
          old_plan = '''class LearnerPlanVersion(StrictModel):
              """Immutable learner-specific curriculum snapshot bound to exact target/profile versions."""

              plan_version_id: str
              revision: Annotated[int, Field(ge=0)]
              created_at: str
              trigger: CurriculumTrigger
              role_id: str
              role_version: str
              graph_version: str
              evidence_policy_version: str
              target_fingerprint: str
              weekly_hours: Annotated[int, Field(ge=2, le=40)]
              focus_competency_ids: list[str]
              priorities: list[PlanPrioritySnapshot]
              activities: list[ActivityView]
              delta: PlanDeltaView
          '''.replace('          ', '')
          new_plan = '''class LearnerPlanVersion(StrictModel):
              """Immutable learner-specific curriculum snapshot bound to exact target/profile versions."""

              plan_version_id: str
              revision: Annotated[int, Field(ge=0)]
              created_at: str
              trigger: CurriculumTrigger
              role_id: str
              role_version: str
              graph_version: str
              evidence_policy_version: str
              target_fingerprint: str
              weekly_hours: Annotated[int, Field(ge=2, le=40)]
              focus_competency_ids: list[str]
              priorities: list[PlanPrioritySnapshot]
              activities: list[ActivityView]
              delta: PlanDeltaView
              task_exposures: list[TaskExposureView] = Field(default_factory=list, max_length=64)
          '''.replace('          ', '')
          if old_plan not in text:
              raise SystemExit('LearnerPlanVersion block did not match expected source')
          schemas.write_text(text.replace(old_plan, new_plan, 1), encoding='utf-8')

          blueprints = root / 'learning/blueprints.py'
          text = blueprints.read_text(encoding='utf-8')
          text = text.replace(
              'from ai_learning_platform_api.learning.blueprint_contracts import (\n    TaskExposureView,\n    TrustedActivityView,\n)\n',
              'from ai_learning_platform_api.learning.schemas import ActivityView, TaskExposureView\n',
          )
          text = text.replace('TrustedActivityView', 'ActivityView')
          blueprints.write_text(text, encoding='utf-8')

          service = root / 'learning/blueprint_service.py'
          text = service.read_text(encoding='utf-8')
          text = text.replace(
              'from ai_learning_platform_api.learning.blueprint_contracts import (\n    TaskExposureView,\n    TrustedActivityView,\n    TrustedLearnerPlanVersion,\n)\n',
              '',
          )
          text = text.replace('TrustedActivityView', 'ActivityView')
          text = text.replace('TrustedLearnerPlanVersion', 'LearnerPlanVersion')
          text = text.replace(
              '    PlanView,\n    TargetView,\n    TrustedEvidenceVerdict,\n',
              '    PlanView,\n    TargetView,\n    TaskExposureView,\n    TrustedEvidenceVerdict,\n',
          )
          text = text.replace(
              '        prior_exposures = (\n            list(previous.task_exposures)\n            if isinstance(previous, LearnerPlanVersion)\n            else []\n        )\n',
              '        prior_exposures = list(previous.task_exposures) if previous is not None else []\n',
          )
          text = text.replace(
              '        trusted = ActivityView.model_validate(base.model_dump(mode="json"))\n        return attach_blueprint_identity(role=role, activity=trusted)\n',
              '        return attach_blueprint_identity(role=role, activity=base)\n',
          )
          text = text.replace(
              '        trusted_source = ActivityView.model_validate(source.model_dump(mode="json"))\n        review = ActivityView.model_validate(base.model_dump(mode="json"))\n',
              '        trusted_source = source\n        review = base\n',
          )
          text = text.replace(
              '            activity = ActivityView.model_validate(raw_activity.model_dump(mode="json"))\n',
              '            activity = raw_activity\n',
          )
          old_tail = '''        payload = base_version.model_dump(mode="json")
              payload["activities"] = [item.model_dump(mode="json") for item in finalized]
              payload["task_exposures"] = [item.model_dump(mode="json") for item in exposure_history]
              return LearnerPlanVersion.model_validate(payload)
          '''.replace('          ', '')
          new_tail = '''        return base_version.model_copy(
              update={"activities": finalized, "task_exposures": exposure_history}
          )
          '''.replace('          ', '')
          if old_tail not in text:
              raise SystemExit('blueprint service plan tail did not match expected source')
          text = text.replace(old_tail, new_tail, 1)
          text = text.replace(
              '        if source is None or not isinstance(source, ActivityView):\n            raise UntrustedInstanceEvidenceError\n        if not source.high_stakes_eligible:\n',
              '        if source is None or not source.high_stakes_eligible:\n',
          )
          service.write_text(text, encoding='utf-8')

          init_file = root / 'learning/__init__.py'
          init_file.write_text(
              '"""Learner diagnosis, planning, signed state, and trusted served-instance domain."""\n\n'
              'from ai_learning_platform_api.learning.blueprint_service import BlueprintLearningPlanService\n\n'
              'LearningPlanService = BlueprintLearningPlanService\n\n'
              '__all__ = ["LearningPlanService"]\n',
              encoding='utf-8',
          )

          persistence = root / 'persistence/service.py'
          text = persistence.read_text(encoding='utf-8')
          text = text.replace(
              'from ai_learning_platform_api.learning.service import LearningPlanService, SignedStateCodec\n',
              'from ai_learning_platform_api.learning import LearningPlanService\n'
              'from ai_learning_platform_api.learning.service import SignedStateCodec\n',
          )
          persistence.write_text(text, encoding='utf-8')

          legacy = root / 'learning/blueprint_contracts.py'
          if legacy.exists():
              legacy.unlink()
          PY
      - name: Apply canonical static fixes
        working-directory: apps/api
        run: |
          uv run --locked ruff check --fix src tests
          uv run --locked ruff format src tests
          uv run --locked mypy src tests ../../scripts
      - name: Commit canonical schema refactor
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/api
          git commit -m 'Refactor G05 into canonical typed schemas'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
