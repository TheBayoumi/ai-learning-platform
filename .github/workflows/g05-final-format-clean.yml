name: G05 final format and cleanup

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'product/g05-trusted-blueprint-instances' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Normalize permanent Python surface
        working-directory: apps/api
        run: |
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check --fix src tests migrations/versions
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check src tests migrations/versions
          uv run --locked mypy src tests ../../scripts
      - name: Remove temporary G05 workflows and commit
        run: |
          git rm -f .github/workflows/g05-state-evidence.yml .github/workflows/g05-final-format-clean.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          git commit -m 'Normalize final G05 implementation and remove helpers'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
