name: Release stale-contract repair

on:
  pull_request:
    types: [converted_to_draft]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 15 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/release-deployment-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: fix/release-deployment-preflight
          fetch-depth: 0
          persist-credentials: true
      - name: Repair stale test contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          web_path = Path('apps/web/tests/vercel-preview-verifier.test.ts')
          web = web_path.read_text(encoding='utf-8')
          web = web.replace('import { readFile } from "node:fs/promises";\nimport { fileURLToPath } from "node:url";\n\n', '')
          marker = '\n\ndescribe("deployed-page workflow secret boundary", () => {'
          if marker not in web:
              raise SystemExit('obsolete deployed-page workflow test marker not found')
          web = web.split(marker, 1)[0].rstrip() + '\n'
          web_path.write_text(web, encoding='utf-8', newline='\n')

          api_path = Path('apps/api/tests/test_postgres_account_deletion.py')
          api = api_path.read_text(encoding='utf-8')
          old = '''    async def counts() -> tuple[int, int, int, int]:
        async with runtime.engine.connect() as connection:
            account_count = await connection.scalar(select(func.count()).select_from(accounts))
            state_count = await connection.scalar(select(func.count()).select_from(learner_states))
            event_count = await connection.scalar(select(func.count()).select_from(learner_events))
            outbox_count = await connection.scalar(select(func.count()).select_from(outbox_records))
        return (
            int(account_count or 0),
            int(state_count or 0),
            int(event_count or 0),
            int(outbox_count or 0),
        )

    assert asyncio.run(counts()) == (1, 1, 1, 1)
'''
          new = '''    async def account_counts(account_id: str) -> tuple[int, int, int, int]:
        async with runtime.engine.connect() as connection:
            account_count = await connection.scalar(
                select(func.count()).select_from(accounts).where(accounts.c.id == account_id)
            )
            state_count = await connection.scalar(
                select(func.count())
                .select_from(learner_states)
                .where(learner_states.c.account_id == account_id)
            )
            event_count = await connection.scalar(
                select(func.count())
                .select_from(learner_events)
                .where(learner_events.c.account_id == account_id)
            )
            outbox_count = await connection.scalar(
                select(func.count())
                .select_from(
                    outbox_records.join(
                        learner_events,
                        outbox_records.c.event_id == learner_events.c.id,
                    )
                )
                .where(learner_events.c.account_id == account_id)
            )
        return (
            int(account_count or 0),
            int(state_count or 0),
            int(event_count or 0),
            int(outbox_count or 0),
        )

    assert asyncio.run(account_counts(_ACCOUNT_A)) == (0, 0, 0, 0)
    assert asyncio.run(account_counts(_ACCOUNT_B)) == (1, 1, 1, 1)
'''
          if old not in api:
              raise SystemExit('global deletion count assertion block not found')
          api_path.write_text(api.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git diff --check
      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/tests/vercel-preview-verifier.test.ts apps/api/tests/test_postgres_account_deletion.py
          git commit -m "test: repair stale release contracts"
          git push origin HEAD:fix/release-deployment-preflight
