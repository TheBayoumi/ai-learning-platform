name: Assessment mypy diagnostic

on:
  push:
    branches:
      - automation/assessment-calibration

permissions:
  contents: read
  statuses: write

concurrency:
  group: assessment-mypy-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply assessment orchestration
        run: |
          python scripts/apply_assessment_service_integration.py
          git checkout "$GITHUB_SHA" -- apps/api/tests/test_assessment_api.py

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api

      - name: Synchronize dependencies
        run: uv sync --project apps/api --locked --all-groups

      - name: Format generated source
        run: |
          uv run --project apps/api --locked ruff format apps/api scripts
          uv run --project apps/api --locked ruff check --fix --exit-zero apps/api scripts

      - name: Capture exact mypy output
        shell: bash
        run: |
          set +e
          uv run --project apps/api --locked mypy apps/api/src apps/api/tests scripts \
            >"$RUNNER_TEMP/assessment-mypy.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/assessment-mypy.txt"
          exit "$status"

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assessment-mypy-${{ github.sha }}
          path: ${{ runner.temp }}/assessment-mypy.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context="Product / assessment mypy diagnostic"
          -f description="Exact assessment type diagnostics published"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
