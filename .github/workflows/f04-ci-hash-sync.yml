name: F04 CI hash synchronization

on:
  push:
    branches:
      - work/f04-payload-hygiene

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Synchronize the canonical CI hash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          state_path = Path('plans/autonomous-loop/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          data = Path('.github/workflows/ci.yml').read_bytes().replace(b'\r\n', b'\n')
          digest = hashlib.sha256(data).hexdigest()
          if state['authoritative_file_hashes'].get('.github/workflows/ci.yml') == digest:
              raise SystemExit(0)
          state['authoritative_file_hashes']['.github/workflows/ci.yml'] = digest
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add plans/autonomous-loop/state.json
          git commit -m "chore(f04): bind payload CI gate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
