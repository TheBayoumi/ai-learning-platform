name: P03 public beta verification

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  verify:
    if: >-
      github.event.pull_request.number == 12 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'product/p03-publish-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_learning_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_learning_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_PLATFORM_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ai_learning_platform
    steps:
      - name: Check out exact P03 branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: product/p03-publish-readiness
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.18.0

      - name: Refresh deterministic locks and formatting
        working-directory: apps/api
        run: |
          uv lock
          uv sync --locked --all-groups
          uv run --locked ruff check --fix . ../../scripts
          uv run --locked ruff format . ../../scripts

      - name: Verify API contracts, typing, migrations, tests, and coverage
        working-directory: apps/api
        run: |
          uv run --locked python -m ai_learning_platform_api.contracts.health_openapi check openapi/health.openapi.json
          uv run --locked python -m ai_learning_platform_api.contracts.health_typescript check openapi/health.openapi.json ../web/server/contracts/generated/health-response.ts
          uv run --locked ruff format --check . ../../scripts
          uv run --locked ruff check . ../../scripts
          uv run --locked mypy src tests ../../scripts
          uv run --locked alembic upgrade head
          uv run --locked alembic downgrade base
          uv run --locked alembic upgrade head
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest
          uv run --locked coverage report --fail-under=95

      - name: Verify web security, tests, and production build
        working-directory: apps/web
        run: |
          npm run verify:build-toolchain
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Verify repository and deployment workflow hygiene
        run: |
          git diff --check
          test -s .github/workflows/product-deployment.yml
          grep -Fq "AI_PLATFORM_TUTOR_MODE" .github/workflows/product-deployment.yml
          grep -Fq "Content-Security-Policy" apps/web/server/security/headers.ts

      - name: Commit deterministic verification updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api apps/web scripts
          git commit -m "chore(release): apply verified locks and formatting"
          git push origin HEAD:product/p03-publish-readiness
