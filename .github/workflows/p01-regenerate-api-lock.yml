name: P01 Regenerate API Lock

on:
  push:
    branches: [product/p01-postgres-learner-persistence]

permissions:
  contents: write

concurrency:
  group: p01-api-lock
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: product/p01-postgres-learner-persistence
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - name: Add pinned persistence dependencies
        working-directory: apps/api
        run: >-
          uv add
          'sqlalchemy==2.0.51'
          'alembic==1.18.5'
          'psycopg[binary]==3.3.4'
      - name: Verify locked environment
        working-directory: apps/api
        run: uv sync --locked --all-groups
      - name: Remove one-shot workflow
        run: git rm .github/workflows/p01-regenerate-api-lock.yml
      - name: Commit generated dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/pyproject.toml apps/api/uv.lock
          git commit -m "build(p01): pin PostgreSQL persistence dependencies"
          git push origin HEAD:product/p01-postgres-learner-persistence
