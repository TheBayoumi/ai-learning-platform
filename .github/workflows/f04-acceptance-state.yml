name: F04 acceptance-state publication

on:
  push:
    branches:
      - automation/f04-vercel-deployment-baseline

permissions:
  contents: write

concurrency:
  group: f04-acceptance-state-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api

      - name: Publish F04 acceptance state
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from datetime import UTC, datetime
          from pathlib import Path

          sha = "76a90647f0028c58c3f7955fde575d4d21f2774c"
          deployment = "dpl_2Dq1ds1KoNWPLKMyHDtEEhAAZsiH"
          quality_run = "30001175093"
          vercel_run = "30001172411"
          state_path = Path("plans/autonomous-loop/state.json")
          inventory_path = Path("plans/implementation-inventory.json")
          current_state = json.loads(state_path.read_text(encoding="utf-8"))
          current_inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
          current_f04 = next(item for item in current_inventory["phases"] if item["id"] == "F04")
          if (
              current_state.get("active_slice") == "F04-acceptance-state-revision"
              and current_state.get("status") == "READY"
              and current_f04.get("status") == "PASSED"
          ):
              print("F04 acceptance state already published; validation-only rerun")
              raise SystemExit(0)

          now = datetime.now(UTC).isoformat(timespec="milliseconds").replace("+00:00", "Z")
          inventory = current_inventory
          inventory["generated_at"] = now
          inventory["repository"]["head"] = sha
          inventory["repository"]["working_tree"] = (
              f"F04 acceptance state: implementation {sha} passed READY deployment {deployment}, "
              f"Quality Gates run {quality_run}, and dedicated Vercel run {vercel_run}; "
              "no successor foundation phase is defined"
          )
          for source in [
              "plans/F04-vercel-resource-measurements-evidence.json",
              "plans/F04-vercel-deployment-baseline.md",
          ]:
              if source not in inventory["repository"]["source_of_truth"]:
                  inventory["repository"]["source_of_truth"].append(source)
          capability = (
              "exact-SHA Vercel build reproducibility, protected deployed-page verification, "
              "bounded resource measurements, and repository payload-hygiene enforcement"
          )
          if capability not in inventory["runtime_capabilities"]["implemented"]:
              inventory["runtime_capabilities"]["implemented"].append(capability)
          f04 = next(item for item in inventory["phases"] if item["id"] == "F04")
          for evidence in [
              f"Exact implementation {sha} deployed as {deployment} in READY preview state and passed dedicated Vercel run {vercel_run}",
              f"Exact Quality Gates run {quality_run} passed API quality, Web quality, Runtime smoke, Phase gate, and Gate projection on {sha}",
              "Resource parsing accepts only identical duplicated provider metrics, rejects conflicts, and normalizes bounded clone-duration seconds or milliseconds",
              "Payload hygiene passed with ai-learning-platform.7z absent and untracked and exactly one /ai-learning-platform.7z ignore rule",
          ]:
              if evidence not in f04["tests"]:
                  f04["tests"].append(evidence)
          f04.update(
              status="PASSED",
              gate_decision="Continue",
              missing_outputs=[],
              blocker_ids=[],
              external_blockers=[],
              human_decisions=[],
              next_smallest_action=(
                  "No further F04 implementation; confirm this acceptance-state revision's "
                  "exact checks and stop because no successor foundation phase is defined"
              ),
          )
          inventory_path.write_text(json.dumps(inventory, indent=2) + "\n", encoding="utf-8", newline="\n")

          plan_path = Path("plans/F04-vercel-deployment-baseline.md")
          plan = plan_path.read_text(encoding="utf-8")
          status = (
              f"**Status:** `PASSED / Continue`. Exact implementation `{sha}` is deployed as "
              f"`{deployment}` (`READY`) and passed all five Quality Gates in run "
              f"`{quality_run}` plus build reproducibility and protected deployed-page/resource "
              f"verification in run `{vercel_run}`. The payload gate passed. This separate "
              "acceptance-state revision records that evidence; its own exact checks are the "
              "final publication confirmation.\n**Decision owner:**"
          )
          plan, count = re.subn(
              r"\*\*Status:\*\*.*?\n\*\*Decision owner:\*\*",
              status,
              plan,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("F04 status section mismatch")
          section = f'''## Implementation Publication and Acceptance

Exact implementation revision `{sha}` passed the complete implementation-side F04
chain: Vercel deployment `{deployment}` reached `READY`; Quality Gates run
`{quality_run}` passed all five required jobs; dedicated run `{vercel_run}` passed
build reproducibility and protected deployed-page/resource verification; and the
repository payload gate passed. The verifier accepts identical duplicated provider
metrics, rejects conflicting values, and normalizes bounded clone durations reported
in seconds or milliseconds.

This separate state revision marks F04 `PASSED / Continue`. It does not define F05,
promote production, deploy FastAPI, satisfy V00, unlock V01, or make a readiness
claim. Its own exact checks remain the final publication confirmation.
'''
          if "## Implementation Publication and Acceptance" not in plan:
              marker = "\n## Data, Privacy, Security, and Compatibility\n"
              if marker not in plan:
                  raise RuntimeError("acceptance insertion marker missing")
              plan = plan.replace(marker, "\n" + section + marker, 1)
          plan = plan.replace(
              "F04 therefore remains `Revise`. The bounded traffic-reversion repair is now\ncomplete",
              "F04's traffic-reversion requirement is satisfied. The bounded proof is\ncomplete",
              1,
          )
          boundary = f'''## Next Boundary

F04 is `PASSED / Continue` based on implementation `{sha}`, deployment
`{deployment}`, Quality Gates run `{quality_run}`, and dedicated Vercel run
`{vercel_run}`. Require this acceptance-state revision's own exact Vercel and five
GitHub checks. Once confirmed, update pull request #5 as merge-ready and stop. No F05
is defined; do not invent one or merge without explicit instruction.
'''
          plan, count = re.subn(r"## Next Boundary\n\n.*\Z", boundary, plan, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError("next-boundary section mismatch")
          plan_path.write_text(plan, encoding="utf-8", newline="\n")

          checkpoint_path = Path("plans/autonomous-loop/checkpoint.md")
          checkpoint = checkpoint_path.read_text(encoding="utf-8")
          checkpoint_section = f'''## Run 29 F04 acceptance-state publication

Implementation `{sha}` passed READY deployment `{deployment}`, all five Quality Gates
in run `{quality_run}`, and both dedicated Vercel evidence jobs in run `{vercel_run}`.
The payload gate passed. This separate revision marks F04 `PASSED / Continue`, sets
the foundation frontier to `PHASE_PASSED`, and records `NO_DEFINED_SUCCESSOR`.
V00 remains externally blocked, V01 remains locked, and no merge is performed here.

'''
          if "## Run 29 F04 acceptance-state publication" not in checkpoint:
              checkpoint = checkpoint.replace(
                  "# Autonomous Loop Checkpoint\n\n",
                  "# Autonomous Loop Checkpoint\n\n" + checkpoint_section,
                  1,
              )
          checkpoint_path.write_text(checkpoint, encoding="utf-8", newline="\n")

          run_log_path = Path("plans/autonomous-loop/run-log.md")
          run_log = run_log_path.read_text(encoding="utf-8")
          run_section = f'''\n\n## Run 29 - 2026-07-23 (F04 acceptance-state publication)

Implementation `{sha}` passed Vercel deployment `{deployment}`, Quality Gates run
`{quality_run}`, and dedicated Vercel run `{vercel_run}`. This separate state revision
sets F04 to `PASSED / Continue`, clears all F04 blockers and missing outputs, records
the implementation SHA as last verified, and projects `NO_DEFINED_SUCCESSOR`. Its own
exact checks remain required. V00/V01 boundaries and all false readiness claims are
unchanged; no merge or F05 definition occurs.
'''
          if "## Run 29 - 2026-07-23 (F04 acceptance-state publication)" not in run_log:
              run_log += run_section
          run_log_path.write_text(run_log, encoding="utf-8", newline="\n")

          inventory_md_path = Path("plans/implementation-inventory.md")
          inventory_md = inventory_md_path.read_text(encoding="utf-8")
          intro = f'''Current exact implementation head
`{sha}` passed Vercel deployment `{deployment}`, all five Quality Gates in run
`{quality_run}`, and dedicated build/protected-page/resource run `{vercel_run}`.
The separate acceptance-state revision marks F04 `PASSED / Continue`; its own exact
checks remain the final publication confirmation. F03 remains durably accepted.
The machine-readable record is `plans/implementation-inventory.json`; this prose is
a synchronized human-readable projection.'''
          inventory_md, count = re.subn(
              r"Current bounded repair records.*?prose is a synchronized human-readable projection\.",
              intro,
              inventory_md,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("inventory introduction mismatch")
          projection = f'''- F04 - Vercel Deployment Baseline is `PASSED / Continue`. Exact
  implementation `{sha}` deployed as `{deployment}` (`READY`), passed all five
  Quality Gates in run `{quality_run}`, and passed build reproducibility plus
  protected deployed-page/resource verification in run `{vercel_run}`. Rollback
  reversion, confidentiality, real resource observations, and payload hygiene are
  bound by sanitized evidence. No API deployment, V00/V01 effect, production
  promotion, or readiness claim is introduced.'''
          inventory_md, count = re.subn(
              r"- F04 - Vercel Deployment Baseline is .*?(?=\n- Payload diagnostics)",
              projection,
              inventory_md,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("inventory F04 projection mismatch")
          inventory_md = inventory_md.replace(
              "| F04 | Foundation | `FAILED_RETRYABLE` | Verify payload hygiene, then publish the separate acceptance revision |",
              "| F04 | Foundation | `PASSED` | Exact implementation evidence passed; acceptance revision checks pending |",
              1,
          )
          inventory_md_path.write_text(inventory_md, encoding="utf-8", newline="\n")

          state = current_state
          state.update(
              status="READY",
              active_phase="F04",
              active_slice="F04-acceptance-state-revision",
              gate_decision="Continue",
              last_completed_action=(
                  f"Implementation {sha} passed READY deployment {deployment}, all five "
                  f"Quality Gates in run {quality_run}, and dedicated Vercel run {vercel_run}. "
                  "This separate revision marks F04 PASSED / Continue."
              ),
              next_action=(
                  "Require this acceptance revision's exact checks, then update PR #5 as "
                  "merge-ready and stop; do not merge without explicit instruction or define F05."
              ),
              stop_reason=(
                  "F04 is PASSED / Continue pending this exact acceptance revision. No successor "
                  "foundation phase is defined; V00 remains external and V01 remains locked."
              ),
              last_verified_commit=sha,
              run_number=29,
              last_run_started_at=now,
              last_run_completed_at=now,
          )
          state["foundation_track"] = {
              "active_phase": "F04",
              "status": "PHASE_PASSED",
              "gate_decision": "Continue",
              "next_action": "Confirm the acceptance revision and stop; no successor is defined.",
          }
          state["implementation_inventory"]["generated_at"] = now
          state["future_phase_boundary"] = {
              "phase": None,
              "status": "NO_DEFINED_SUCCESSOR",
              "next_action": "Stop after confirming F04 acceptance; do not invent F05.",
          }
          for path in [inventory_path, plan_path, checkpoint_path, run_log_path, inventory_md_path]:
              data = path.read_bytes().replace(b"\r\n", b"\n")
              state["authoritative_file_hashes"][str(path)] = hashlib.sha256(data).hexdigest()
          state_path.write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8", newline="\n")
          PY

      - name: Commit acceptance state
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add \
            plans/F04-vercel-deployment-baseline.md \
            plans/autonomous-loop/state.json \
            plans/autonomous-loop/checkpoint.md \
            plans/autonomous-loop/run-log.md \
            plans/implementation-inventory.json \
            plans/implementation-inventory.md
          git commit -m "Accept F04 Vercel deployment baseline"

      - name: Validate committed acceptance state
        run: >-
          uv run --project apps/api --locked python scripts/phase_gate.py validate
          --expected-sha "$(git rev-parse HEAD)"

      - name: Push validated acceptance state
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
