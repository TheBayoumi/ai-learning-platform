name: Runtime smoke diagnostic

on:
  push:
    branches:
      - automation/product-vertical-slice

permissions:
  contents: read
  statuses: write

concurrency:
  group: runtime-smoke-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Capture exact smoke output
        shell: bash
        run: |
          set +e
          output="$RUNNER_TEMP/runtime-smoke"
          mkdir -p "$output"
          npm install --global npm@11.18.0 >"$output/setup.txt" 2>&1
          (
            cd apps/api
            uv sync --locked --all-groups
          ) >>"$output/setup.txt" 2>&1
          (
            cd apps/web
            npm ci
          ) >>"$output/setup.txt" 2>&1
          uv run --project apps/api --locked python scripts/smoke.py \
            >"$output/smoke.txt" 2>&1
          echo "$?" >"$output/smoke.exit"
      - name: Upload smoke diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-smoke-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-smoke
          if-no-files-found: error
          retention-days: 7
      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context="Product / runtime smoke diagnostic"
          -f description="Exact runtime smoke artifact published"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
