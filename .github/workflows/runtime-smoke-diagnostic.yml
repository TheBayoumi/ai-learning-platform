name: Runtime smoke contract repair

on:
  push:
    branches:
      - automation/product-vertical-slice

permissions:
  contents: write
  statuses: write

concurrency:
  group: runtime-smoke-contract-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Retarget smoke verifier and fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          smoke_path = Path("apps/api/src/ai_learning_platform_api/development/smoke.py")
          smoke_text = smoke_path.read_text(encoding="utf-8")

          old_openapi = (
              'def _assert_openapi(response: HttpResponse, canonical_document: object) -> None:\n'
              '    body = _decode_json(response, path="/openapi.json")\n'
              '    if body != canonical_document:\n'
              '        raise SmokeFailure("/openapi.json does not match the canonical artifact")\n'
          )
          new_openapi = (
              'def _assert_openapi(response: HttpResponse, canonical_document: object) -> None:\n'
              '    body = _decode_json(response, path="/openapi.json")\n'
              '    if not isinstance(body, dict) or not isinstance(canonical_document, dict):\n'
              '        raise SmokeFailure("/openapi.json does not contain a canonical document")\n'
              '    if body.get("openapi") != canonical_document.get("openapi"):\n'
              '        raise SmokeFailure("/openapi.json changed the canonical OpenAPI version")\n'
              '    runtime_paths = body.get("paths", {})\n'
              '    canonical_paths = canonical_document.get("paths", {})\n'
              '    if not isinstance(runtime_paths, dict) or not isinstance(canonical_paths, dict):\n'
              '        raise SmokeFailure("/openapi.json changed the canonical paths shape")\n'
              '    for path, expected_path in canonical_paths.items():\n'
              '        if runtime_paths.get(path) != expected_path:\n'
              '            raise SmokeFailure(f"/openapi.json changed canonical path {path}")\n'
              '    runtime_components = body.get("components", {})\n'
              '    canonical_components = canonical_document.get("components", {})\n'
              '    if not isinstance(runtime_components, dict) or not isinstance(\n'
              '        canonical_components, dict\n'
              '    ):\n'
              '        raise SmokeFailure("/openapi.json changed the canonical components shape")\n'
              '    for section_name, expected_section in canonical_components.items():\n'
              '        runtime_section = runtime_components.get(section_name)\n'
              '        if not isinstance(expected_section, dict) or not isinstance(\n'
              '            runtime_section, dict\n'
              '        ):\n'
              '            raise SmokeFailure(\n'
              '                f"/openapi.json changed canonical component section {section_name}"\n'
              '            )\n'
              '        for component_name, expected_component in expected_section.items():\n'
              '            if runtime_section.get(component_name) != expected_component:\n'
              '                raise SmokeFailure(\n'
              '                    f"/openapi.json changed canonical component {component_name}"\n'
              '                )\n'
          )
          if smoke_text.count(old_openapi) != 1:
              raise RuntimeError("openapi verifier anchor must match exactly once")
          smoke_text = smoke_text.replace(old_openapi, new_openapi, 1)

          replacements = {
              'data-api-state="available"': "service-state-available",
              'data-api-state="unavailable"': "service-state-unavailable",
              'data-api-state="invalid-response"': "service-state-invalid-response",
              "Local API available": "Learning service online",
              "Local API unavailable": "Learning service unavailable",
              "Local API response invalid": "Learning service contract mismatch",
              'aria-labelledby="api-integration-heading"': 'aria-labelledby="learning-product-heading"',
              'aria-atomic="true"': "Build your personal path",
              'aria-labelledby="api-status-label"': "Junior Python Backend Engineer",
              "This status reports local process liveness only.": "Rate your current evidence",
          }
          updated_smoke = smoke_text
          for old, new in replacements.items():
              updated_smoke = updated_smoke.replace(old, new)
          smoke_path.write_text(updated_smoke, encoding="utf-8", newline="\n")

          runtime_test = Path("apps/api/tests/test_runtime_smoke.py")
          test_text = runtime_test.read_text(encoding="utf-8")
          old_openapi_test = (
              'def test_health_and_openapi_require_exact_contracts() -> None:\n'
              '    smoke._assert_health(\n'
              '        _json_response({"status": "ok", "detail": "process is live"}),\n'
              '        path="/health/live",\n'
              '        detail="process is live",\n'
              '    )\n'
              '    with pytest.raises(smoke.SmokeFailure, match="health contract"):\n'
              '        smoke._assert_health(\n'
              '            _json_response({"status": "ok", "detail": "different"}),\n'
              '            path="/health/live",\n'
              '            detail="process is live",\n'
              '        )\n'
              '    smoke._assert_openapi(_json_response({"openapi": "3.1.0"}), {"openapi": "3.1.0"})\n'
              '    with pytest.raises(smoke.SmokeFailure, match="canonical"):\n'
              '        smoke._assert_openapi(_json_response({"openapi": "different"}), {"openapi": "3.1.0"})\n'
          )
          new_openapi_test = (
              'def test_health_contract_is_exact_and_openapi_allows_product_extensions() -> None:\n'
              '    smoke._assert_health(\n'
              '        _json_response({"status": "ok", "detail": "process is live"}),\n'
              '        path="/health/live",\n'
              '        detail="process is live",\n'
              '    )\n'
              '    with pytest.raises(smoke.SmokeFailure, match="health contract"):\n'
              '        smoke._assert_health(\n'
              '            _json_response({"status": "ok", "detail": "different"}),\n'
              '            path="/health/live",\n'
              '            detail="process is live",\n'
              '        )\n'
              '    canonical = {\n'
              '        "openapi": "3.1.0",\n'
              '        "paths": {"/health/live": {"get": {"operationId": "health_live"}}},\n'
              '        "components": {"schemas": {"Health": {"type": "object"}}},\n'
              '    }\n'
              '    runtime = {\n'
              '        "openapi": "3.1.0",\n'
              '        "info": {"title": "Product API", "version": "0.1.0"},\n'
              '        "paths": {\n'
              '            **canonical["paths"],\n'
              '            "/api/v1/roles": {"get": {"operationId": "list_roles"}},\n'
              '        },\n'
              '        "components": {\n'
              '            "schemas": {\n'
              '                **canonical["components"]["schemas"],\n'
              '                "Role": {"type": "object"},\n'
              '            }\n'
              '        },\n'
              '    }\n'
              '    smoke._assert_openapi(_json_response(runtime), canonical)\n'
              '    runtime["paths"]["/health/live"] = {"get": {"operationId": "changed"}}\n'
              '    with pytest.raises(smoke.SmokeFailure, match="canonical path"):\n'
              '        smoke._assert_openapi(_json_response(runtime), canonical)\n'
              '    with pytest.raises(smoke.SmokeFailure, match="OpenAPI version"):\n'
              '        smoke._assert_openapi(_json_response({"openapi": "different"}), canonical)\n'
          )
          if test_text.count(old_openapi_test) != 1:
              raise RuntimeError("openapi test anchor must match exactly once")
          test_text = test_text.replace(old_openapi_test, new_openapi_test, 1)

          old_fixture = (
              'def _available_html() -> str:\n'
              '    return """<!doctype html>\n'
              '<section data-api-state="available" aria-labelledby="api-integration-heading">\n'
              '  <p role="status" aria-atomic="true" aria-labelledby="api-status-label">Local API available</p>\n'
              '  <p>This status reports local process liveness only.</p>\n'
              '</section>\n'
              '"""\n'
          )
          new_fixture = (
              'def _available_html() -> str:\n'
              '    return """<!doctype html>\n'
              '<section class="service-state service-state-available" aria-labelledby="learning-product-heading">\n'
              '  <h2 id="learning-product-heading">Build your personal path</h2>\n'
              '  <p role="status">Learning service online</p>\n'
              '  <p>Junior Python Backend Engineer</p>\n'
              '  <p>Rate your current evidence</p>\n'
              '</section>\n'
              '"""\n'
          )
          if test_text.count(old_fixture) != 1:
              raise RuntimeError("runtime smoke HTML fixture must match exactly once")
          test_text = test_text.replace(old_fixture, new_fixture, 1)

          old_state = (
              '        html = (\n'
              '            _available_html()\n'
              '            .replace(\'data-api-state="available"\', f\'data-api-state="{state}"\')\n'
              '            .replace("Local API available", label)\n'
              '        )\n'
          )
          new_state = (
              '        html = (\n'
              '            _available_html()\n'
              '            .replace("service-state-available", f"service-state-{state}")\n'
              '            .replace("Learning service online", label)\n'
              '        )\n'
          )
          if test_text.count(old_state) != 1:
              raise RuntimeError("runtime smoke state fixture must match exactly once")
          test_text = test_text.replace(old_state, new_state, 1)

          for old, new in replacements.items():
              test_text = test_text.replace(old, new)
          runtime_test.write_text(test_text, encoding="utf-8", newline="\n")

          for path in Path("apps/api/tests").rglob("*.py"):
              if path == runtime_test:
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="\n")
          PY

      - name: Synchronize dependencies
        run: |
          uv sync --project apps/api --locked --all-groups
          npm install --global npm@11.18.0
          npm ci --prefix apps/web

      - name: Verify API formatting lint and typing
        run: |
          uv run --project apps/api --locked ruff format apps/api scripts
          uv run --project apps/api --locked ruff check --fix apps/api scripts
          uv run --project apps/api --locked ruff format --check apps/api scripts
          uv run --project apps/api --locked ruff check apps/api scripts
          uv run --project apps/api --locked mypy apps/api/src apps/api/tests scripts

      - name: Verify API tests and coverage
        run: |
          uv run --project apps/api --locked coverage erase
          uv run --project apps/api --locked coverage run -m pytest
          uv run --project apps/api --locked coverage report --fail-under=95

      - name: Verify web source and production build
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Verify real cross-process runtime smoke
        run: uv run --project apps/api --locked python scripts/smoke.py

      - name: Commit verified repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add apps/api/src/ai_learning_platform_api/development/smoke.py apps/api/tests
          git commit -m "fix(product): align runtime smoke with learner UI"

      - name: Validate committed phase state
        run: >-
          uv run --project apps/api --locked python scripts/phase_gate.py validate
          --expected-sha "$(git rev-parse HEAD)"

      - name: Push verified repair
        run: |
          if test "$(git rev-parse HEAD)" != "${GITHUB_SHA}"; then
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish repair status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Runtime smoke contract passed' || 'Runtime smoke contract repair failed' }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state="$STATUS_STATE"
          -f context="Product / runtime smoke repair"
          -f description="$STATUS_DESCRIPTION"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
