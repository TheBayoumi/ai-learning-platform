name: Product deployment

on:
  push:
    branches:
      - main
      - automation/product-vertical-slice

permissions:
  contents: read
  statuses: write

concurrency:
  group: product-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Connected product deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEAM_ID: team_bZWPrEPMa4sBoWU7syo3ZIRZ
      FRONTEND_PROJECT_ID: prj_xAgw4qL8P9B1L7HUqVEISFE5QeXN
      BACKEND_PROJECT_NAME: ai-learning-platform-api
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce trusted exact-source boundary
        env:
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EXACT_REF: ${{ github.ref }}
          EXACT_SHA: ${{ github.sha }}
        run: |
          test "$EVENT_REPOSITORY" = "TheBayoumi/ai-learning-platform"
          test "$EVENT_AFTER" = "$EXACT_SHA"
          test "$EVENT_DELETED" != "true"
          case "$EXACT_REF" in
            refs/heads/main|refs/heads/automation/product-vertical-slice) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          jq -n --arg commit_sha "$EXACT_SHA" '{
            schema_version:1,
            result:"FAILED",
            commit_sha:$commit_sha,
            message:"Deployment did not reach completed verification"
          }' >"$RUNNER_TEMP/product-deployment-evidence.json"

      - name: Install deployment CLI
        run: |
          node --version
          npm install --global npm@11.18.0
          npm install --global vercel@56.5.0
          test "$(npm --version)" = "11.18.0"
          vercel --version

      - name: Provision projects and stable environment
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_API_TOKEN"
          auth=( -H "Authorization: Bearer $VERCEL_API_TOKEN" -H "Content-Type: application/json" )

          project_response="$RUNNER_TEMP/backend-project.json"
          status=$(curl -sS -o "$project_response" -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$BACKEND_PROJECT_NAME?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_API_TOKEN")
          if test "$status" = "404"; then
            status=$(curl -sS -o "$project_response" -w '%{http_code}' \
              -X POST "https://api.vercel.com/v11/projects?teamId=$TEAM_ID" \
              "${auth[@]}" \
              --data "$(jq -n \
                --arg name "$BACKEND_PROJECT_NAME" \
                '{name:$name, serverlessFunctionRegion:"fra1"}')")
          fi
          case "$status" in 200|201) ;; *) cat "$project_response"; exit 1 ;; esac
          backend_project_id=$(jq -er '.id' "$project_response")
          echo "BACKEND_PROJECT_ID=$backend_project_id" >>"$GITHUB_ENV"

          env_response="$RUNNER_TEMP/backend-env.json"
          curl -fsS \
            "https://api.vercel.com/v9/projects/$backend_project_id/env?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_API_TOKEN" >"$env_response"
          if ! jq -e '.envs[]? | select(.key == "AI_PLATFORM_LEARNER_STATE_SECRET")' \
            "$env_response" >/dev/null; then
            signing_secret=$(openssl rand -hex 32)
            curl -fsS -X POST \
              "https://api.vercel.com/v10/projects/$backend_project_id/env?upsert=true&teamId=$TEAM_ID" \
              "${auth[@]}" \
              --data "$(jq -n --arg value "$signing_secret" '[{
                key:"AI_PLATFORM_LEARNER_STATE_SECRET",
                value:$value,
                type:"sensitive",
                target:["preview","production"]
              }]')" >/dev/null
          fi

          curl -fsS -X POST \
            "https://api.vercel.com/v10/projects/$backend_project_id/env?upsert=true&teamId=$TEAM_ID" \
            "${auth[@]}" \
            --data '[{
              "key":"AI_PLATFORM_ENVIRONMENT",
              "value":"production",
              "type":"plain",
              "target":["preview","production"]
            }]' >/dev/null

          curl -fsS -X POST \
            "https://api.vercel.com/v10/projects/$FRONTEND_PROJECT_ID/env?upsert=true&teamId=$TEAM_ID" \
            "${auth[@]}" \
            --data '[{
              "key":"ENABLE_EXPERIMENTAL_COREPACK",
              "value":"1",
              "type":"plain",
              "target":["preview","production"]
            }]' >/dev/null

      - name: Deploy exact backend revision
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ env.TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.BACKEND_PROJECT_ID }}
        run: |
          set -euo pipefail
          deploy_args=(deploy --cwd apps/api --yes --archive=tgz --token "$VERCEL_TOKEN" --scope "$TEAM_ID")
          if test "$GITHUB_REF" = "refs/heads/main"; then
            deploy_args+=(--prod)
          fi
          vercel "${deploy_args[@]}" 2>&1 | tee "$RUNNER_TEMP/backend-deploy.txt"
          backend_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' \
            "$RUNNER_TEMP/backend-deploy.txt" | tail -n 1)
          test -n "$backend_url"
          echo "BACKEND_URL=$backend_url" >>"$GITHUB_ENV"

      - name: Connect frontend environment to backend
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          set -euo pipefail
          auth=( -H "Authorization: Bearer $VERCEL_API_TOKEN" -H "Content-Type: application/json" )
          if test "$GITHUB_REF" = "refs/heads/main"; then
            payload=$(jq -n --arg value "$BACKEND_URL" '[{
              key:"AI_PLATFORM_API_BASE_URL",
              value:$value,
              type:"plain",
              target:["production"]
            }]')
          else
            payload=$(jq -n --arg value "$BACKEND_URL" --arg branch "$GITHUB_REF_NAME" '[{
              key:"AI_PLATFORM_API_BASE_URL",
              value:$value,
              type:"plain",
              target:["preview"],
              gitBranch:$branch
            }]')
          fi
          curl -fsS -X POST \
            "https://api.vercel.com/v10/projects/$FRONTEND_PROJECT_ID/env?upsert=true&teamId=$TEAM_ID" \
            "${auth[@]}" --data "$payload" >/dev/null

      - name: Deploy exact frontend revision
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ env.TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ env.FRONTEND_PROJECT_ID }}
        run: |
          set -euo pipefail
          deploy_args=(deploy --yes --archive=tgz --token "$VERCEL_TOKEN" --scope "$TEAM_ID")
          if test "$GITHUB_REF" = "refs/heads/main"; then
            deploy_args+=(--prod)
          fi
          vercel "${deploy_args[@]}" 2>&1 | tee "$RUNNER_TEMP/frontend-deploy.txt"
          frontend_url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' \
            "$RUNNER_TEMP/frontend-deploy.txt" | tail -n 1)
          test -n "$frontend_url"
          echo "FRONTEND_URL=$frontend_url" >>"$GITHUB_ENV"

      - name: Verify deployed connected learner journey
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          bypass=()
          if test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"; then
            bypass=( -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" )
          fi

          curl -fsS "${bypass[@]}" "$BACKEND_URL/health/live" \
            | jq -e '.status == "ok"' >/dev/null
          curl -fsS "${bypass[@]}" "$BACKEND_URL/api/v1/roles" \
            | jq -e 'length == 1 and .[0].id == "junior-python-backend-engineer"' >/dev/null

          page=$(curl -fsS "${bypass[@]}" "$FRONTEND_URL/")
          grep -F "Career Atlas" <<<"$page" >/dev/null
          grep -F "Learning service online" <<<"$page" >/dev/null

          plan="$RUNNER_TEMP/deployed-plan.json"
          curl -fsS "${bypass[@]}" \
            -H "Content-Type: application/json" \
            -X POST "$FRONTEND_URL/api/platform/plans" \
            --data '{
              "learner_name":"Deployment Evidence Learner",
              "target_role":"junior-python-backend-engineer",
              "weekly_hours":8,
              "experience_summary":"Backend deployment verification",
              "ratings":[
                {"competency_id":"python","score":2},
                {"competency_id":"testing","score":2}
              ]
            }' >"$plan"
          jq -e '.state_token | length > 20' "$plan" >/dev/null
          jq -e '.current_activity.id | length > 5' "$plan" >/dev/null

          resume_payload="$RUNNER_TEMP/resume-payload.json"
          jq '{state_token}' "$plan" >"$resume_payload"
          curl -fsS "${bypass[@]}" \
            -H "Content-Type: application/json" \
            -X POST "$FRONTEND_URL/api/platform/plans/resume" \
            --data-binary "@$resume_payload" \
            | jq -e '.sequence == 0 and .completed_count == 0' >/dev/null

          progress_payload="$RUNNER_TEMP/progress-payload.json"
          jq '{state_token, activity_id:.current_activity.id, reflection:
            "The deployed API, same-origin proxy, signed resume, and progress transition were verified end to end."}' \
            "$plan" >"$progress_payload"
          progress="$RUNNER_TEMP/deployed-progress.json"
          curl -fsS "${bypass[@]}" \
            -H "Content-Type: application/json" \
            -X POST "$FRONTEND_URL/api/platform/progress" \
            --data-binary "@$progress_payload" >"$progress"
          jq -e '.sequence == 1 and .completed_count == 1' "$progress" >/dev/null

          environment=preview
          if test "$GITHUB_REF" = "refs/heads/main"; then
            environment=production
          fi
          jq -n \
            --arg commit_sha "$GITHUB_SHA" \
            --arg environment "$environment" \
            --arg backend_project_id "$BACKEND_PROJECT_ID" \
            --arg backend_url "$BACKEND_URL" \
            --arg frontend_project_id "$FRONTEND_PROJECT_ID" \
            --arg frontend_url "$FRONTEND_URL" \
            --argjson initial_readiness "$(jq '.readiness_percent' "$plan")" \
            --argjson progressed_readiness "$(jq '.readiness_percent' "$progress")" \
            '{
              schema_version:1,
              result:"PASSED",
              commit_sha:$commit_sha,
              environment:$environment,
              backend:{project_id:$backend_project_id,url:$backend_url,health:"ok",role_catalog:"ok"},
              frontend:{project_id:$frontend_project_id,url:$frontend_url,page:"ok",proxy:"ok"},
              journey:{create:"ok",resume:"ok",progress:"ok",initial_readiness:$initial_readiness,progressed_readiness:$progressed_readiness}
            }' >"$RUNNER_TEMP/product-deployment-evidence.json"

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-deployment-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/product-deployment-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Connected learner journey deployed' || 'Connected learner journey deployment failed' }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state="$STATUS_STATE"
          -f context="Product / deployed vertical slice"
          -f description="$STATUS_DESCRIPTION"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
