name: Product deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: product-deployment-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_FUNCTION_REGION: pdx1

jobs:
  deploy:
    name: Connected product deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce trusted exact-source boundary
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EXACT_REF: ${{ github.ref }}
          EXACT_SHA: ${{ github.sha }}
        run: |
          test "$EVENT_REPOSITORY" = "TheBayoumi/ai-learning-platform"
          test "$EXACT_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"

      - name: Validate required deployment credentials
        env:
          PERSISTENCE_MODE: ${{ vars.AI_PLATFORM_PERSISTENCE_MODE || 'postgres' }}
          DATABASE_URL: ${{ secrets.AI_PLATFORM_DATABASE_URL }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
        run: |
          if ! test -n "$VERCEL_API_TOKEN"; then
            echo "Missing required Actions secret: VERCEL_API_TOKEN" >&2
            exit 1
          fi
          case "$PERSISTENCE_MODE" in
            signed_state)
              ;;
            postgres)
              if ! test -n "$DATABASE_URL"; then
                echo "Missing required Actions secret: AI_PLATFORM_DATABASE_URL" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported persistence mode" >&2
              exit 1
              ;;
          esac
          unset DATABASE_URL VERCEL_API_TOKEN

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api

      - name: Validate persistence activation and migrate
        env:
          PERSISTENCE_MODE: ${{ vars.AI_PLATFORM_PERSISTENCE_MODE || 'postgres' }}
          AI_PLATFORM_DATABASE_URL: ${{ secrets.AI_PLATFORM_DATABASE_URL }}
        run: |
          case "$PERSISTENCE_MODE" in
            signed_state)
              ;;
            postgres)
              uv sync --project apps/api --locked --all-groups
              AI_PLATFORM_DATABASE_URL="$AI_PLATFORM_DATABASE_URL" \
                uv run --project apps/api --locked alembic \
                  --config apps/api/alembic.ini upgrade head
              AI_PLATFORM_DATABASE_URL="$AI_PLATFORM_DATABASE_URL" \
                uv run --project apps/api --locked python scripts/verify_recovery.py \
                  --expected-revision 20260808_02 \
                  --transaction-check
              ;;
            *)
              echo "Unsupported persistence mode" >&2
              exit 1
              ;;
          esac

      - name: Validate optional tutor activation
        env:
          TUTOR_MODE: ${{ vars.AI_PLATFORM_TUTOR_MODE || 'disabled' }}
        run: |
          case "$TUTOR_MODE" in
            disabled|vercel_ai_gateway)
              ;;
            *)
              echo "Unsupported tutor mode" >&2
              exit 1
              ;;
          esac

      - name: Configure Vercel function topology
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          TEAM_ID: team_bZWPrEPMa4sBoWU7syo3ZIRZ
          FRONTEND_PROJECT_ID: prj_xAgw4qL8P9B1L7HUqVEISFE5QeXN
          BACKEND_PROJECT_NAME: ai-learning-platform-api
        run: |
          backend_payload=$(jq -n \
            --arg region "$VERCEL_FUNCTION_REGION" \
            '{framework:"fastapi",serverlessFunctionRegion:$region}')
          curl -fsS -X PATCH \
            "https://api.vercel.com/v9/projects/$BACKEND_PROJECT_NAME?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$backend_payload" \
            | jq -e --arg region "$VERCEL_FUNCTION_REGION" \
                '.framework == "fastapi" and .serverlessFunctionRegion == $region' >/dev/null

          frontend_payload=$(jq -n \
            --arg region "$VERCEL_FUNCTION_REGION" \
            '{serverlessFunctionRegion:$region}')
          curl -fsS -X PATCH \
            "https://api.vercel.com/v9/projects/$FRONTEND_PROJECT_ID?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$frontend_payload" \
            | jq -e --arg region "$VERCEL_FUNCTION_REGION" \
                '.serverlessFunctionRegion == $region' >/dev/null
          unset backend_payload frontend_payload

      - name: Configure backend runtime environment
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          TEAM_ID: team_bZWPrEPMa4sBoWU7syo3ZIRZ
          BACKEND_PROJECT_NAME: ai-learning-platform-api
          PERSISTENCE_MODE: ${{ vars.AI_PLATFORM_PERSISTENCE_MODE || 'postgres' }}
          TUTOR_MODE: ${{ vars.AI_PLATFORM_TUTOR_MODE || 'disabled' }}
          DATABASE_URL: ${{ secrets.AI_PLATFORM_DATABASE_URL }}
        run: |
          payload=$(jq -n \
            --arg persistence_mode "$PERSISTENCE_MODE" \
            --arg tutor_mode "$TUTOR_MODE" '[
              {
                key:"AI_PLATFORM_PERSISTENCE_MODE",
                value:$persistence_mode,
                type:"plain",
                target:["preview","production"]
              },
              {
                key:"AI_PLATFORM_TUTOR_MODE",
                value:$tutor_mode,
                type:"plain",
                target:["preview","production"]
              }
            ]')
          if test "$PERSISTENCE_MODE" = "postgres"; then
            payload=$(jq -n \
              --arg persistence_mode "$PERSISTENCE_MODE" \
              --arg tutor_mode "$TUTOR_MODE" \
              --arg database_url "$DATABASE_URL" '[
                {
                  key:"AI_PLATFORM_PERSISTENCE_MODE",
                  value:$persistence_mode,
                  type:"plain",
                  target:["preview","production"]
                },
                {
                  key:"AI_PLATFORM_TUTOR_MODE",
                  value:$tutor_mode,
                  type:"plain",
                  target:["preview","production"]
                },
                {
                  key:"AI_PLATFORM_DATABASE_URL",
                  value:$database_url,
                  type:"sensitive",
                  target:["preview","production"]
                }
              ]')
          fi
          curl -fsS -X POST \
            "https://api.vercel.com/v10/projects/$BACKEND_PROJECT_NAME/env?upsert=true&teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" >/dev/null
          unset payload DATABASE_URL

      - name: Deploy and verify connected product
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          TEAM_ID: team_bZWPrEPMa4sBoWU7syo3ZIRZ
          FRONTEND_PROJECT_ID: prj_xAgw4qL8P9B1L7HUqVEISFE5QeXN
          BACKEND_PROJECT_NAME: ai-learning-platform-api
          EVIDENCE_PATH: ${{ runner.temp }}/product-deployment-evidence.json
        run: bash scripts/deploy-product.sh

      - name: Finalize sanitized deployment evidence
        if: always()
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/product-deployment-evidence.json
        run: |
          if ! test -f "$EVIDENCE_PATH"; then
            jq -n --arg commit_sha "$GITHUB_SHA" '{
              schema_version:1,
              result:"FAILED",
              commit_sha:$commit_sha,
              phase:"preflight",
              message:"Deployment did not reach application deployment"
            }' >"$EVIDENCE_PATH"
          fi
          test -f "$RUNNER_TEMP/backend-deploy.txt" || : >"$RUNNER_TEMP/backend-deploy.txt"
          test -f "$RUNNER_TEMP/frontend-deploy.txt" || : >"$RUNNER_TEMP/frontend-deploy.txt"

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-deployment-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/product-deployment-evidence.json
            ${{ runner.temp }}/backend-deploy.txt
            ${{ runner.temp }}/frontend-deploy.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ job.status == 'success' && 'Connected learner journey deployed' || 'Connected learner journey deployment failed' }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state="$STATUS_STATE"
          -f context="Product / deployed vertical slice"
          -f description="$STATUS_DESCRIPTION"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
