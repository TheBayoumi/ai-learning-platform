name: F04 inventory timestamp synchronization

on:
  push:
    branches:
      - work/f04-payload-hygiene

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Align state run timestamps to the inventory snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path('plans/autonomous-loop/state.json')
          inventory_path = Path('plans/implementation-inventory.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          timestamp = inventory['generated_at']
          changed = False
          for key in ('last_run_started_at', 'last_run_completed_at'):
              if state.get(key) != timestamp:
                  state[key] = timestamp
                  changed = True
          if changed:
              state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add plans/autonomous-loop/state.json
          git commit -m "fix(f04): align inventory run timestamp"
          git push origin "HEAD:${GITHUB_REF_NAME}"
