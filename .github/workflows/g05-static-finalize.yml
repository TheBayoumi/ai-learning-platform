name: G05 static finalizer

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'product/g05-trusted-blueprint-instances' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Apply final typing corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          postgres = Path('apps/api/src/ai_learning_platform_api/persistence/postgres.py')
          text = postgres.read_text(encoding='utf-8')
          if 'from datetime import datetime\n' not in text:
              text = text.replace(
                  'from collections.abc import Mapping\n',
                  'from collections.abc import Mapping\nfrom datetime import datetime\n',
                  1,
              )
          text = text.replace(
              '        statement = (\n            postgresql_insert(task_exposures)\n',
              '        statement: Any = (\n            postgresql_insert(task_exposures)\n',
              1,
          )
          postgres.write_text(text, encoding='utf-8')

          test = Path('apps/api/tests/test_g05_durable_exposure_index.py')
          text = test.read_text(encoding='utf-8')
          if 'from typing import cast\n' not in text:
              text = text.replace('from uuid import UUID\n', 'from typing import cast\nfrom uuid import UUID\n', 1)
          if '    LearnerStateRepository,\n' not in text:
              text = text.replace(
                  '    LearnerStateCommit,\n',
                  '    LearnerStateCommit,\n    LearnerStateRepository,\n',
                  1,
              )
          if '    StoredLearnerState,\n' not in text:
              text = text.replace(
                  '    LearnerStateRepository,\n',
                  '    LearnerStateRepository,\n    StoredLearnerState,\n',
                  1,
              )
          text = text.replace(
              '    async def load(self, *, account_id: str, learner_id: UUID):\n',
              '    async def load(\n'
              '        self, *, account_id: str, learner_id: UUID\n'
              '    ) -> StoredLearnerState | None:\n',
              1,
          )
          text = text.replace(
              '    async def commit(self, request: LearnerStateCommit):\n',
              '    async def commit(self, request: LearnerStateCommit) -> StoredLearnerState:\n',
              1,
          )
          text = text.replace(
              '        repository=NoopStateRepository(),\n',
              '        repository=cast(LearnerStateRepository, NoopStateRepository()),\n',
              1,
          )
          test.write_text(text, encoding='utf-8')
          PY
      - name: Format and verify
        working-directory: apps/api
        run: |
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check --fix src tests migrations/versions
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check src tests migrations/versions
          uv run --locked mypy src tests ../../scripts
          uv run --locked pytest tests/test_g05_blueprint_instances.py tests/test_g05_human_simulation.py tests/test_g05_durable_exposure_index.py -q
      - name: Commit static finalization
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api
          git commit -m 'Finalize G05 durable exposure static contracts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
