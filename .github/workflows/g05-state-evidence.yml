name: G05 evidence state once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'product/g05-trusted-blueprint-instances' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Record permanent G05 evidence paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('plans/adaptive-product-state.json')
          state = json.loads(path.read_text(encoding='utf-8'))
          phase = next(item for item in state['phases'] if item['id'] == 'G05')
          for evidence in [
              'apps/api/src/ai_learning_platform_api/learning/blueprint_approval_manifest.py',
          ]:
              if evidence not in phase['implementation_evidence']:
                  phase['implementation_evidence'].append(evidence)
          for evidence in [
              'apps/api/tests/test_g05_trust_edge_cases.py',
              'apps/api/tests/test_g05_exposure_race.py',
          ]:
              if evidence not in phase['test_evidence']:
                  phase['test_evidence'].append(evidence)
          for simulation in [
              'concurrent exposure-race learner',
              'catalog objective-change learner',
          ]:
              if simulation not in phase['human_simulations']:
                  phase['human_simulations'].append(simulation)
          for evidence in [
              'apps/api/tests/test_g05_trust_edge_cases.py',
              'apps/api/tests/test_g05_exposure_race.py',
          ]:
              if evidence not in phase['human_simulation_evidence']:
                  phase['human_simulation_evidence'].append(evidence)
          path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Commit state evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plans/adaptive-product-state.json
          git commit -m 'Record hardened G05 acceptance evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
