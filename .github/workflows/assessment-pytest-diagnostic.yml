name: Assessment pytest diagnostic

on:
  push:
    branches:
      - automation/assessment-calibration

permissions:
  contents: read
  statuses: write

concurrency:
  group: assessment-pytest-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply assessment orchestration
        run: |
          python scripts/apply_assessment_service_integration.py
          git checkout "$GITHUB_SHA" -- apps/api/tests/test_assessment_api.py

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.18"
          python-version: "3.13.13"
          enable-cache: true
          working-directory: apps/api

      - name: Synchronize dependencies
        run: uv sync --project apps/api --locked --all-groups

      - name: Format generated source
        run: |
          uv run --project apps/api --locked ruff format apps/api scripts
          uv run --project apps/api --locked ruff check --fix --exit-zero apps/api scripts

      - name: Capture exact tests and coverage
        shell: bash
        working-directory: apps/api
        run: |
          set +e
          output="$RUNNER_TEMP/assessment-tests.txt"
          uv run --locked coverage erase >"$output" 2>&1
          uv run --locked coverage run -m pytest >>"$output" 2>&1
          test_status=$?
          uv run --locked coverage report --fail-under=95 >>"$output" 2>&1
          coverage_status=$?
          cat "$output"
          if test "$test_status" -ne 0 || test "$coverage_status" -ne 0; then
            exit 1
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assessment-tests-${{ github.sha }}
          path: ${{ runner.temp }}/assessment-tests.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context="Product / assessment pytest diagnostic"
          -f description="Exact assessment test diagnostics published"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
