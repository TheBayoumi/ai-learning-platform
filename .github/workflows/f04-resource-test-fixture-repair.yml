name: F04 resource test fixture repair

on:
  push:
    branches:
      - automation/f04-vercel-deployment-baseline

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind the discovery runtime to recorded sleeps
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          test_path = Path('apps/web/tests/vercel-resource-measurement-verifier.test.ts')
          test = test_path.read_text(encoding='utf-8')
          replacements = [
              (
                  'function exactDeployment() {',
                  'function exactDeployment(sleep: (milliseconds: number) => Promise<void> = async () => undefined) {'
              ),
              (
                  '      sleep: async () => undefined',
                  '      sleep'
              ),
              (
                  '    discoverDeployment: async () => exactDeployment(),',
                  '    discoverDeployment: async () =>\n      exactDeployment(async (milliseconds: number) => {\n        sleeps.push(milliseconds);\n      }),' 
              ),
          ]
          for old, new in replacements:
              if test.count(old) != 1:
                  raise SystemExit(f'unexpected fixture replacement count for: {old}')
              test = test.replace(old, new)
          test_path.write_text(test, encoding='utf-8', newline='\n')

          state_path = Path('plans/autonomous-loop/state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          data = test_path.read_bytes().replace(b'\r\n', b'\n')
          state['authoritative_file_hashes'][str(test_path)] = hashlib.sha256(data).hexdigest()
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY
          git config user.name "TheBayoumi Automation"
          git config user.email "107598562+TheBayoumi@users.noreply.github.com"
          git add apps/web/tests/vercel-resource-measurement-verifier.test.ts plans/autonomous-loop/state.json
          git commit -m "fix(f04): bind resource retry fixture"
          git push origin "HEAD:${GITHUB_REF_NAME}"
