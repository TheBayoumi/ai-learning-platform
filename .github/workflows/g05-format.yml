name: G05 format once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'product/g05-trusted-blueprint-instances' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Format exact G05 Python surface
        working-directory: apps/api
        run: |
          uv run --locked ruff format \
            src/ai_learning_platform_api/learning/blueprint_service.py \
            src/ai_learning_platform_api/learning/blueprints.py \
            tests/test_g05_durable_exposure_index.py
          uv run --locked ruff format --check \
            src/ai_learning_platform_api/learning/blueprint_service.py \
            src/ai_learning_platform_api/learning/blueprints.py \
            tests/test_g05_durable_exposure_index.py
      - name: Commit formatting only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/api/src/ai_learning_platform_api/learning/blueprint_service.py \
            apps/api/src/ai_learning_platform_api/learning/blueprints.py \
            apps/api/tests/test_g05_durable_exposure_index.py
          git commit -m 'Format hardened G05 implementation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
