name: G06 focused verifier once

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'product/g06-retention-transfer-engine' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.18'
          python-version: '3.13.13'
          enable-cache: true
          working-directory: apps/api
      - name: Normalize and verify G06
        run: |
          set +e
          cd apps/api
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check --fix src tests migrations/versions
          uv run --locked ruff format src tests migrations/versions
          uv run --locked ruff check src tests migrations/versions > /tmp/g06.txt 2>&1
          c1=$?
          if [ "$c1" -eq 0 ]; then
            uv run --locked mypy src tests ../../scripts >> /tmp/g06.txt 2>&1
            c1=$?
          fi
          if [ "$c1" -eq 0 ]; then
            uv run --locked pytest tests/test_g06_retention_transfer.py tests/test_g06_human_simulation.py tests/test_evidence_state.py -q >> /tmp/g06.txt 2>&1
            c1=$?
          fi
          cat /tmp/g06.txt
          cd ../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$c1" -ne 0 ]; then
            cp /tmp/g06.txt plans/g06-focused-failure.txt
            git add plans/g06-focused-failure.txt
            git commit -m 'Capture G06 focused verification failure'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            exit "$c1"
          fi
          git rm -f .github/workflows/g06-wire-once.yml .github/workflows/g06-focused-once.yml 2>/dev/null || true
          git add apps/api plans/adaptive-product-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize verified G06 retention and transfer engine'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
